<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Principles Builder — L03</title>
<style>
:root{--teal:#01696f;--orange:#da7101;--blue:#006494;--purple:#a12c7b;--green:#437a22;--bg:#f7f6f2;--card:#fff;--border:#dcd9d5;--text:#28251d;--muted:#7a7974;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:20px;}
h1{font-size:1.2rem;font-weight:700;color:var(--orange);margin-bottom:4px;}
.subtitle{font-size:.85rem;color:var(--muted);margin-bottom:18px;}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:960px;margin:0 auto;}
@media(max-width:660px){.layout{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;}
.card h2{font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;}
canvas{display:block;width:100%;border-radius:8px;}
select{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--border);font-size:.9rem;background:var(--bg);color:var(--text);margin-bottom:14px;}
.step-card{background:var(--bg);border-radius:8px;padding:12px 14px;margin:6px 0;border-left:3px solid var(--border);opacity:.4;transition:all .3s;}
.step-card.active{opacity:1;border-left-color:var(--orange);}
.step-card .step-num{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);margin-bottom:4px;}
.step-card .step-math{font-size:1rem;font-weight:700;color:var(--text);font-family:monospace;line-height:1.5;}
.step-card .step-note{font-size:.8rem;color:var(--muted);margin-top:3px;}
.btn-row{display:flex;gap:8px;margin-top:12px;}
.btn{padding:8px 18px;border-radius:20px;border:none;font-size:.83rem;font-weight:700;cursor:pointer;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-secondary{background:var(--bg);border:1.5px solid var(--border);color:var(--muted);}
.result-box{background:#e8f5e9;border-radius:8px;padding:12px;margin-top:10px;font-size:1rem;font-weight:700;color:var(--green);display:none;border-left:3px solid var(--green);}
</style>
</head>
<body>
<div style="max-width:960px;margin:0 auto">
<h1>First Principles Builder</h1>
<p class="subtitle">L03 — Step through the derivation of f′(x) from the definition</p>
<div class="layout">
  <div class="card">
    <h2>Choose function</h2>
    <select id="fnSel">
      <option value="x2">f(x) = x²</option>
      <option value="x3">f(x) = x³</option>
      <option value="x2p3x">f(x) = x² + 3x</option>
      <option value="2x2m1">f(x) = 2x² − 1</option>
    </select>
    <div id="steps"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="nextBtn">Next Step</button>
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
  <div class="card">
    <h2>Geometric view</h2>
    <canvas id="cv" width="420" height="360"></canvas>
    <p style="font-size:.8rem;color:var(--muted);margin-top:8px">Orange chord shows the secant. As you step through, h shrinks and the chord approaches the tangent (purple).</p>
  </div>
</div>
</div>
<script>
const derivations = {
  x2:{
    fx:'x²',
    steps:[
      {num:'Step 1',math:'f(x+h) = (x+h)²',note:'Substitute (x+h) into f'},
      {num:'Step 2',math:'= x² + 2xh + h²',note:'Expand the bracket'},
      {num:'Step 3',math:'f(x+h) − f(x) = 2xh + h²',note:'Subtract f(x) = x²'},
      {num:'Step 4',math:'[f(x+h)−f(x)]/h = 2x + h',note:'Divide by h (h ≠ 0)'},
      {num:'Step 5',math:'lim[h→0] = 2x',note:'Let h → 0'},
    ],
    result:"f′(x) = 2x",
    f:x=>x*x,fd:x=>2*x
  },
  x3:{
    fx:'x³',
    steps:[
      {num:'Step 1',math:'f(x+h) = (x+h)³',note:'Substitute (x+h)'},
      {num:'Step 2',math:'= x³ + 3x²h + 3xh² + h³',note:'Expand'},
      {num:'Step 3',math:'f(x+h)−f(x) = 3x²h + 3xh² + h³',note:'Subtract x³'},
      {num:'Step 4',math:'[...]/h = 3x² + 3xh + h²',note:'Divide by h'},
      {num:'Step 5',math:'lim[h→0] = 3x²',note:'Let h → 0'},
    ],
    result:"f′(x) = 3x²",
    f:x=>x*x*x,fd:x=>3*x*x
  },
  x2p3x:{
    fx:'x² + 3x',
    steps:[
      {num:'Step 1',math:'f(x+h) = (x+h)² + 3(x+h)',note:'Substitute'},
      {num:'Step 2',math:'= x²+2xh+h² + 3x+3h',note:'Expand'},
      {num:'Step 3',math:'f(x+h)−f(x) = 2xh+h²+3h',note:'Subtract x²+3x'},
      {num:'Step 4',math:'[...]/h = 2x + h + 3',note:'Divide by h'},
      {num:'Step 5',math:'lim[h→0] = 2x + 3',note:'Let h → 0'},
    ],
    result:"f′(x) = 2x + 3",
    f:x=>x*x+3*x,fd:x=>2*x+3
  },
  '2x2m1':{
    fx:'2x² − 1',
    steps:[
      {num:'Step 1',math:'f(x+h) = 2(x+h)² − 1',note:'Substitute'},
      {num:'Step 2',math:'= 2x²+4xh+2h² − 1',note:'Expand'},
      {num:'Step 3',math:'f(x+h)−f(x) = 4xh+2h²',note:'Subtract 2x²−1'},
      {num:'Step 4',math:'[...]/h = 4x + 2h',note:'Divide by h'},
      {num:'Step 5',math:'lim[h→0] = 4x',note:'Let h → 0'},
    ],
    result:"f′(x) = 4x",
    f:x=>2*x*x-1,fd:x=>4*x
  }
};

let cur='x2',step=0;

document.getElementById('fnSel').addEventListener('change',e=>{cur=e.target.value;step=0;render();drawGeo(1);});
document.getElementById('nextBtn').addEventListener('click',()=>{
  const d=derivations[cur];
  if(step<d.steps.length){step++;render();drawGeo(Math.max(0.05,1-(step/d.steps.length)*0.95));}
});
document.getElementById('resetBtn').addEventListener('click',()=>{step=0;render();drawGeo(1);});

function render(){
  const d=derivations[cur];
  const container=document.getElementById('steps');
  container.innerHTML=d.steps.map((s,i)=>`
    <div class="step-card ${i<step?'active':''}">
      <div class="step-num">${s.num}</div>
      <div class="step-math">${s.math}</div>
      <div class="step-note">${s.note}</div>
    </div>
  `).join('');
  const rb=document.getElementById('result');
  if(step>=d.steps.length){rb.textContent='✓ '+d.result;rb.style.display='block';}
  else rb.style.display='none';
  const nb=document.getElementById('nextBtn');
  nb.disabled=step>=d.steps.length;
  nb.style.opacity=step>=d.steps.length?'0.4':'1';
}

function drawGeo(h){
  const cv=document.getElementById('cv');
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const d=derivations[cur];
  const x0=1;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f7f6f2';ctx.fillRect(0,0,W,H);

  const ox=W/2-40,oy=H*0.55,sx=70,sy=55;
  ctx.strokeStyle='#ebe9e4';ctx.lineWidth=1;
  for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(ox+i*sx,20);ctx.lineTo(ox+i*sx,H-20);ctx.stroke();}
  for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(20,oy-i*sy);ctx.lineTo(W-20,oy-i*sy);ctx.stroke();}
  ctx.strokeStyle='#bab9b4';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(20,oy);ctx.lineTo(W-20,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,20);ctx.lineTo(ox,H-20);ctx.stroke();

  ctx.beginPath();
  for(let i=0;i<=400;i++){
    const x=(i/400)*6-3;
    const px=ox+x*sx,py=oy-d.f(x)*sy;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.strokeStyle='#01696f';ctx.lineWidth=2.5;ctx.stroke();

  const Px=ox+x0*sx,Py=oy-d.f(x0)*sy;
  const Qx=ox+(x0+h)*sx,Qy=oy-d.f(x0+h)*sy;
  const secM=h<0.02?d.fd(x0):(d.f(x0+h)-d.f(x0))/h;

  ctx.beginPath();ctx.moveTo(Px-2.5*sx,Py-secM*(-2.5)*sy);ctx.lineTo(Px+2.5*sx,Py-secM*2.5*sy);
  ctx.strokeStyle='#da7101';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);

  const tanM=d.fd(x0);
  ctx.beginPath();ctx.moveTo(Px-2.5*sx,Py-tanM*(-2.5)*sy);ctx.lineTo(Px+2.5*sx,Py-tanM*2.5*sy);
  ctx.strokeStyle='#a12c7b';ctx.lineWidth=2;ctx.stroke();

  ctx.beginPath();ctx.arc(Px,Py,6,0,2*Math.PI);ctx.fillStyle='#a12c7b';ctx.fill();
  if(h>0.05){ctx.beginPath();ctx.arc(Qx,Qy,5,0,2*Math.PI);ctx.fillStyle='#da7101';ctx.fill();}

  ctx.fillStyle='#a12c7b';ctx.font='bold 12px Inter,sans-serif';ctx.fillText('P',Px+8,Py-5);
  if(h>0.05){ctx.fillStyle='#da7101';ctx.fillText('Q (h='+h.toFixed(2)+')',Qx+6,Qy-5);}
}

render();drawGeo(1);
</script>
</body></html>
