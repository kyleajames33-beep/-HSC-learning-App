<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optimisation Solver — L10</title>
<style>
:root{--teal:#01696f;--orange:#da7101;--blue:#006494;--purple:#a12c7b;--green:#437a22;--bg:#f7f6f2;--card:#fff;--border:#dcd9d5;--text:#28251d;--muted:#7a7974;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:20px;}
h1{font-size:1.2rem;font-weight:700;color:var(--purple);margin-bottom:4px;}
.subtitle{font-size:.85rem;color:var(--muted);margin-bottom:18px;}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:980px;margin:0 auto;}
@media(max-width:660px){.layout{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;}
.card h2{font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;}
canvas{display:block;width:100%;border-radius:8px;}
select{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--border);font-size:.9rem;background:var(--bg);color:var(--text);margin-bottom:10px;}
.step-list{list-style:none;}
.step-list li{display:flex;gap:10px;align-items:flex-start;margin:8px 0;opacity:.35;transition:opacity .3s;}
.step-list li.active{opacity:1;}
.sn{background:var(--purple);color:#fff;font-size:.75rem;font-weight:700;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.st{font-size:.88rem;line-height:1.5;}
.st .math{font-weight:700;font-family:monospace;color:var(--blue);display:block;margin-top:2px;}
.btn-row{display:flex;gap:8px;margin-top:12px;}
.btn{padding:8px 18px;border-radius:20px;border:none;font-size:.83rem;font-weight:700;cursor:pointer;}
.btn-primary{background:var(--purple);color:#fff;}
.btn-secondary{background:var(--bg);border:1.5px solid var(--border);color:var(--muted);}
.result-box{background:#e8f5e9;border-radius:8px;padding:12px;margin-top:12px;font-size:1rem;font-weight:700;color:var(--green);display:none;border-left:3px solid var(--green);}
.slider-wrap{margin:10px 0;}
.slider-wrap label{display:flex;justify-content:space-between;font-size:.83rem;font-weight:600;margin-bottom:4px;}
input[type=range]{width:100%;accent-color:var(--purple);}
</style>
</head>
<body>
<div style="max-width:980px;margin:0 auto">
<h1>Optimisation Solver</h1>
<p class="subtitle">L10 — Step through optimisation problems with live graph</p>
<div class="layout">
  <div class="card">
    <h2>Visual</h2>
    <canvas id="cv" width="460" height="340"></canvas>
    <div class="slider-wrap" style="margin-top:10px">
      <label>x value <span id="xLbl" style="color:var(--purple)">1.0</span></label>
      <input type="range" id="xSlider" min="0.1" max="4.9" step="0.05" value="1">
    </div>
  </div>
  <div class="card">
    <h2>Problem</h2>
    <select id="probSel">
      <option value="box">Open box from 10×10 sheet (cut corners x)</option>
      <option value="fence">Fence 3-sided enclosure, 100m total, max area</option>
      <option value="rect">Rectangle inscribed under y = 12 − x², max area</option>
    </select>
    <ul class="step-list" id="stepList"></ul>
    <div class="btn-row">
      <button class="btn btn-primary" id="nextBtn">Next Step</button>
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
    </div>
    <div class="result-box" id="result"></div>
  </div>
</div>
</div>
<script>
const problems={
  box:{
    label:'Box from 10×10 sheet',
    domain:[0.1,4.9],
    objective: x=>x*(10-2*x)*(10-2*x),
    objLabel:'V(x) = x(10−2x)²',
    optX:5/3,optLabel:'x = 5/3 ≈ 1.667',optVal:'V ≈ 74.07 cm³',
    steps:[
      {text:'Draw diagram',math:'Cut corners of size x from 10×10 sheet'},
      {text:'Write objective',math:'V = x(10−2x)²'},
      {text:'Domain',math:'0 < x < 5'},
      {text:'Differentiate',math:"V' = (10−2x)² + x·2(10−2x)(−2)"},
      {text:'Simplify V\'',math:"V' = (10−2x)(10−2x−4x) = (10−2x)(10−6x)"},
      {text:"Solve V' = 0",math:'x = 5 (rejected) or x = 5/3'},
      {text:'Find max value',math:'V(5/3) ≈ 74.07 cm³'}
    ]
  },
  fence:{
    label:'3-sided fence',
    domain:[1,49],
    objective: x=>x*(100-2*x),
    objLabel:'A(x) = x(100−2x)',
    optX:25,optLabel:'x = 25 m',optVal:'A = 1250 m²',
    steps:[
      {text:'Draw diagram',math:'Width=x, length=100−2x (wall on one side)'},
      {text:'Constraint',math:'2x + L = 100, so L = 100−2x'},
      {text:'Objective',math:'A = x(100−2x) = 100x − 2x²'},
      {text:'Differentiate',math:"A' = 100 − 4x"},
      {text:"Solve A' = 0",math:'x = 25'},
      {text:'Verify max',math:"A'' = −4 < 0 (concave down)"},
      {text:'Max area',math:'A(25) = 25×50 = 1250 m²'}
    ]
  },
  rect:{
    label:'Rectangle under parabola',
    domain:[0.1,3.4],
    objective: x=>2*x*(12-x*x),
    objLabel:'A(x) = 2x(12−x²)',
    optX:2,optLabel:'x = 2',optVal:'A = 32 sq units',
    steps:[
      {text:'Setup',math:'Rectangle with base 2x, height = 12−x²'},
      {text:'Objective',math:'A = 2x(12−x²) = 24x−2x³'},
      {text:'Domain',math:'0 < x < −12 ≈ 3.46'},
      {text:'Differentiate',math:"A' = 24 − 6x²"},
      {text:"Solve A' = 0",math:'x² = 4, x = 2'},
      {text:'Verify max',math:"A'' = −12x = −24 < 0"},
      {text:'Max area',math:'A(2) = 2×2×(12−4) = 32'}
    ]
  }
};

let cur='box',step=0,xVal=1;
document.getElementById('probSel').addEventListener('change',e=>{cur=e.target.value;step=0;xVal=problems[cur].domain[0];document.getElementById('xSlider').min=problems[cur].domain[0];document.getElementById('xSlider').max=problems[cur].domain[1];document.getElementById('xSlider').value=xVal;renderSteps();draw();});
document.getElementById('nextBtn').addEventListener('click',()=>{const p=problems[cur];if(step<p.steps.length){step++;renderSteps();if(step>=p.steps.length){document.getElementById('result').style.display='block';document.getElementById('result').textContent='✓ Optimal: '+p.optLabel+' — '+p.optVal;}}});
document.getElementById('resetBtn').addEventListener('click',()=>{step=0;document.getElementById('result').style.display='none';renderSteps();});
document.getElementById('xSlider').addEventListener('input',e=>{xVal=+e.target.value;document.getElementById('xLbl').textContent=xVal.toFixed(2);draw();});

function renderSteps(){
  const p=problems[cur];
  document.getElementById('stepList').innerHTML=p.steps.map((s,i)=>`
    <li class="${i<step?'active':''}">
      <div class="sn">${i+1}</div>
      <div class="st">${s.text}<span class="math">${s.math}</span></div>
    </li>
  `).join('');
  const nb=document.getElementById('nextBtn');
  nb.disabled=step>=p.steps.length;
  nb.style.opacity=step>=p.steps.length?'0.4':'1';
}

function draw(){
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const p=problems[cur];
  const [dmin,dmax]=p.domain;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#f7f6f2';ctx.fillRect(0,0,W,H);
  // Find max of objective
  let maxV=0;
  for(let i=0;i<=500;i++){const x=dmin+i*(dmax-dmin)/500;maxV=Math.max(maxV,p.objective(x));}
  const pad=40;
  function tx(x){return pad+(x-dmin)/(dmax-dmin)*(W-2*pad);}
  function ty(y){return H-pad-(y/maxV)*(H-2*pad);}
  // Axes
  ctx.strokeStyle='#bab9b4';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(pad,H-pad);ctx.lineTo(W-pad,H-pad);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,H-pad);ctx.stroke();
  // Objective curve
  ctx.beginPath();let s=false;
  for(let i=0;i<=500;i++){
    const x=dmin+i*(dmax-dmin)/500,y=p.objective(x);
    if(y<0){s=false;continue;}
    const px=tx(x),py=ty(y);
    s?ctx.lineTo(px,py):(ctx.moveTo(px,py),s=true);
  }
  ctx.strokeStyle='#01696f';ctx.lineWidth=2.5;ctx.stroke();
  // Current x line
  const curY=p.objective(xVal);
  ctx.beginPath();ctx.moveTo(tx(xVal),H-pad);ctx.lineTo(tx(xVal),ty(curY));
  ctx.strokeStyle='#a12c7b';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(tx(xVal),ty(curY),7,0,2*Math.PI);ctx.fillStyle='#a12c7b';ctx.fill();
  // Opt x marker
  const optY=p.objective(p.optX);
  ctx.beginPath();ctx.arc(tx(p.optX),ty(optY),8,0,2*Math.PI);
  ctx.strokeStyle='#da7101';ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='#f7f6f2';ctx.fill();
  ctx.strokeStyle='#da7101';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(tx(p.optX),ty(optY),8,0,2*Math.PI);ctx.stroke();
  // Labels
  ctx.fillStyle='#7a7974';ctx.font='10px Inter,sans-serif';
  ctx.fillText('x',W-pad+4,H-pad+4);
  ctx.fillText(p.objLabel,pad+6,pad+14);
  ctx.fillStyle='#da7101';ctx.font='bold 10px Inter,sans-serif';
  ctx.fillText('optimal x='+p.optX,tx(p.optX)+10,ty(optY)-6);
  ctx.fillStyle='#a12c7b';
  ctx.fillText('x='+xVal.toFixed(2)+', val='+curY.toFixed(1),tx(xVal)+6,ty(curY)-8);
}
renderSteps();draw();
</script>
</body></html>
