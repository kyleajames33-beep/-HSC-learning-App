<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tangent &amp; Normal Explorer — L06</title>
<style>
:root{--teal:#01696f;--orange:#da7101;--blue:#006494;--purple:#a12c7b;--green:#437a22;--bg:#f7f6f2;--card:#fff;--border:#dcd9d5;--text:#28251d;--muted:#7a7974;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:20px;}
h1{font-size:1.2rem;font-weight:700;color:var(--purple);margin-bottom:4px;}
.subtitle{font-size:.85rem;color:var(--muted);margin-bottom:18px;}
.layout{display:grid;grid-template-columns:1fr 270px;gap:16px;max-width:920px;margin:0 auto;}
@media(max-width:640px){.layout{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;}
.card h2{font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;}
canvas{display:block;width:100%;border-radius:8px;cursor:crosshair;}
select{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--border);font-size:.9rem;background:var(--bg);color:var(--text);margin-bottom:12px;}
.slider-wrap{margin:10px 0;}
.slider-wrap label{display:flex;justify-content:space-between;font-size:.83rem;font-weight:600;margin-bottom:4px;}
.slider-wrap label span{color:var(--purple);font-weight:700;}
input[type=range]{width:100%;accent-color:var(--purple);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.info-box{background:var(--bg);border-radius:8px;padding:9px 11px;}
.info-box .lbl{font-size:.72rem;color:var(--muted);margin-bottom:2px;}
.info-box .val{font-size:.92rem;font-weight:700;word-break:break-all;}
.eqn-box{background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;font-size:.85rem;}
.eqn-box .lbl{font-size:.72rem;color:var(--muted);margin-bottom:3px;}
.eqn-box .eq{font-weight:700;font-family:monospace;}
.rule-box{background:#f9e8f4;border-radius:8px;padding:11px;margin-top:10px;font-size:.82rem;line-height:1.7;color:#6b1040;border-left:3px solid var(--purple);}
</style>
</head>
<body>
<div style="max-width:920px;margin:0 auto">
<h1>Tangent &amp; Normal Explorer</h1>
<p class="subtitle">L06 — Drag the point to see tangent and normal equations update live</p>
<div class="layout">
  <div class="card">
    <h2>Graph</h2>
    <canvas id="cv" width="580" height="400"></canvas>
  </div>
  <div class="card">
    <h2>Controls</h2>
    <select id="fnSel">
      <option value="x2">f(x) = x²</option>
      <option value="x3mx">f(x) = x³ − x</option>
      <option value="sinx">f(x) = sin(x)</option>
      <option value="x2p2x">f(x) = x² + 2x − 3</option>
    </select>
    <div class="slider-wrap">
      <label>x₀ (point) <span id="x0Val">1.0</span></label>
      <input type="range" id="x0" min="-3" max="3" step="0.05" value="1">
    </div>
    <div class="info-grid">
      <div class="info-box"><div class="lbl">Point (x₀, y₀)</div><div class="val" id="ptVal" style="color:var(--purple)">--</div></div>
      <div class="info-box"><div class="lbl">f′(x₀) = mₜ</div><div class="val" id="mtVal" style="color:var(--orange)">--</div></div>
      <div class="info-box"><div class="lbl">mₙ = −1/mₜ</div><div class="val" id="mnVal" style="color:var(--blue)">--</div></div>
      <div class="info-box"><div class="lbl">mₜ × mₙ</div><div class="val" id="prodVal" style="color:var(--green)">--</div></div>
    </div>
    <div class="eqn-box">
      <div class="lbl">Tangent equation</div>
      <div class="eq" id="tanEq" style="color:var(--orange)">--</div>
    </div>
    <div class="eqn-box">
      <div class="lbl">Normal equation</div>
      <div class="eq" id="normEq" style="color:var(--blue)">--</div>
    </div>
    <div class="rule-box">
      Tangent: y−y₀ = f′(x₀)(x−x₀)<br>
      Normal: y−y₀ = −1/f′(x₀) · (x−x₀)<br>
      mₜ × mₙ = −1 always
    </div>
  </div>
</div>
</div>
<script>
const fns={
  x2:{f:x=>x*x,fd:x=>2*x,label:'x²'},
  x3mx:{f:x=>x*x*x-x,fd:x=>3*x*x-1,label:'x³−x'},
  sinx:{f:x=>Math.sin(x),fd:x=>Math.cos(x),label:'sin x'},
  x2p2x:{f:x=>x*x+2*x-3,fd:x=>2*x+2,label:'x²+2x−3'}
};
let cur='x2',x0=1;

document.getElementById('fnSel').addEventListener('change',e=>{cur=e.target.value;draw();});
document.getElementById('x0').addEventListener('input',e=>{x0=+e.target.value;document.getElementById('x0Val').textContent=x0.toFixed(2);draw();});

function fmt(n){return n.toFixed(3);}
function lineEq(m,x0,y0){
  const b=y0-m*x0;
  const bStr=b>=0?'+ '+b.toFixed(3):'− '+Math.abs(b).toFixed(3);
  return `y = ${m.toFixed(3)}x ${bStr}`;
}

function draw(){
  const cv=document.getElementById('cv');
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const{f,fd}=fns[cur];
  const ox=W/2,oy=H/2,sx=70,sy=70;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f7f6f2';ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='#ebe9e4';ctx.lineWidth=1;
  for(let i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(ox+i*sx,10);ctx.lineTo(ox+i*sx,H-10);ctx.stroke();}
  for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(10,oy-i*sy);ctx.lineTo(W-10,oy-i*sy);ctx.stroke();}

  // Axes
  ctx.strokeStyle='#bab9b4';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(10,oy);ctx.lineTo(W-10,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,10);ctx.lineTo(ox,H-10);ctx.stroke();
  ctx.fillStyle='#7a7974';ctx.font='10px Inter,sans-serif';
  for(let i=-4;i<=4;i++){if(i)ctx.fillText(i,ox+i*sx-4,oy+13);}

  // Curve
  ctx.beginPath();
  for(let i=0;i<=500;i++){const x=(i/500)*10-5;const px=ox+x*sx,py=oy-f(x)*sy;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
  ctx.strokeStyle='#01696f';ctx.lineWidth=2.5;ctx.stroke();

  // Tangent
  const y0=f(x0),m=fd(x0);
  const ext=4;
  ctx.beginPath();ctx.moveTo(ox+(x0-ext)*sx,oy-(y0+m*(-ext))*sy);ctx.lineTo(ox+(x0+ext)*sx,oy-(y0+m*ext)*sy);
  ctx.strokeStyle='#da7101';ctx.lineWidth=2.5;ctx.stroke();

  // Normal
  const mn=m===0?1e9:-1/m;
  ctx.beginPath();ctx.moveTo(ox+(x0-ext)*sx,oy-(y0+mn*(-ext))*sy);ctx.lineTo(ox+(x0+ext)*sx,oy-(y0+mn*ext)*sy);
  ctx.strokeStyle='#006494';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);

  // Point
  const Px=ox+x0*sx,Py=oy-y0*sy;
  ctx.beginPath();ctx.arc(Px,Py,7,0,2*Math.PI);ctx.fillStyle='#a12c7b';ctx.fill();

  // Right angle marker
  const angle=Math.atan2(-m,1);
  const sz=14;
  ctx.save();ctx.translate(Px,Py);ctx.rotate(angle);
  ctx.strokeStyle='#7a7974';ctx.lineWidth=1.2;ctx.strokeRect(0,0,sz,-sz);
  ctx.restore();

  // Legend
  ctx.font='11px Inter,sans-serif';
  ctx.strokeStyle='#da7101';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,18);ctx.lineTo(40,18);ctx.stroke();
  ctx.fillStyle='#da7101';ctx.fillText('tangent',44,22);
  ctx.strokeStyle='#006494';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(112,18);ctx.lineTo(138,18);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#006494';ctx.fillText('normal',142,22);

  // Update panel
  document.getElementById('ptVal').textContent=`(${x0.toFixed(2)}, ${y0.toFixed(3)})`;
  document.getElementById('mtVal').textContent=fmt(m);
  document.getElementById('mnVal').textContent=m===0?'undef':fmt(mn);
  document.getElementById('prodVal').textContent=m===0?'undef':(m*mn).toFixed(3);
  document.getElementById('tanEq').textContent=lineEq(m,x0,y0);
  document.getElementById('normEq').textContent=m===0?'x = '+x0.toFixed(2):lineEq(mn,x0,y0);
}
draw();
</script>
</body></html>
