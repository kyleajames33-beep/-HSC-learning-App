<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="340" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">AVERAGE vs INSTANTANEOUS RATE — L01</text>
  <!-- Axes -->
  <line x1="50" y1="270" x2="480" y2="270" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="70" y1="30" x2="70" y2="285" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="482" y="274" font-size="11" fill="#7a7974" font-style="italic">x</text>
  <text x="74" y="28" font-size="11" fill="#7a7974" font-style="italic">y</text>
  <!-- Curve -->
  <path d="M 80,250 C 150,200 220,130 290,90 C 360,50 420,60 460,100" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Average rate: interval [a,b] with shaded region -->
  <line x1="140" y1="216" x2="140" y2="270" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="52" x2="360" y2="270" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Secant -->
  <line x1="100" y1="236" x2="420" y2="36" stroke="#da7101" stroke-width="2" stroke-linecap="round"/>
  <!-- Bracket for interval -->
  <line x1="140" y1="278" x2="360" y2="278" stroke="#da7101" stroke-width="1.5"/>
  <line x1="140" y1="274" x2="140" y2="282" stroke="#da7101" stroke-width="1.5"/>
  <line x1="360" y1="274" x2="360" y2="282" stroke="#da7101" stroke-width="1.5"/>
  <text x="250" y="294" font-size="11" fill="#da7101" text-anchor="middle" font-weight="600">interval [a, b]</text>
  <!-- Average rate box -->
  <rect x="70" y="38" width="180" height="46" rx="8" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <text x="160" y="57" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">Average Rate</text>
  <text x="160" y="75" font-size="12" fill="#28251d" text-anchor="middle">Δy/Δx = (f(b)−f(a))/(b−a)</text>
  <!-- Points on curve -->
  <circle cx="140" cy="216" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="360" cy="52" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <text x="130" y="210" font-size="11" fill="#da7101" font-weight="700">a</text>
  <text x="365" y="46" font-size="11" fill="#da7101" font-weight="700">b</text>
  <!-- Tangent at point c -->
  <circle cx="250" cy="108" r="6" fill="#006494" stroke="#f7f6f2" stroke-width="2"/>
  <line x1="180" y1="152" x2="330" y2="68" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Instantaneous box -->
  <rect x="290" y="220" width="190" height="46" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="385" y="239" font-size="12" fill="#006494" font-weight="700" text-anchor="middle">Instantaneous Rate</text>
  <text x="385" y="257" font-size="12" fill="#28251d" text-anchor="middle">f’(c) = slope of tangent at c</text>
  <!-- Arrow from box to point -->
  <line x1="310" y1="220" x2="258" y2="115" stroke="#006494" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#006494"/></marker></defs>
  <text x="258" y="100" font-size="11" fill="#006494" font-weight="700">c</text>
</svg>