<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">AVERAGE vs INSTANTANEOUS RATE — L01</text>
  <!-- Axes -->
  <line x1="50" y1="250" x2="490" y2="250" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="70" y1="30" x2="70" y2="260" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="254" font-size="11" fill="#7a7974" font-style="italic">x</text>
  <text x="74" y="28" font-size="11" fill="#7a7974" font-style="italic">y</text>
  <!-- Curve -->
  <path d="M 80,240 C 140,200 200,130 270,90 C 330,58 400,50 470,70" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Average rate: interval [x1,x2] -->
  <!-- x1=130 y~200, x2=380 y~58 -->
  <line x1="130" y1="200" x2="380" y2="60" stroke="#da7101" stroke-width="2" stroke-dasharray="none"/>
  <!-- Delta y and delta x brackets -->
  <line x1="380" y1="60" x2="380" y2="200" stroke="#da7101" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="130" y1="200" x2="380" y2="200" stroke="#da7101" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="388" y="135" font-size="13" fill="#da7101" font-weight="700">Δy</text>
  <text x="245" y="218" font-size="13" fill="#da7101" font-weight="700">Δx</text>
  <!-- Points -->
  <circle cx="130" cy="200" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="380" cy="60" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <text x="112" y="198" font-size="11" fill="#da7101" font-weight="700">x₁</text>
  <text x="382" y="56" font-size="11" fill="#da7101" font-weight="700">x₂</text>
  <!-- Tangent at point ~x=270 -->
  <line x1="180" y1="118" x2="370" y2="62" stroke="#a12c7b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="270" cy="90" r="6" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="276" y="86" font-size="11" fill="#a12c7b" font-weight="700">x₀</text>
  <!-- Labels -->
  <rect x="30" y="268" width="210" height="38" rx="7" fill="#fff0dc" stroke="#da7101" stroke-width="1"/>
  <text x="135" y="284" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">Average rate</text>
  <text x="135" y="299" font-size="11" fill="#da7101" text-anchor="middle">Δy/Δx = (f(x₂)−f(x₁))/(x₂−x₁)</text>
  <rect x="280" y="268" width="220" height="38" rx="7" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1"/>
  <text x="390" y="284" font-size="12" fill="#a12c7b" font-weight="700" text-anchor="middle">Instantaneous rate</text>
  <text x="390" y="299" font-size="11" fill="#a12c7b" text-anchor="middle">f′(x₀) = gradient of tangent</text>
</svg>