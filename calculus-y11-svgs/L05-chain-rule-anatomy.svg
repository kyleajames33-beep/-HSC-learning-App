<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">CHAIN RULE ANATOMY — L05</text>
  <!-- Rule box -->
  <rect x="40" y="38" width="440" height="48" rx="10" fill="#a12c7b"/>
  <text x="260" y="58" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Chain Rule: d/dx[f(g(x))] = f’(g(x)) · g’(x)</text>
  <text x="260" y="76" font-size="12" fill="#f9e8f4" text-anchor="middle">= (derivative of outer) × (derivative of inner)</text>
  <!-- Example -->
  <text x="260" y="110" font-size="14" fill="#28251d" text-anchor="middle" font-weight="600">Example: y = (3x² + 1)⁵</text>
  <!-- Outer label -->
  <rect x="100" y="124" width="140" height="40" rx="8" fill="#f9e8f4" stroke="#a12c7b" stroke-width="2"/>
  <text x="170" y="140" font-size="11" fill="#a12c7b" font-weight="700" text-anchor="middle">Outer function f</text>
  <text x="170" y="156" font-size="12" fill="#28251d" text-anchor="middle">f(u) = u⁵</text>
  <!-- Inner label -->
  <rect x="280" y="124" width="140" height="40" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="2"/>
  <text x="350" y="140" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">Inner function g</text>
  <text x="350" y="156" font-size="12" fill="#28251d" text-anchor="middle">g(x) = 3x² + 1</text>
  <!-- Arrows down to derivatives -->
  <defs><marker id="da" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#7a7974"/></marker></defs>
  <line x1="170" y1="164" x2="170" y2="186" stroke="#7a7974" stroke-width="1.5" marker-end="url(#da)"/>
  <line x1="350" y1="164" x2="350" y2="186" stroke="#7a7974" stroke-width="1.5" marker-end="url(#da)"/>
  <!-- Derivatives -->
  <rect x="100" y="186" width="140" height="40" rx="8" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1.5"/>
  <text x="170" y="202" font-size="11" fill="#a12c7b" font-weight="700" text-anchor="middle">f’(u) = 5u⁴</text>
  <text x="170" y="218" font-size="11" fill="#7a7974" text-anchor="middle">= 5(3x²+1)⁴</text>
  <rect x="280" y="186" width="140" height="40" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="350" y="202" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">g’(x) = 6x</text>
  <text x="350" y="218" font-size="11" fill="#7a7974" text-anchor="middle"> </text>
  <!-- Times symbol -->
  <text x="260" y="212" font-size="22" fill="#28251d" text-anchor="middle" font-weight="700">×</text>
  <!-- Result -->
  <rect x="80" y="244" width="360" height="48" rx="10" fill="#28251d"/>
  <text x="260" y="264" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">dy/dx = 5(3x²+1)⁴ × 6x</text>
  <text x="260" y="282" font-size="13" fill="#a12c7b" text-anchor="middle" font-weight="700">= 30x(3x²+1)⁴</text>
</svg>