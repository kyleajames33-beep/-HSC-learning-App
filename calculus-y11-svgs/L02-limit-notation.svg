<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">LIMIT NOTATION EXPLAINED — L02</text>
  <!-- Main formula box -->
  <rect x="60" y="44" width="400" height="70" rx="12" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="90" font-size="28" font-weight="700" fill="#28251d" text-anchor="middle">lim f(x) = L</text>
  <text x="196" y="104" font-size="11" fill="#7a7974" text-anchor="middle">x → a</text>
  <!-- Annotation arrows -->
  <!-- "lim" -->
  <line x1="148" y1="114" x2="148" y2="144" stroke="#da7101" stroke-width="1.5" marker-end="url(#ca)"/>
  <defs><marker id="ca" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#da7101"/></marker></defs>
  <rect x="80" y="144" width="136" height="34" rx="7" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <text x="148" y="165" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">“limit of”</text>
  <!-- f(x) -->
  <line x1="240" y1="114" x2="240" y2="144" stroke="#01696f" stroke-width="1.5" marker-end="url(#cb)"/>
  <defs><marker id="cb" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#01696f"/></marker></defs>
  <rect x="170" y="144" width="140" height="34" rx="7" fill="#e8f5ef" stroke="#01696f" stroke-width="1.5"/>
  <text x="240" y="165" font-size="12" fill="#01696f" font-weight="700" text-anchor="middle">the function</text>
  <!-- x->a -->
  <line x1="195" y1="118" x2="170" y2="194" stroke="#006494" stroke-width="1.5" marker-end="url(#cc)"/>
  <defs><marker id="cc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#006494"/></marker></defs>
  <rect x="80" y="194" width="180" height="34" rx="7" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="170" y="215" font-size="12" fill="#006494" font-weight="700" text-anchor="middle">as x approaches a</text>
  <!-- L -->
  <line x1="370" y1="114" x2="380" y2="144" stroke="#a12c7b" stroke-width="1.5" marker-end="url(#cd)"/>
  <defs><marker id="cd" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#a12c7b"/></marker></defs>
  <rect x="308" y="144" width="164" height="34" rx="7" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1.5"/>
  <text x="390" y="165" font-size="12" fill="#a12c7b" font-weight="700" text-anchor="middle">the value approached</text>
  <!-- Key note -->
  <rect x="60" y="248" width="400" height="34" rx="8" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="260" y="269" font-size="12" fill="#0c4e54" text-anchor="middle" font-weight="500">x never equals a — we only care what f(x) approaches</text>
</svg>