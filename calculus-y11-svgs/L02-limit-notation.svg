<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="28" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">LIMIT NOTATION — L02</text>
  <!-- Main formula -->
  <rect x="60" y="44" width="400" height="64" rx="10" fill="#fff" stroke="#006494" stroke-width="2"/>
  <text x="260" y="86" font-size="28" font-weight="700" fill="#006494" text-anchor="middle">lim f(x) = L</text>
  <text x="228" y="100" font-size="12" fill="#7a7974" text-anchor="middle">x→a</text>
  <!-- Annotation arrows and labels -->
  <!-- lim -->
  <line x1="118" y1="108" x2="118" y2="140" stroke="#01696f" stroke-width="1.5" marker-end="url(#ca)"/>
  <defs><marker id="ca" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#01696f"/></marker></defs>
  <rect x="44" y="140" width="148" height="34" rx="7" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="118" y="161" font-size="12" fill="#0c4e54" font-weight="600" text-anchor="middle">“limit of” operator</text>
  <!-- x→a -->
  <line x1="200" y1="108" x2="185" y2="140" stroke="#da7101" stroke-width="1.5" marker-end="url(#cb)"/>
  <defs><marker id="cb" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#da7101"/></marker></defs>
  <rect x="100" y="188" width="176" height="34" rx="7" fill="#fff0dc" stroke="#da7101" stroke-width="1"/>
  <text x="188" y="209" font-size="12" fill="#7a4400" font-weight="600" text-anchor="middle">as x approaches a</text>
  <!-- f(x) -->
  <line x1="285" y1="108" x2="285" y2="140" stroke="#a12c7b" stroke-width="1.5" marker-end="url(#cc)"/>
  <defs><marker id="cc" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#a12c7b"/></marker></defs>
  <rect x="214" y="140" width="142" height="34" rx="7" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1"/>
  <text x="285" y="161" font-size="12" fill="#6b1040" font-weight="600" text-anchor="middle">the function</text>
  <!-- L -->
  <line x1="400" y1="108" x2="400" y2="140" stroke="#006494" stroke-width="1.5" marker-end="url(#cd)"/>
  <defs><marker id="cd" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#006494"/></marker></defs>
  <rect x="326" y="140" width="148" height="34" rx="7" fill="#dcedf7" stroke="#006494" stroke-width="1"/>
  <text x="400" y="161" font-size="12" fill="#003d5c" font-weight="600" text-anchor="middle">the limit value L</text>
  <!-- Key note -->
  <rect x="40" y="238" width="440" height="44" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="256" font-size="12" fill="#28251d" font-weight="600" text-anchor="middle">f(x) does NOT need to equal L at x = a</text>
  <text x="260" y="273" font-size="11" fill="#7a7974" text-anchor="middle">The limit describes behaviour as x gets close to a, not at a</text>
</svg>