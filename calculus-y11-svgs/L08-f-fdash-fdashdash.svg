<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="380" fill="#f7f6f2" rx="12"/>
  <text x="260" y="24" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">f, f’ AND f″ STACKED — L08</text>
  <!-- f(x) panel -->
  <rect x="16" y="32" width="488" height="96" rx="8" fill="#fff" stroke="#01696f" stroke-width="2"/>
  <text x="28" y="50" font-size="11" font-weight="700" fill="#01696f">f(x)</text>
  <line x1="60" y1="80" x2="500" y2="80" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="80" y1="36" x2="80" y2="120" stroke="#dcd9d5" stroke-width="1"/>
  <!-- cubic f(x) = x^3 - 3x, scaled: max at x=-1 (y=2), min at x=1 (y=-2), inflection at x=0 -->
  <!-- map x: -3 to 3 -> 80 to 500 (scale=70px/unit), y: -3 to 3 -> 120 to 36 (scale=14px/unit) -->
  <path d="M 80,115 C 115,105 140,64 150,80 C 167,106 193,120 220,80 C 247,40 260,80 290,80 C 320,80 353,114 370,82 C 387,50 420,44 500,44" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Inflection point -->
  <circle cx="290" cy="80" r="4" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="294" y="76" font-size="10" fill="#a12c7b">infl</text>
  <!-- Max/min -->
  <circle cx="185" cy="54" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="395" cy="107" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="185" y="48" font-size="9" fill="#da7101" text-anchor="middle">max</text>
  <text x="395" y="118" font-size="9" fill="#da7101" text-anchor="middle">min</text>
  <!-- Vertical guide lines -->
  <line x1="185" y1="32" x2="185" y2="380" stroke="#da7101" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="290" y1="32" x2="290" y2="380" stroke="#a12c7b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="395" y1="32" x2="395" y2="380" stroke="#da7101" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <!-- f'(x) panel -->
  <rect x="16" y="140" width="488" height="96" rx="8" fill="#fff" stroke="#006494" stroke-width="2"/>
  <text x="28" y="158" font-size="11" font-weight="700" fill="#006494">f’(x)</text>
  <line x1="60" y1="188" x2="500" y2="188" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="80" y1="144" x2="80" y2="228" stroke="#dcd9d5" stroke-width="1"/>
  <!-- f'(x) = 3x^2 - 3, parabola, zeros at x=±1 -> at px 185 and 395, min at x=0 -> px 290 -->
  <path d="M 80,148 C 120,148 160,195 185,188 C 210,181 260,230 290,228 C 320,226 370,181 395,188 C 420,195 460,148 500,148" fill="none" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Zeros of f' at x=±1 -->
  <circle cx="185" cy="188" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="395" cy="188" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="185" y="202" font-size="9" fill="#da7101" text-anchor="middle">f’=0</text>
  <text x="395" y="202" font-size="9" fill="#da7101" text-anchor="middle">f’=0</text>
  <!-- Zero of f' at inflection -->
  <circle cx="290" cy="228" r="4" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="290" y="242" font-size="9" fill="#a12c7b" text-anchor="middle">min of f’</text>
  <!-- f''(x) panel -->
  <rect x="16" y="248" width="488" height="96" rx="8" fill="#fff" stroke="#a12c7b" stroke-width="2"/>
  <text x="28" y="266" font-size="11" font-weight="700" fill="#a12c7b">f″(x)</text>
  <line x1="60" y1="296" x2="500" y2="296" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="80" y1="252" x2="80" y2="336" stroke="#dcd9d5" stroke-width="1"/>
  <!-- f''(x) = 6x, straight line through zero at x=0 -> px 290 -->
  <line x1="80" y1="340" x2="500" y2="252" stroke="#a12c7b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Zero of f'' at inflection -->
  <circle cx="290" cy="296" r="4" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="290" y="312" font-size="9" fill="#a12c7b" text-anchor="middle">f″=0 (inflection)</text>
  <!-- Labels on shading -->
  <text x="170" y="320" font-size="9" fill="#c0392b">f″&lt;0 (concave ↓)</text>
  <text x="360" y="272" font-size="9" fill="#437a22">f″&gt;0 (concave ↑)</text>
  <!-- x-labels -->
  <text x="185" y="374" font-size="10" fill="#da7101" text-anchor="middle">x=−1</text>
  <text x="290" y="374" font-size="10" fill="#a12c7b" text-anchor="middle">x=0</text>
  <text x="395" y="374" font-size="10" fill="#da7101" text-anchor="middle">x=1</text>
</svg>