<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="380" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">f, f′ AND f″ ALIGNED — L08</text>
  <!-- Panel 1: f(x) cubic -->
  <rect x="20" y="30" width="480" height="96" rx="8" fill="#fff" stroke="#01696f" stroke-width="1.5"/>
  <text x="36" y="48" font-size="11" font-weight="700" fill="#01696f">f(x)</text>
  <line x1="60" y1="80" x2="490" y2="80" stroke="#ebe9e4" stroke-width="1"/>
  <line x1="60" y1="38" x2="60" y2="118" stroke="#ebe9e4" stroke-width="1"/>
  <!-- cubic: rises, local max ~x=150, falls, local min ~x=350, rises -->
  <path d="M 65,105 C 100,95 130,46 155,44 C 180,42 205,70 260,80 C 315,90 340,108 365,106 C 390,104 430,72 490,45" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="155" cy="44" r="4" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="365" cy="106" r="4" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="155" y="38" font-size="9" fill="#a12c7b" text-anchor="middle">local max</text>
  <text x="365" y="116" font-size="9" fill="#a12c7b" text-anchor="middle">local min</text>
  <!-- inflection ~x=260 -->
  <circle cx="260" cy="80" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="260" y="73" font-size="9" fill="#da7101" text-anchor="middle">inflection</text>
  <!-- Panel 2: f'(x) -->
  <rect x="20" y="138" width="480" height="96" rx="8" fill="#fff" stroke="#006494" stroke-width="1.5"/>
  <text x="36" y="156" font-size="11" font-weight="700" fill="#006494">f′(x)</text>
  <line x1="60" y1="188" x2="490" y2="188" stroke="#ebe9e4" stroke-width="1"/>
  <line x1="60" y1="146" x2="60" y2="226" stroke="#ebe9e4" stroke-width="1"/>
  <!-- f' is a parabola: zero at x=155, negative in middle, zero at x=365 -->
  <path d="M 65,170 C 100,162 130,148 155,188 C 180,226 230,230 260,222 C 290,215 330,188 365,188 C 390,188 430,168 490,148" fill="none" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <!-- zeros of f' at x=155, x=365 -->
  <circle cx="155" cy="188" r="4" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="365" cy="188" r="4" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="155" y="200" font-size="9" fill="#a12c7b" text-anchor="middle">f′=0</text>
  <text x="365" y="200" font-size="9" fill="#a12c7b" text-anchor="middle">f′=0</text>
  <!-- min of f' at x=260 -->
  <circle cx="260" cy="222" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="260" y="232" font-size="9" fill="#da7101" text-anchor="middle">f″=0 here</text>
  <!-- Panel 3: f''(x) -->
  <rect x="20" y="246" width="480" height="96" rx="8" fill="#fff" stroke="#da7101" stroke-width="1.5"/>
  <text x="36" y="264" font-size="11" font-weight="700" fill="#da7101">f″(x)</text>
  <line x1="60" y1="295" x2="490" y2="295" stroke="#ebe9e4" stroke-width="1"/>
  <line x1="60" y1="254" x2="60" y2="334" stroke="#ebe9e4" stroke-width="1"/>
  <!-- f'' is linear (cubic): positive left of 260, zero at 260, negative right -->
  <path d="M 65,258 C 140,262 200,280 260,295 C 320,310 400,318 490,330" fill="none" stroke="#da7101" stroke-width="2.5" stroke-linecap="round"/>
  <!-- zero at x=260 -->
  <circle cx="260" cy="295" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="260" y="308" font-size="9" fill="#da7101" text-anchor="middle">f″=0 (inflection)</text>
  <!-- Region labels f'' -->
  <text x="155" y="275" font-size="9" fill="#437a22" text-anchor="middle">f″&gt;0 concave up</text>
  <text x="390" y="315" font-size="9" fill="#c0392b" text-anchor="middle">f″&lt;0 concave down</text>
  <!-- Vertical alignment dashes -->
  <line x1="155" y1="126" x2="155" y2="138" stroke="#a12c7b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="155" y1="234" x2="155" y2="246" stroke="#a12c7b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="365" y1="126" x2="365" y2="138" stroke="#a12c7b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="365" y1="234" x2="365" y2="246" stroke="#a12c7b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="260" y1="126" x2="260" y2="138" stroke="#da7101" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="260" y1="234" x2="260" y2="246" stroke="#da7101" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- footer -->
  <text x="260" y="358" font-size="10" fill="#7a7974" text-anchor="middle">Vertical alignment shows how each derivative relates to the original</text>
</svg>