<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">INCREASING, DECREASING &amp; STATIONARY — L07</text>
  <!-- Shaded regions -->
  <!-- Increasing region (left) -->
  <rect x="50" y="50" width="140" height="180" rx="0" fill="#e8f5e9" opacity="0.7"/>
  <!-- Decreasing region (middle) -->
  <rect x="190" y="50" width="140" height="180" rx="0" fill="#fde8e8" opacity="0.7"/>
  <!-- Increasing region (right) -->
  <rect x="330" y="50" width="150" height="180" rx="0" fill="#e8f5e9" opacity="0.7"/>
  <!-- Axes -->
  <line x1="40" y1="230" x2="490" y2="230" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="60" y1="40" x2="60" y2="240" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- Cubic curve -->
  <path d="M 55,200 C 90,175 130,80 190,72 C 230,68 250,90 260,120 C 270,150 290,190 330,200 C 370,210 420,160 475,80" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Stationary points -->
  <circle cx="190" cy="72" r="7" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="330" cy="200" r="7" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <!-- Stationary labels -->
  <text x="190" y="62" font-size="11" fill="#a12c7b" font-weight="700" text-anchor="middle">f′=0 (max)</text>
  <text x="330" y="218" font-size="11" fill="#a12c7b" font-weight="700" text-anchor="middle">f′=0 (min)</text>
  <!-- Region labels -->
  <text x="120" y="172" font-size="12" fill="#437a22" font-weight="700" text-anchor="middle">f′(x) &gt; 0</text>
  <text x="120" y="188" font-size="11" fill="#437a22" text-anchor="middle">increasing</text>
  <text x="120" y="202" font-size="18" fill="#437a22" text-anchor="middle">↗</text>
  <text x="260" y="172" font-size="12" fill="#c0392b" font-weight="700" text-anchor="middle">f′(x) &lt; 0</text>
  <text x="260" y="188" font-size="11" fill="#c0392b" text-anchor="middle">decreasing</text>
  <text x="260" y="202" font-size="18" fill="#c0392b" text-anchor="middle">↘</text>
  <text x="405" y="172" font-size="12" fill="#437a22" font-weight="700" text-anchor="middle">f′(x) &gt; 0</text>
  <text x="405" y="188" font-size="11" fill="#437a22" text-anchor="middle">increasing</text>
  <text x="405" y="202" font-size="18" fill="#437a22" text-anchor="middle">↗</text>
  <!-- Dashed verticals at stat pts -->
  <line x1="190" y1="72" x2="190" y2="230" stroke="#a12c7b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="330" y1="200" x2="330" y2="230" stroke="#a12c7b" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Bottom summary -->
  <rect x="40" y="248" width="440" height="36" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="264" font-size="11" fill="#28251d" text-anchor="middle">Find stationary points: set <tspan font-weight="700">f′(x) = 0</tspan> and solve</text>
  <text x="260" y="278" font-size="11" fill="#7a7974" text-anchor="middle">Test sign of f′ either side to confirm increasing / decreasing</text>
</svg>