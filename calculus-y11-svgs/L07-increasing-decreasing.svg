<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">INCREASING, DECREASING &amp; STATIONARY — L07</text>
  <!-- Axes -->
  <line x1="30" y1="220" x2="490" y2="220" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="55" y1="30" x2="55" y2="235" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- Shaded regions -->
  <!-- Increasing region (left) -->
  <rect x="55" y="30" width="140" height="190" fill="#e8f5ef" opacity="0.5" rx="4"/>
  <!-- Decreasing region (middle) -->
  <rect x="195" y="30" width="140" height="190" fill="#fde8e8" opacity="0.5" rx="4"/>
  <!-- Increasing region (right) -->
  <rect x="335" y="30" width="155" height="190" fill="#e8f5ef" opacity="0.5" rx="4"/>
  <!-- Cubic curve with max and min -->
  <!-- max at x~195, min at x~335 -->
  <path d="M 60,210 C 90,160 140,70 195,60 C 240,52 270,100 335,180 C 370,220 420,230 485,200" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Stationary points -->
  <circle cx="195" cy="60" r="6" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="335" cy="180" r="6" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <!-- Labels on x-axis -->
  <line x1="195" y1="216" x2="195" y2="224" stroke="#7a7974" stroke-width="1.5"/>
  <text x="195" y="236" font-size="11" fill="#28251d" text-anchor="middle" font-weight="600">x₁</text>
  <line x1="335" y1="216" x2="335" y2="224" stroke="#7a7974" stroke-width="1.5"/>
  <text x="335" y="236" font-size="11" fill="#28251d" text-anchor="middle" font-weight="600">x₂</text>
  <!-- Region labels -->
  <text x="125" y="250" font-size="11" fill="#437a22" font-weight="700" text-anchor="middle">f’(x) &gt; 0</text>
  <text x="125" y="264" font-size="10" fill="#437a22" text-anchor="middle">increasing ↗</text>
  <text x="265" y="250" font-size="11" fill="#c0392b" font-weight="700" text-anchor="middle">f’(x) &lt; 0</text>
  <text x="265" y="264" font-size="10" fill="#c0392b" text-anchor="middle">decreasing ↘</text>
  <text x="412" y="250" font-size="11" fill="#437a22" font-weight="700" text-anchor="middle">f’(x) &gt; 0</text>
  <text x="412" y="264" font-size="10" fill="#437a22" text-anchor="middle">increasing ↗</text>
  <!-- Stationary labels -->
  <text x="195" y="48" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">local max</text>
  <text x="195" y="38" font-size="10" fill="#da7101" text-anchor="middle">f’(x₁) = 0</text>
  <text x="335" y="170" font-size="11" fill="#da7101" font-weight="700" text-anchor="start"> local min</text>
  <text x="335" y="160" font-size="10" fill="#da7101" text-anchor="start"> f’(x₂) = 0</text>
  <!-- Bottom rule -->
  <rect x="30" y="278" width="460" height="30" rx="7" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="260" y="298" font-size="11" fill="#0c4e54" text-anchor="middle">Stationary point: f’(x) = 0. Classify by sign change of f’ either side.</text>
</svg>