<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">RATES OF CHANGE IN CONTEXT — L10</text>
  <!-- Axes -->
  <line x1="50" y1="220" x2="490" y2="220" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="232" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="224" font-size="11" fill="#7a7974" font-style="italic">t</text>
  <text x="74" y="38" font-size="11" fill="#7a7974" font-style="italic">s</text>
  <text x="46" y="224" font-size="10" fill="#7a7974">0</text>
  <!-- x axis labels -->
  <text x="160" y="233" font-size="10" fill="#7a7974" text-anchor="middle">t₁</text>
  <text x="380" y="233" font-size="10" fill="#7a7974" text-anchor="middle">t₂</text>
  <!-- Curve: s(t) -- distance time -->
  <path d="M 75,210 C 120,195 155,160 195,118 C 235,76 270,62 310,70 C 350,78 390,115 440,170 C 460,192 472,205 485,215" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Average rate: secant t1 to t2 -->
  <!-- t1=160,s~148; t2=380,s~95 -->
  <line x1="160" y1="148" x2="380" y2="96" stroke="#da7101" stroke-width="2"/>
  <circle cx="160" cy="148" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="380" cy="96" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <!-- delta labels -->
  <line x1="380" y1="96" x2="380" y2="148" stroke="#da7101" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="148" x2="380" y2="148" stroke="#da7101" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="388" y="126" font-size="10" fill="#da7101" font-weight="700">Δs</text>
  <text x="268" y="162" font-size="10" fill="#da7101" font-weight="700">Δt</text>
  <text x="200" y="112" font-size="10" fill="#da7101" font-weight="700">avg speed = Δs/Δt</text>
  <!-- Instantaneous: tangent at t=310,s=70 -->
  <line x1="255" y1="108" x2="365" y2="32" stroke="#a12c7b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="310" cy="70" r="6" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="368" y="30" font-size="10" fill="#a12c7b" font-weight="700">tangent</text>
  <text x="368" y="43" font-size="10" fill="#a12c7b">inst. speed</text>
  <text x="368" y="56" font-size="10" fill="#a12c7b">= s′(t)</text>
  <!-- Context boxes -->
  <rect x="30" y="244" width="200" height="40" rx="7" fill="#fff0dc" stroke="#da7101" stroke-width="1"/>
  <text x="130" y="260" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">Average velocity</text>
  <text x="130" y="276" font-size="11" fill="#28251d" text-anchor="middle">[s(t₂)−s(t₁)] / (t₂−t₁)</text>
  <rect x="290" y="244" width="200" height="40" rx="7" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1"/>
  <text x="390" y="260" font-size="11" fill="#a12c7b" font-weight="700" text-anchor="middle">Instantaneous velocity</text>
  <text x="390" y="276" font-size="11" fill="#28251d" text-anchor="middle">v(t) = s′(t) = ds/dt</text>
</svg>