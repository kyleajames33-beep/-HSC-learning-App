<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">RATE OF CHANGE IN CONTEXT — L10</text>
  <!-- Axes -->
  <line x1="50" y1="230" x2="480" y2="230" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="70" y1="30" x2="70" y2="245" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="482" y="234" font-size="11" fill="#7a7974" font-style="italic">t</text>
  <text x="74" y="28" font-size="11" fill="#7a7974" font-style="italic">s</text>
  <text x="30" y="234" font-size="10" fill="#7a7974">0</text>
  <!-- Distance-time curve -->
  <path d="M 70,220 C 130,200 190,160 240,110 C 290,60 330,50 370,56 C 410,62 450,90 480,120" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Average rate: interval t1 to t2 -->
  <line x1="150" y1="192" x2="150" y2="230" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="350" y1="60" x2="350" y2="230" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="150" cy="192" r="4" fill="#da7101"/>
  <circle cx="350" cy="60" r="4" fill="#da7101"/>
  <line x1="120" y1="208" x2="380" y2="44" stroke="#da7101" stroke-width="2" stroke-linecap="round"/>
  <text x="140" y="246" font-size="10" fill="#da7101" text-anchor="middle">t₁</text>
  <text x="350" y="246" font-size="10" fill="#da7101" text-anchor="middle">t₂</text>
  <!-- Avg rate label -->
  <rect x="370" y="120" width="140" height="44" rx="8" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <text x="440" y="138" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">Avg speed</text>
  <text x="440" y="154" font-size="11" fill="#28251d" text-anchor="middle">(s₂−s₁)/(t₂−t₁)</text>
  <!-- Instantaneous rate at point P -->
  <circle cx="240" cy="110" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="2"/>
  <line x1="180" y1="152" x2="310" y2="72" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="50" y="50" width="130" height="44" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="115" y="68" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">Instant. speed</text>
  <text x="115" y="84" font-size="11" fill="#28251d" text-anchor="middle">s’(t) at t = t₀</text>
  <!-- Arrow -->
  <line x1="155" y1="72" x2="230" y2="110" stroke="#006494" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#rca)"/>
  <defs><marker id="rca" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#006494"/></marker></defs>
  <!-- Bottom note -->
  <text x="260" y="270" font-size="11" fill="#7a7974" text-anchor="middle">Applications: speed, population growth, fluid flow, marginal cost</text>
</svg>