<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="360" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">FIRST DERIVATIVE TEST — L07</text>
  <defs><marker id="fdt" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a7974"/></marker></defs>
  <!-- Start -->
  <rect x="175" y="36" width="170" height="36" rx="18" fill="#28251d"/>
  <text x="260" y="59" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Find f’(x) = 0</text>
  <line x1="260" y1="72" x2="260" y2="92" stroke="#7a7974" stroke-width="1.5" marker-end="url(#fdt)"/>
  <!-- Test sign either side -->
  <rect x="140" y="92" width="240" height="36" rx="8" fill="#da7101"/>
  <text x="260" y="115" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Test sign of f’ either side</text>
  <!-- Three branches -->
  <line x1="160" y1="128" x2="100" y2="160" stroke="#7a7974" stroke-width="1.5" marker-end="url(#fdt)"/>
  <line x1="260" y1="128" x2="260" y2="160" stroke="#7a7974" stroke-width="1.5" marker-end="url(#fdt)"/>
  <line x1="360" y1="128" x2="420" y2="160" stroke="#7a7974" stroke-width="1.5" marker-end="url(#fdt)"/>
  <!-- Branch labels -->
  <text x="100" y="150" font-size="10" fill="#437a22" text-anchor="middle">+ then −</text>
  <text x="260" y="150" font-size="10" fill="#006494" text-anchor="middle">same sign</text>
  <text x="420" y="150" font-size="10" fill="#c0392b" text-anchor="middle">− then +</text>
  <!-- Result boxes -->
  <rect x="34" y="160" width="132" height="52" rx="8" fill="#e8f5ef" stroke="#437a22" stroke-width="2"/>
  <text x="100" y="180" font-size="12" fill="#437a22" font-weight="700" text-anchor="middle">Local MAX</text>
  <text x="100" y="198" font-size="11" fill="#28251d" text-anchor="middle">f’: + → 0 → −</text>
  <text x="100" y="210" font-size="10" fill="#7a7974" text-anchor="middle">slope goes down</text>
  <rect x="194" y="160" width="132" height="52" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="2"/>
  <text x="260" y="180" font-size="12" fill="#006494" font-weight="700" text-anchor="middle">Stationary Inflection</text>
  <text x="260" y="198" font-size="11" fill="#28251d" text-anchor="middle">f’: + → 0 → + or</text>
  <text x="260" y="210" font-size="10" fill="#7a7974" text-anchor="middle">− → 0 → −</text>
  <rect x="354" y="160" width="132" height="52" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="420" y="180" font-size="12" fill="#c0392b" font-weight="700" text-anchor="middle">Local MIN</text>
  <text x="420" y="198" font-size="11" fill="#28251d" text-anchor="middle">f’: − → 0 → +</text>
  <text x="420" y="210" font-size="10" fill="#7a7974" text-anchor="middle">slope goes up</text>
  <!-- Mini curve sketches -->
  <path d="M 50,270 C 70,250 90,242 100,242 C 110,242 130,254 150,274" fill="none" stroke="#437a22" stroke-width="2.5"/>
  <circle cx="100" cy="242" r="4" fill="#437a22"/>
  <path d="M 210,274 C 230,254 250,242 260,242 C 270,242 290,250 310,270" fill="none" stroke="#006494" stroke-width="2.5"/>
  <circle cx="260" cy="242" r="4" fill="#006494"/>
  <path d="M 370,242 C 390,262 410,274 420,274 C 430,274 450,262 470,242" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="420" cy="274" r="4" fill="#c0392b"/>
  <!-- Rule -->
  <rect x="30" y="300" width="460" height="40" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="316" font-size="11" fill="#28251d" text-anchor="middle">Always check sign of f’ to the LEFT and RIGHT of the stationary point</text>
  <text x="260" y="332" font-size="11" fill="#7a7974" text-anchor="middle">A sign table makes this systematic</text>
</svg>