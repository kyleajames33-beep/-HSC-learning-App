<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="340" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">FIRST DERIVATIVE TEST FLOWCHART — L07</text>
  <defs><marker id="fdt" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a7974"/></marker></defs>
  <!-- Step 1 -->
  <rect x="160" y="38" width="200" height="36" rx="18" fill="#28251d"/>
  <text x="260" y="61" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Differentiate: find f′(x)</text>
  <line x1="260" y1="74" x2="260" y2="94" stroke="#7a7974" stroke-width="1.5" marker-end="url(#fdt)"/>
  <!-- Step 2 -->
  <rect x="140" y="94" width="240" height="36" rx="8" fill="#006494"/>
  <text x="260" y="117" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Solve f′(x) = 0</text>
  <line x1="260" y1="130" x2="260" y2="150" stroke="#7a7974" stroke-width="1.5" marker-end="url(#fdt)"/>
  <!-- Step 3 -->
  <rect x="140" y="150" width="240" height="36" rx="8" fill="#da7101"/>
  <text x="260" y="173" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Test sign of f′ either side</text>
  <!-- Branch lines -->
  <line x1="180" y1="186" x2="100" y2="214" stroke="#7a7974" stroke-width="1.5" marker-end="url(#fdt)"/>
  <line x1="260" y1="186" x2="260" y2="214" stroke="#7a7974" stroke-width="1.5" marker-end="url(#fdt)"/>
  <line x1="340" y1="186" x2="420" y2="214" stroke="#7a7974" stroke-width="1.5" marker-end="url(#fdt)"/>
  <!-- Branch labels -->
  <text x="128" y="206" font-size="10" fill="#437a22" font-weight="700" text-anchor="middle">+→−</text>
  <text x="260" y="206" font-size="10" fill="#7a7974" font-weight="700" text-anchor="middle">+→+  or  −→−</text>
  <text x="392" y="206" font-size="10" fill="#c0392b" font-weight="700" text-anchor="middle">−→+</text>
  <!-- Outcome boxes -->
  <rect x="40" y="214" width="120" height="44" rx="8" fill="#e8f5e9" stroke="#437a22" stroke-width="2"/>
  <text x="100" y="232" font-size="12" fill="#437a22" font-weight="700" text-anchor="middle">LOCAL MAX</text>
  <text x="100" y="248" font-size="18" text-anchor="middle">∩</text>
  <rect x="200" y="214" width="120" height="44" rx="8" fill="#f7f6f2" stroke="#7a7974" stroke-width="2"/>
  <text x="260" y="232" font-size="12" fill="#7a7974" font-weight="700" text-anchor="middle">STATIONARY</text>
  <text x="260" y="248" font-size="11" fill="#7a7974" text-anchor="middle">INFLECTION</text>
  <rect x="360" y="214" width="120" height="44" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="420" y="232" font-size="12" fill="#c0392b" font-weight="700" text-anchor="middle">LOCAL MIN</text>
  <text x="420" y="248" font-size="18" text-anchor="middle">∪</text>
  <!-- Sign chart example -->
  <rect x="40" y="272" width="440" height="52" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="290" font-size="11" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.05em">SIGN CHART EXAMPLE — f′(x) at x = 2</text>
  <text x="80" y="312" font-size="12" fill="#437a22" font-weight="700" text-anchor="middle">x &lt; 2 → +</text>
  <text x="260" y="312" font-size="12" fill="#a12c7b" font-weight="700" text-anchor="middle">x = 2 → 0</text>
  <text x="430" y="312" font-size="12" fill="#c0392b" font-weight="700" text-anchor="middle">x &gt; 2 → −</text>
  <text x="260" y="316" font-size="10" fill="#7a7974" text-anchor="middle"> </text>
  <text x="260" y="317" font-size="10" fill="#437a22" text-anchor="middle">∴ local maximum at x = 2</text>
</svg>