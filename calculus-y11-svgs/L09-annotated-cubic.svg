<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">ANNOTATED CUBIC SKETCH — L09</text>
  <!-- Axes -->
  <line x1="40" y1="200" x2="490" y2="200" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="180" y1="30" x2="180" y2="215" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="204" font-size="11" fill="#7a7974" font-style="italic">x</text>
  <text x="184" y="28" font-size="11" fill="#7a7974" font-style="italic">y</text>
  <!-- y-axis tick labels -->
  <text x="170" y="204" font-size="10" fill="#7a7974" text-anchor="end">0</text>
  <!-- Cubic curve: f(x) = x³ - 3x mapped roughly -->
  <!-- x-intercepts at ~x=110,180,340; local max ~(140,220 area); local min ~(310,180 area) -->
  <path d="M 55,240 C 90,235 110,200 140,155 C 160,125 178,118 195,135 C 220,160 260,200 305,205 C 330,207 360,185 390,140 C 420,100 450,65 475,48" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- x-intercepts -->
  <circle cx="108" cy="200" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="2"/>
  <text x="108" y="215" font-size="10" fill="#006494" text-anchor="middle">√3, 0)</text>
  <text x="108" y="225" font-size="10" fill="#006494" text-anchor="middle">x-int</text>
  <circle cx="180" cy="200" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="2"/>
  <text x="180" y="215" font-size="10" fill="#006494" text-anchor="middle">(0,0)</text>
  <circle cx="350" cy="200" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="2"/>
  <text x="350" y="215" font-size="10" fill="#006494" text-anchor="middle">(√3, 0)</text>
  <!-- local max -->
  <circle cx="140" cy="155" r="6" fill="#437a22" stroke="#f7f6f2" stroke-width="2"/>
  <text x="88" y="148" font-size="10" fill="#437a22" font-weight="700">local max</text>
  <text x="88" y="160" font-size="10" fill="#437a22">f′=0, f″&lt;0</text>
  <!-- local min -->
  <circle cx="305" cy="205" r="6" fill="#c0392b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="330" y="202" font-size="10" fill="#c0392b" font-weight="700">local min</text>
  <text x="330" y="214" font-size="10" fill="#c0392b">f′=0, f″&gt;0</text>
  <!-- inflection -->
  <circle cx="220" cy="178" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <text x="225" y="170" font-size="10" fill="#da7101" font-weight="700">inflection</text>
  <text x="225" y="182" font-size="10" fill="#da7101">f″=0</text>
  <!-- y-intercept -->
  <circle cx="180" cy="200" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="2"/>
  <!-- concavity arrows -->
  <text x="110" y="258" font-size="10" fill="#c0392b" text-anchor="middle">concave ↓</text>
  <text x="340" y="258" font-size="10" fill="#437a22" text-anchor="middle">concave ↑</text>
  <text x="110" y="270" font-size="9" fill="#c0392b" text-anchor="middle">f″ &lt; 0</text>
  <text x="340" y="270" font-size="9" fill="#437a22" text-anchor="middle">f″ &gt; 0</text>
  <!-- example label -->
  <text x="260" y="296" font-size="11" fill="#7a7974" text-anchor="middle">Example: f(x) = x³ − 3x</text>
</svg>