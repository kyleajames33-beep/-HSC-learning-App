<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="340" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">ANNOTATED CUBIC SKETCH — L09</text>
  <!-- Axes -->
  <line x1="30" y1="200" x2="490" y2="200" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="170" y1="30" x2="170" y2="300" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="204" font-size="11" fill="#7a7974" font-style="italic">x</text>
  <text x="174" y="28" font-size="11" fill="#7a7974" font-style="italic">y</text>
  <!-- Cubic curve: y = x^3 - 3x + 2 (roots at x=-2,1,1) roughly -->
  <!-- local max at x=-1 (y=4), local min at x=1 (y=0) -->
  <!-- map: x=-3 to x=3 -> 50 to 490, y=-4 to 6 -> 270 to 50 -->
  <!-- x scale: 73px/unit, y scale: 22px/unit inverted -->
  <path d="M 50,270 C 80,250 120,160 135,110 C 150,60 175,42 195,50 C 215,58 230,100 250,200 C 270,264 295,270 330,270 C 365,270 410,200 450,130" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- x-intercepts -->
  <circle cx="86" cy="200" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="250" cy="200" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="330" cy="200" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="86" y="216" font-size="10" fill="#006494" text-anchor="middle">−2</text>
  <text x="250" y="216" font-size="10" fill="#006494" text-anchor="middle">1</text>
  <text x="330" y="216" font-size="10" fill="#006494" text-anchor="middle">2</text>
  <!-- y-intercept -->
  <circle cx="170" cy="156" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="154" y="153" font-size="10" fill="#006494">(0, 2)</text>
  <!-- Local max -->
  <circle cx="135" cy="110" r="6" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <text x="100" y="104" font-size="11" fill="#da7101" font-weight="700">local max</text>
  <text x="100" y="118" font-size="10" fill="#da7101">(−1, 4)</text>
  <!-- Local min -->
  <circle cx="250" cy="200" r="6" fill="#c0392b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="256" y="188" font-size="11" fill="#c0392b" font-weight="700">local min</text>
  <text x="256" y="200" font-size="10" fill="#c0392b">(1, 0)</text>
  <!-- Inflection point -->
  <circle cx="195" cy="50" r="5" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="200" y="44" font-size="10" fill="#a12c7b">inflection (0, 2)?</text>
  <!-- Concavity annotations -->
  <text x="100" y="76" font-size="10" fill="#437a22">∩ concave down</text>
  <text x="310" y="250" font-size="10" fill="#437a22">∪ concave up</text>
  <!-- Bottom note -->
  <text x="260" y="318" font-size="11" fill="#7a7974" text-anchor="middle">f(x) = x³ − 3x + 2 with all key features labelled</text>
</svg>