<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">DIFFERENTIATING A POLYNOMIAL — L04</text>
  <!-- f(x) box -->
  <rect x="40" y="44" width="440" height="44" rx="10" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="130" y="62" font-size="11" fill="#7a7974" text-anchor="middle">f(x) =</text>
  <text x="220" y="66" font-size="15" fill="#da7101" font-weight="700" text-anchor="middle">3x⁴</text>
  <text x="260" y="66" font-size="15" fill="#28251d" font-weight="400" text-anchor="middle">−</text>
  <text x="305" y="66" font-size="15" fill="#01696f" font-weight="700" text-anchor="middle">2x²</text>
  <text x="346" y="66" font-size="15" fill="#28251d" font-weight="400" text-anchor="middle">+</text>
  <text x="382" y="66" font-size="15" fill="#006494" font-weight="700" text-anchor="middle">5x</text>
  <text x="415" y="66" font-size="15" fill="#28251d" font-weight="400" text-anchor="middle">−</text>
  <text x="444" y="66" font-size="15" fill="#a12c7b" font-weight="700" text-anchor="middle">7</text>
  <!-- Arrow -->
  <text x="260" y="106" font-size="20" fill="#7a7974" text-anchor="middle">↓ differentiate each term</text>
  <!-- Term breakdown -->
  <rect x="40" y="116" width="96" height="56" rx="8" fill="#fff0dc" stroke="#da7101" stroke-width="2"/>
  <text x="88" y="138" font-size="11" fill="#da7101" text-anchor="middle" font-weight="700">3x⁴</text>
  <text x="88" y="155" font-size="11" fill="#28251d" text-anchor="middle">4×3x³</text>
  <text x="88" y="168" font-size="12" fill="#da7101" text-anchor="middle" font-weight="700">= 12x³</text>
  <rect x="152" y="116" width="96" height="56" rx="8" fill="#e8f5ef" stroke="#01696f" stroke-width="2"/>
  <text x="200" y="138" font-size="11" fill="#01696f" text-anchor="middle" font-weight="700">−2x²</text>
  <text x="200" y="155" font-size="11" fill="#28251d" text-anchor="middle">2×(−2x)</text>
  <text x="200" y="168" font-size="12" fill="#01696f" text-anchor="middle" font-weight="700">= −4x</text>
  <rect x="264" y="116" width="96" height="56" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="2"/>
  <text x="312" y="138" font-size="11" fill="#006494" text-anchor="middle" font-weight="700">5x</text>
  <text x="312" y="155" font-size="11" fill="#28251d" text-anchor="middle">1×5x⁰</text>
  <text x="312" y="168" font-size="12" fill="#006494" text-anchor="middle" font-weight="700">= 5</text>
  <rect x="376" y="116" width="96" height="56" rx="8" fill="#f9e8f4" stroke="#a12c7b" stroke-width="2"/>
  <text x="424" y="138" font-size="11" fill="#a12c7b" text-anchor="middle" font-weight="700">−7</text>
  <text x="424" y="155" font-size="11" fill="#28251d" text-anchor="middle">constant</text>
  <text x="424" y="168" font-size="12" fill="#a12c7b" text-anchor="middle" font-weight="700">= 0</text>
  <!-- Result -->
  <rect x="40" y="188" width="440" height="44" rx="10" fill="#28251d"/>
  <text x="130" y="207" font-size="11" fill="#bab9b4" text-anchor="middle">f’(x) =</text>
  <text x="220" y="211" font-size="15" fill="#da7101" font-weight="700" text-anchor="middle">12x³</text>
  <text x="262" y="211" font-size="15" fill="#fff" font-weight="400" text-anchor="middle">−</text>
  <text x="300" y="211" font-size="15" fill="#01696f" font-weight="700" text-anchor="middle">4x</text>
  <text x="334" y="211" font-size="15" fill="#fff" font-weight="400" text-anchor="middle">+</text>
  <text x="366" y="211" font-size="15" fill="#006494" font-weight="700" text-anchor="middle">5</text>
  <text x="260" y="256" font-size="11" fill="#7a7974" text-anchor="middle">Differentiate term-by-term, constants vanish</text>
</svg>