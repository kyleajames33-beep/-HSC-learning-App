<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">SUM &amp; DIFFERENCE RULE — L04</text>
  <!-- Rule box -->
  <rect x="40" y="40" width="440" height="48" rx="10" fill="#006494"/>
  <text x="260" y="60" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">d/dx [f(x) ± g(x)] = f′(x) ± g′(x)</text>
  <text x="260" y="79" font-size="11" fill="#c8e4f5" text-anchor="middle">differentiate each term independently</text>
  <!-- Example: f(x) = 4x³ − 3x² + 7x − 5 -->
  <rect x="40" y="104" width="440" height="168" rx="10" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="122" font-size="12" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.05em">EXAMPLE</text>
  <text x="60" y="144" font-size="14" fill="#28251d">f(x) = 4x³ − 3x² + 7x − 5</text>
  <!-- Term by term -->
  <!-- 4x³ → 12x² -->
  <rect x="56" y="154" width="92" height="28" rx="6" fill="#dcedf7" stroke="#006494" stroke-width="1"/>
  <text x="102" y="173" font-size="13" fill="#006494" font-weight="700" text-anchor="middle">4x³</text>
  <text x="154" y="173" font-size="18" fill="#bab9b4">→</text>
  <rect x="166" y="154" width="92" height="28" rx="6" fill="#e8f5e9" stroke="#437a22" stroke-width="1"/>
  <text x="212" y="173" font-size="13" fill="#437a22" font-weight="700" text-anchor="middle">12x²</text>
  <!-- −3x² → −6x -->
  <rect x="56" y="190" width="92" height="28" rx="6" fill="#dcedf7" stroke="#006494" stroke-width="1"/>
  <text x="102" y="209" font-size="13" fill="#006494" font-weight="700" text-anchor="middle">−3x²</text>
  <text x="154" y="209" font-size="18" fill="#bab9b4">→</text>
  <rect x="166" y="190" width="92" height="28" rx="6" fill="#e8f5e9" stroke="#437a22" stroke-width="1"/>
  <text x="212" y="209" font-size="13" fill="#437a22" font-weight="700" text-anchor="middle">−6x</text>
  <!-- 7x → 7 -->
  <rect x="56" y="226" width="92" height="28" rx="6" fill="#dcedf7" stroke="#006494" stroke-width="1"/>
  <text x="102" y="245" font-size="13" fill="#006494" font-weight="700" text-anchor="middle">7x</text>
  <text x="154" y="245" font-size="18" fill="#bab9b4">→</text>
  <rect x="166" y="226" width="92" height="28" rx="6" fill="#e8f5e9" stroke="#437a22" stroke-width="1"/>
  <text x="212" y="245" font-size="13" fill="#437a22" font-weight="700" text-anchor="middle">7</text>
  <!-- −5 → 0 -->
  <rect x="56" y="262" width="92" height="28" rx="6" fill="#dcedf7" stroke="#006494" stroke-width="1"/>
  <text x="102" y="281" font-size="13" fill="#006494" font-weight="700" text-anchor="middle">−5</text>
  <text x="154" y="281" font-size="18" fill="#bab9b4">→</text>
  <rect x="166" y="262" width="92" height="28" rx="6" fill="#e8f5e9" stroke="#437a22" stroke-width="1"/>
  <text x="212" y="281" font-size="13" fill="#437a22" font-weight="700" text-anchor="middle">0</text>
  <!-- Result -->
  <rect x="280" y="154" width="186" height="136" rx="8" fill="#cedcd8" stroke="#01696f" stroke-width="2"/>
  <text x="373" y="178" font-size="12" font-weight="700" fill="#0c4e54" text-anchor="middle">Result</text>
  <text x="373" y="200" font-size="13" fill="#0c4e54" text-anchor="middle">f′(x) =</text>
  <text x="373" y="220" font-size="13" fill="#0c4e54" font-weight="700" text-anchor="middle">12x² − 6x + 7</text>
  <text x="373" y="244" font-size="10" fill="#0c4e54" text-anchor="middle">(constant term</text>
  <text x="373" y="258" font-size="10" fill="#0c4e54" text-anchor="middle">disappears)</text>
</svg>