<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="340" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">TANGENT &amp; NORMAL TO A CURVE — L06</text>
  <!-- Axes -->
  <line x1="40" y1="250" x2="480" y2="250" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="80" y1="30" x2="80" y2="270" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="482" y="254" font-size="11" fill="#7a7974" font-style="italic">x</text>
  <text x="84" y="28" font-size="11" fill="#7a7974" font-style="italic">y</text>
  <!-- Curve -->
  <path d="M 90,240 C 130,200 180,140 230,110 C 280,80 350,80 420,120" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Point P at x~230, y~110 -->
  <circle cx="230" cy="110" r="6" fill="#28251d" stroke="#f7f6f2" stroke-width="2"/>
  <text x="238" y="106" font-size="13" fill="#28251d" font-weight="700">P</text>
  <!-- Tangent line: slope ~-1.2, through (230,110) -->
  <line x1="100" y1="278" x2="370" y2="-14" stroke="#da7101" stroke-width="2.5" stroke-linecap="round" clip-path="url(#clip1)"/>
  <defs><clipPath id="clip1"><rect x="0" y="0" width="520" height="340"/></clipPath></defs>
  <line x1="100" y1="278" x2="380" y2="30" stroke="#da7101" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Normal line: perpendicular, slope ~+0.83, through (230,110) -->
  <line x1="100" y1="-20" x2="400" y2="340" stroke="#006494" stroke-width="2.5" stroke-linecap="round" clip-path="url(#clip1)"/>
  <line x1="140" y1="36" x2="370" y2="302" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right angle mark -->
  <rect x="230" y="110" width="14" height="14" fill="none" stroke="#28251d" stroke-width="1.5" transform="rotate(-40 230 110)"/>
  <!-- Labels -->
  <text x="348" y="48" font-size="12" fill="#da7101" font-weight="700">Tangent</text>
  <text x="348" y="64" font-size="11" fill="#7a7974">slope = f’(a)</text>
  <text x="354" y="286" font-size="12" fill="#006494" font-weight="700">Normal</text>
  <text x="354" y="302" font-size="11" fill="#7a7974">slope = −1/f’(a)</text>
  <!-- Formula boxes -->
  <rect x="20" y="286" width="220" height="40" rx="8" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <text x="130" y="302" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">Tangent at (a, f(a)):</text>
  <text x="130" y="318" font-size="11" fill="#28251d" text-anchor="middle">y − f(a) = f’(a)(x − a)</text>
  <rect x="252" y="286" width="250" height="40" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="377" y="302" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">Normal at (a, f(a)):</text>
  <text x="377" y="318" font-size="11" fill="#28251d" text-anchor="middle">y − f(a) = −1/f’(a) · (x − a)</text>
</svg>