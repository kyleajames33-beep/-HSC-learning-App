<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">LEFT &amp; RIGHT LIMITS — L02</text>
  <!-- Axes -->
  <line x1="40" y1="170" x2="480" y2="170" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="260" y1="30" x2="260" y2="280" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- Continuous curve (left of a) -->
  <path d="M 60,250 C 120,220 180,180 240,145" fill="none" stroke="#da7101" stroke-width="3" stroke-linecap="round"/>
  <!-- Continuous curve (right of a) -->
  <path d="M 280,145 C 340,110 400,90 460,80" fill="none" stroke="#006494" stroke-width="3" stroke-linecap="round"/>
  <!-- Limit point (open circle since we approach but don't reach) -->
  <circle cx="260" cy="145" r="6" fill="#f7f6f2" stroke="#a12c7b" stroke-width="2.5"/>
  <!-- a label on x-axis -->
  <line x1="260" y1="166" x2="260" y2="174" stroke="#7a7974" stroke-width="1.5"/>
  <text x="260" y="188" font-size="13" fill="#28251d" font-weight="700" text-anchor="middle">a</text>
  <!-- L label on y-axis -->
  <line x1="254" y1="145" x2="266" y2="145" stroke="#a12c7b" stroke-width="1.5"/>
  <text x="244" y="149" font-size="13" fill="#a12c7b" font-weight="700" text-anchor="end">L</text>
  <!-- Left approach arrows -->
  <line x1="200" y1="170" x2="245" y2="170" stroke="#da7101" stroke-width="2" marker-end="url(#la)"/>
  <defs><marker id="la" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#da7101"/></marker></defs>
  <text x="222" y="186" font-size="11" fill="#da7101" text-anchor="middle">x → a⁻</text>
  <!-- Right approach arrows -->
  <line x1="320" y1="170" x2="275" y2="170" stroke="#006494" stroke-width="2" marker-end="url(#ra)"/>
  <defs><marker id="ra" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#006494"/></marker></defs>
  <text x="298" y="186" font-size="11" fill="#006494" text-anchor="middle">x → a⁺</text>
  <!-- Labels on curves -->
  <text x="130" y="202" font-size="11" fill="#da7101" font-weight="600">from the left</text>
  <text x="360" y="96" font-size="11" fill="#006494" font-weight="600">from the right</text>
  <!-- Exists box -->
  <rect x="30" y="238" width="220" height="54" rx="8" fill="#e8f5ef" stroke="#01696f" stroke-width="1.5"/>
  <text x="140" y="256" font-size="11" fill="#01696f" font-weight="700" text-anchor="middle">Limit EXISTS when:</text>
  <text x="140" y="274" font-size="12" fill="#28251d" text-anchor="middle">lim⁻ = lim⁺ = L</text>
  <text x="140" y="287" font-size="10" fill="#7a7974" text-anchor="middle">both sides approach same value</text>
  <!-- DNE box -->
  <rect x="270" y="238" width="220" height="54" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="380" y="256" font-size="11" fill="#c0392b" font-weight="700" text-anchor="middle">Limit DNE when:</text>
  <text x="380" y="274" font-size="12" fill="#28251d" text-anchor="middle">lim⁻ ≠ lim⁺</text>
  <text x="380" y="287" font-size="10" fill="#7a7974" text-anchor="middle">sides approach different values</text>
</svg>