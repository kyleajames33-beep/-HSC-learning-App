<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">LEFT &amp; RIGHT LIMITS — L02</text>
  <!-- Axes -->
  <line x1="40" y1="185" x2="490" y2="185" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="260" y1="40" x2="260" y2="200" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- Left branch of curve (x < 2, approaches L from left) -->
  <path d="M 60,170 C 120,168 180,155 240,132" fill="none" stroke="#da7101" stroke-width="3" stroke-linecap="round"/>
  <!-- Right branch (x > 2, approaches L from right) -->
  <path d="M 284,132 C 340,155 400,168 460,170" fill="none" stroke="#006494" stroke-width="3" stroke-linecap="round"/>
  <!-- Limit value line -->
  <line x1="200" y1="125" x2="320" y2="125" stroke="#01696f" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="328" y="129" font-size="12" fill="#01696f" font-weight="700">L</text>
  <!-- Open circles at limit point -->
  <circle cx="262" cy="125" r="6" fill="#f7f6f2" stroke="#01696f" stroke-width="2"/>
  <!-- a marker on x-axis -->
  <line x1="262" y1="181" x2="262" y2="189" stroke="#01696f" stroke-width="1.5"/>
  <text x="262" y="200" font-size="12" fill="#01696f" font-weight="700" text-anchor="middle">a</text>
  <!-- Left approach arrows -->
  <line x1="200" y1="185" x2="250" y2="185" stroke="#da7101" stroke-width="2" marker-end="url(#la)"/>
  <defs><marker id="la" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#da7101"/></marker></defs>
  <text x="190" y="200" font-size="11" fill="#da7101" font-weight="600" text-anchor="middle">x→a⁻</text>
  <!-- Right approach arrows -->
  <line x1="330" y1="185" x2="278" y2="185" stroke="#006494" stroke-width="2" marker-end="url(#ra)"/>
  <defs><marker id="ra" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#006494"/></marker></defs>
  <text x="340" y="200" font-size="11" fill="#006494" font-weight="600" text-anchor="middle">x→a⁺</text>
  <!-- Notation boxes -->
  <rect x="30" y="220" width="200" height="44" rx="8" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <text x="130" y="238" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">Left-hand limit</text>
  <text x="130" y="256" font-size="12" fill="#7a4400" text-anchor="middle">lim f(x) = L</text>
  <text x="130" y="268" font-size="10" fill="#7a4400" text-anchor="middle">x→a⁻</text>
  <rect x="290" y="220" width="200" height="44" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="390" y="238" font-size="12" fill="#006494" font-weight="700" text-anchor="middle">Right-hand limit</text>
  <text x="390" y="256" font-size="12" fill="#003d5c" text-anchor="middle">lim f(x) = L</text>
  <text x="390" y="268" font-size="10" fill="#003d5c" text-anchor="middle">x→a⁺</text>
  <!-- Rule -->
  <rect x="130" y="278" width="260" height="30" rx="7" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="260" y="297" font-size="12" fill="#0c4e54" font-weight="600" text-anchor="middle">Limit exists ⇔ left = right = L</text>
</svg>