<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">CHORD SHRINKING TO TANGENT — L03</text>
  <!-- Axes -->
  <line x1="50" y1="255" x2="490" y2="255" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="70" y1="30" x2="70" y2="265" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- Curve -->
  <path d="M 80,240 C 150,210 220,140 290,95 C 340,68 410,55 470,60" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Fixed point P at x=290,y=95 -->
  <circle cx="290" cy="95" r="6" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="296" y="90" font-size="13" fill="#a12c7b" font-weight="700">P (x, f(x))</text>
  <!-- Q1 far away -->
  <line x1="130" y1="214" x2="440" y2="48" stroke="#da7101" stroke-width="1.5" stroke-dasharray="none" opacity="0.35"/>
  <circle cx="155" cy="204" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2" opacity="0.35"/>
  <text x="100" y="202" font-size="10" fill="#da7101" opacity="0.5">Q₁ (h large)</text>
  <!-- Q2 closer -->
  <line x1="190" y1="163" x2="420" y2="68" stroke="#da7101" stroke-width="1.5" opacity="0.6"/>
  <circle cx="210" cy="150" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2" opacity="0.6"/>
  <text x="155" y="148" font-size="10" fill="#da7101" opacity="0.7">Q₂ (h smaller)</text>
  <!-- Q3 very close -->
  <line x1="248" y1="118" x2="380" y2="72" stroke="#da7101" stroke-width="2" opacity="0.85"/>
  <circle cx="258" cy="112" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2" opacity="0.9"/>
  <text x="204" y="110" font-size="10" fill="#da7101" opacity="0.9">Q₃ (h→0)</text>
  <!-- Tangent line (final) -->
  <line x1="170" y1="130" x2="410" y2="57" stroke="#a12c7b" stroke-width="2.5" stroke-linecap="round"/>
  <text x="414" y="53" font-size="11" fill="#a12c7b" font-weight="700">tangent</text>
  <!-- h bracket -->
  <line x1="290" y1="265" x2="340" y2="265" stroke="#006494" stroke-width="2"/>
  <line x1="290" y1="260" x2="290" y2="270" stroke="#006494" stroke-width="1.5"/>
  <line x1="340" y1="260" x2="340" y2="270" stroke="#006494" stroke-width="1.5"/>
  <text x="315" y="280" font-size="12" fill="#006494" font-weight="700" text-anchor="middle">h</text>
  <text x="315" y="294" font-size="10" fill="#006494" text-anchor="middle">h → 0</text>
  <!-- Formula strip -->
  <rect x="30" y="295" width="460" height="0" rx="0"/>
  <!-- Key idea box -->
  <rect x="30" y="296" width="460" height="0"/>
  <!-- Bottom note -->
  <rect x="30" y="283" width="200" height="26" rx="7" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="130" y="300" font-size="11" fill="#0c4e54" font-weight="600" text-anchor="middle">As h→0: chord → tangent</text>
  <rect x="290" y="283" width="200" height="26" rx="7" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1"/>
  <text x="390" y="300" font-size="11" fill="#6b1040" font-weight="600" text-anchor="middle">slope → f′(x)</text>
</svg>