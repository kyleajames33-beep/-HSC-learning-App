<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="340" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">CHORD SHRINKING TO TANGENT — L03</text>
  <!-- Three panels -->
  <!-- Panel 1: large h -->
  <rect x="16" y="38" width="152" height="200" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1"/>
  <text x="92" y="56" font-size="11" font-weight="700" fill="#da7101" text-anchor="middle">Large h</text>
  <line x1="30" y1="210" x2="158" y2="210" stroke="#bab9b4" stroke-width="1"/>
  <line x1="44" y1="70" x2="44" y2="218" stroke="#bab9b4" stroke-width="1"/>
  <path d="M 44,198 C 70,160 100,110 158,80" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="62" cy="178" r="4" fill="#006494" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="140" cy="100" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <line x1="44" y1="196" x2="158" y2="88" stroke="#da7101" stroke-width="2" stroke-linecap="round"/>
  <text x="62" y="226" font-size="10" fill="#006494" text-anchor="middle">x</text>
  <text x="140" y="226" font-size="10" fill="#da7101" text-anchor="middle">x+h</text>
  <line x1="62" y1="210" x2="62" y2="214" stroke="#7a7974" stroke-width="1"/>
  <line x1="140" y1="210" x2="140" y2="214" stroke="#7a7974" stroke-width="1"/>
  <!-- Panel 2: medium h -->
  <rect x="184" y="38" width="152" height="200" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1"/>
  <text x="260" y="56" font-size="11" font-weight="700" fill="#437a22" text-anchor="middle">Smaller h</text>
  <line x1="198" y1="210" x2="326" y2="210" stroke="#bab9b4" stroke-width="1"/>
  <line x1="212" y1="70" x2="212" y2="218" stroke="#bab9b4" stroke-width="1"/>
  <path d="M 212,198 C 238,160 268,110 326,80" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="230" cy="178" r="4" fill="#006494" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="278" cy="126" r="4" fill="#437a22" stroke="#f7f6f2" stroke-width="1.5"/>
  <line x1="212" y1="192" x2="320" y2="116" stroke="#437a22" stroke-width="2" stroke-linecap="round"/>
  <text x="230" y="226" font-size="10" fill="#006494" text-anchor="middle">x</text>
  <text x="278" y="226" font-size="10" fill="#437a22" text-anchor="middle">x+h</text>
  <line x1="230" y1="210" x2="230" y2="214" stroke="#7a7974" stroke-width="1"/>
  <line x1="278" y1="210" x2="278" y2="214" stroke="#7a7974" stroke-width="1"/>
  <!-- Panel 3: h->0 (tangent) -->
  <rect x="352" y="38" width="152" height="200" rx="8" fill="#fff" stroke="#006494" stroke-width="2"/>
  <text x="428" y="56" font-size="11" font-weight="700" fill="#006494" text-anchor="middle">h → 0 (tangent)</text>
  <line x1="366" y1="210" x2="494" y2="210" stroke="#bab9b4" stroke-width="1"/>
  <line x1="380" y1="70" x2="380" y2="218" stroke="#bab9b4" stroke-width="1"/>
  <path d="M 380,198 C 406,160 436,110 494,80" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="398" cy="178" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="2"/>
  <line x1="366" y1="198" x2="494" y2="140" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <text x="398" y="226" font-size="10" fill="#006494" text-anchor="middle">x (=P)</text>
  <line x1="398" y1="210" x2="398" y2="214" stroke="#7a7974" stroke-width="1"/>
  <!-- Arrow between panels -->
  <text x="175" y="142" font-size="18" fill="#7a7974" text-anchor="middle">→</text>
  <text x="343" y="142" font-size="18" fill="#7a7974" text-anchor="middle">→</text>
  <!-- Bottom formula -->
  <rect x="16" y="252" width="488" height="68" rx="10" fill="#28251d"/>
  <text x="260" y="276" font-size="13" fill="#fff" text-anchor="middle">As h → 0: gradient of chord → f’(x)</text>
  <text x="260" y="298" font-size="13" fill="#bab9b4" text-anchor="middle">[f(x+h) − f(x)] / h  →  exact instantaneous gradient</text>
</svg>