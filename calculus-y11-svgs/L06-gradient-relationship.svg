<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="240" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">TANGENT &amp; NORMAL GRADIENT RULE — L06</text>
  <!-- Main rule -->
  <rect x="60" y="40" width="400" height="56" rx="12" fill="#28251d"/>
  <text x="260" y="68" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">mₜ × mₙ = −1</text>
  <text x="260" y="86" font-size="12" fill="#bab9b4" text-anchor="middle">tangent and normal are perpendicular</text>
  <!-- Two sides -->
  <rect x="40" y="114" width="190" height="90" rx="10" fill="#fff0dc" stroke="#da7101" stroke-width="2"/>
  <text x="135" y="134" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">Tangent gradient</text>
  <text x="135" y="156" font-size="16" fill="#28251d" font-weight="700" text-anchor="middle">mₜ = f’(a)</text>
  <text x="135" y="178" font-size="11" fill="#7a7974" text-anchor="middle">from the derivative</text>
  <text x="135" y="196" font-size="11" fill="#7a7974" text-anchor="middle">at the point x = a</text>
  <rect x="290" y="114" width="190" height="90" rx="10" fill="#dcedf7" stroke="#006494" stroke-width="2"/>
  <text x="385" y="134" font-size="12" fill="#006494" font-weight="700" text-anchor="middle">Normal gradient</text>
  <text x="385" y="156" font-size="16" fill="#28251d" font-weight="700" text-anchor="middle">mₙ = −1 / f’(a)</text>
  <text x="385" y="178" font-size="11" fill="#7a7974" text-anchor="middle">negative reciprocal</text>
  <text x="385" y="196" font-size="11" fill="#7a7974" text-anchor="middle">of tangent gradient</text>
  <!-- Multiply symbol -->
  <text x="260" y="166" font-size="22" fill="#28251d" text-anchor="middle">×</text>
  <text x="260" y="220" font-size="11" fill="#7a7974" text-anchor="middle">If f’(a) = 0, the tangent is horizontal and normal is vertical</text>
</svg>