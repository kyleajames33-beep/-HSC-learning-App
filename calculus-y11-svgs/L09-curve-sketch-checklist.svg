<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="360" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">CURVE SKETCHING CHECKLIST — L09</text>
  <defs><marker id="csa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a7974"/></marker></defs>
  <!-- Step 1 -->
  <rect x="140" y="38" width="240" height="40" rx="8" fill="#006494"/>
  <text x="260" y="55" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1. y-intercept</text>
  <text x="260" y="70" font-size="11" fill="#c8e4f5" text-anchor="middle">set x = 0, find y</text>
  <line x1="260" y1="78" x2="260" y2="98" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <!-- Step 2 -->
  <rect x="140" y="98" width="240" height="40" rx="8" fill="#006494"/>
  <text x="260" y="115" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2. x-intercepts</text>
  <text x="260" y="130" font-size="11" fill="#c8e4f5" text-anchor="middle">set y = 0, solve f(x) = 0</text>
  <line x1="260" y1="138" x2="260" y2="158" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <!-- Step 3 -->
  <rect x="140" y="158" width="240" height="40" rx="8" fill="#da7101"/>
  <text x="260" y="175" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3. Stationary points</text>
  <text x="260" y="190" font-size="11" fill="#fff5e0" text-anchor="middle">solve f′(x) = 0, find y coords</text>
  <line x1="260" y1="198" x2="260" y2="218" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <!-- Step 4 -->
  <rect x="140" y="218" width="240" height="40" rx="8" fill="#da7101"/>
  <text x="260" y="235" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">4. Classify stationary points</text>
  <text x="260" y="250" font-size="11" fill="#fff5e0" text-anchor="middle">1st or 2nd derivative test</text>
  <line x1="260" y1="258" x2="260" y2="278" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <!-- Step 5 -->
  <rect x="140" y="278" width="240" height="40" rx="8" fill="#437a22"/>
  <text x="260" y="295" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">5. Inflection points</text>
  <text x="260" y="310" font-size="11" fill="#d4f0c4" text-anchor="middle">solve f″(x) = 0, check sign change</text>
  <line x1="260" y1="318" x2="260" y2="334" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <!-- Final -->
  <rect x="140" y="334" width="240" height="18" rx="9" fill="#28251d"/>
  <text x="260" y="347" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">6. Sketch ✓</text>
</svg>