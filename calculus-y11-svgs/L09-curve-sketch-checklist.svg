<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="380" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">CURVE SKETCHING CHECKLIST — L09</text>
  <defs><marker id="csa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a7974"/></marker></defs>
  <!-- Steps -->
  <rect x="130" y="36" width="260" height="40" rx="8" fill="#006494"/>
  <text x="260" y="52" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1. y-intercept</text>
  <text x="260" y="68" font-size="11" fill="#dcedf7" text-anchor="middle">let x = 0, find f(0)</text>
  <line x1="260" y1="76" x2="260" y2="96" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <rect x="130" y="96" width="260" height="40" rx="8" fill="#006494"/>
  <text x="260" y="112" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2. x-intercepts</text>
  <text x="260" y="128" font-size="11" fill="#dcedf7" text-anchor="middle">let y = 0, solve f(x) = 0</text>
  <line x1="260" y1="136" x2="260" y2="156" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <rect x="130" y="156" width="260" height="40" rx="8" fill="#da7101"/>
  <text x="260" y="172" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3. Find f’(x)</text>
  <text x="260" y="188" font-size="11" fill="#fff0dc" text-anchor="middle">differentiate using power rule etc</text>
  <line x1="260" y1="196" x2="260" y2="216" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <rect x="130" y="216" width="260" height="40" rx="8" fill="#da7101"/>
  <text x="260" y="232" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">4. Stationary points</text>
  <text x="260" y="248" font-size="11" fill="#fff0dc" text-anchor="middle">solve f’(x) = 0, find y-values</text>
  <line x1="260" y1="256" x2="260" y2="276" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <rect x="130" y="276" width="260" height="40" rx="8" fill="#a12c7b"/>
  <text x="260" y="292" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">5. Classify &amp; concavity</text>
  <text x="260" y="308" font-size="11" fill="#f9e8f4" text-anchor="middle">find f″(x), test sign at stat. points</text>
  <line x1="260" y1="316" x2="260" y2="336" stroke="#7a7974" stroke-width="1.5" marker-end="url(#csa)"/>
  <rect x="130" y="336" width="260" height="32" rx="8" fill="#437a22"/>
  <text x="260" y="356" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6. Sketch ✓</text>
  <!-- Side notes -->
  <text x="16" y="58" font-size="10" fill="#006494">domain?</text>
  <text x="16" y="118" font-size="10" fill="#006494">factor/quad</text>
  <text x="16" y="178" font-size="10" fill="#da7101">chain/power</text>
  <text x="16" y="238" font-size="10" fill="#da7101">sign table</text>
  <text x="16" y="298" font-size="10" fill="#a12c7b">2nd deriv test</text>
</svg>