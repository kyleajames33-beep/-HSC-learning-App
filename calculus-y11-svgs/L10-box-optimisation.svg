<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">BOX OPTIMISATION SETUP — L10</text>
  <!-- Net of cardboard (flat cross shape) -->
  <!-- Main centre panel -->
  <rect x="150" y="80" width="160" height="120" fill="#dcedf7" stroke="#006494" stroke-width="1.5" stroke-dasharray="none"/>
  <!-- Top flap -->
  <rect x="150" y="44" width="160" height="36" fill="#cedcd8" stroke="#006494" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Bottom flap -->
  <rect x="150" y="200" width="160" height="36" fill="#cedcd8" stroke="#006494" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Left flap -->
  <rect x="114" y="80" width="36" height="120" fill="#cedcd8" stroke="#006494" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Right flap -->
  <rect x="310" y="80" width="36" height="120" fill="#cedcd8" stroke="#006494" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Cut corners (grey squares) -->
  <rect x="114" y="44" width="36" height="36" fill="#dcd9d5" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="132" y="66" font-size="9" fill="#7a7974" text-anchor="middle">cut</text>
  <rect x="310" y="44" width="36" height="36" fill="#dcd9d5" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="328" y="66" font-size="9" fill="#7a7974" text-anchor="middle">cut</text>
  <rect x="114" y="200" width="36" height="36" fill="#dcd9d5" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="132" y="222" font-size="9" fill="#7a7974" text-anchor="middle">cut</text>
  <rect x="310" y="200" width="36" height="36" fill="#dcd9d5" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="328" y="222" font-size="9" fill="#7a7974" text-anchor="middle">cut</text>
  <!-- x labels on cut corners -->
  <text x="132" y="52" font-size="10" fill="#da7101" font-weight="700" text-anchor="middle">x</text>
  <text x="328" y="52" font-size="10" fill="#da7101" font-weight="700" text-anchor="middle">x</text>
  <text x="120" y="96" font-size="10" fill="#da7101" font-weight="700" text-anchor="middle">x</text>
  <text x="320" y="96" font-size="10" fill="#da7101" font-weight="700" text-anchor="middle">x</text>
  <!-- Dimension labels -->
  <text x="230" y="144" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">base</text>
  <text x="230" y="158" font-size="10" fill="#006494" text-anchor="middle">(L−2x) × (W−2x)</text>
  <text x="132" y="144" font-size="10" fill="#01696f" font-weight="700" text-anchor="middle" transform="rotate(-90 132 144)">height = x</text>
  <!-- Formulas -->
  <rect x="30" y="250" width="460" height="36" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="267" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">V(x) = x(L−2x)(W−2x)</text>
  <text x="260" y="281" font-size="11" fill="#7a7974" text-anchor="middle">Maximise V: find V′(x) = 0 with constraint 0 &lt; x &lt; min(L,W)/2</text>
</svg>