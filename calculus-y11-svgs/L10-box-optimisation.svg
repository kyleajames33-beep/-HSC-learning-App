<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">BOX OPTIMISATION SETUP — L10</text>
  <!-- Cardboard net (cross shape) -->
  <!-- Centre square -->
  <rect x="160" y="80" width="120" height="120" fill="#dcedf7" stroke="#006494" stroke-width="2"/>
  <!-- Top flap -->
  <rect x="160" y="36" width="120" height="44" fill="#fff0dc" stroke="#da7101" stroke-width="1.5" stroke-dasharray="none"/>
  <!-- Bottom flap -->
  <rect x="160" y="200" width="120" height="44" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <!-- Left flap -->
  <rect x="116" y="80" width="44" height="120" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <!-- Right flap -->
  <rect x="280" y="80" width="44" height="120" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <!-- Cut corners (grey squares) -->
  <rect x="116" y="36" width="44" height="44" fill="#ebe9e4" stroke="#bab9b4" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="280" y="36" width="44" height="44" fill="#ebe9e4" stroke="#bab9b4" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="116" y="200" width="44" height="44" fill="#ebe9e4" stroke="#bab9b4" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="280" y="200" width="44" height="44" fill="#ebe9e4" stroke="#bab9b4" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- x labels -->
  <text x="138" y="58" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">x</text>
  <text x="302" y="58" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">x</text>
  <text x="138" y="224" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">x</text>
  <text x="302" y="224" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">x</text>
  <!-- Side labels -->
  <text x="220" y="18" font-size="11" fill="#006494" text-anchor="middle">width − 2x</text>
  <text x="78" y="142" font-size="11" fill="#006494" text-anchor="middle" transform="rotate(-90 78 142)">length − 2x</text>
  <!-- Fold arrows -->
  <text x="220" y="154" font-size="11" fill="#006494" text-anchor="middle" font-weight="700">base</text>
  <!-- Formula -->
  <rect x="360" y="80" width="148" height="100" rx="8" fill="#fff" stroke="#437a22" stroke-width="2"/>
  <text x="434" y="100" font-size="11" fill="#437a22" font-weight="700" text-anchor="middle">Volume:</text>
  <text x="434" y="118" font-size="12" fill="#28251d" text-anchor="middle">V = x(L−2x)(W−2x)</text>
  <text x="434" y="138" font-size="11" fill="#7a7974" text-anchor="middle">Maximise V:</text>
  <text x="434" y="156" font-size="12" fill="#437a22" text-anchor="middle" font-weight="700">dV/dx = 0</text>
  <text x="434" y="172" font-size="10" fill="#7a7974" text-anchor="middle">check d²V/dx² &lt; 0</text>
  <!-- Bottom note -->
  <text x="260" y="268" font-size="11" fill="#7a7974" text-anchor="middle">Corners of size x are cut and folded up to form the box</text>
  <text x="260" y="284" font-size="11" fill="#7a7974" text-anchor="middle">Constraint: x &gt; 0 and 2x &lt; shortest side</text>
</svg>