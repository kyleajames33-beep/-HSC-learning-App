<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="360" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">SECANT vs TANGENT — L01</text>
  <!-- Axes -->
  <line x1="40" y1="290" x2="480" y2="290" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="60" y1="30" x2="60" y2="310" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="482" y="294" font-size="11" fill="#7a7974" font-style="italic">x</text>
  <text x="64" y="28" font-size="11" fill="#7a7974" font-style="italic">y</text>
  <!-- Curve: parabola-like, y = -(x-260)^2/800 + 220 mapped -->
  <path d="M 70,280 C 130,180 200,100 260,80 C 320,60 390,100 460,220" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Points P and Q on curve -->
  <!-- P at x=180, curve ~y=148 -->
  <!-- Q at x=360, curve ~y=100 -->
  <!-- Secant line through P and Q -->
  <line x1="120" y1="220" x2="420" y2="132" stroke="#da7101" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tangent at P (steeper, touching only) -->
  <line x1="100" y1="260" x2="300" y2="100" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Points -->
  <circle cx="180" cy="148" r="6" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="360" cy="108" r="6" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="180" cy="148" r="4" fill="#006494" stroke="#f7f6f2" stroke-width="1"/>
  <!-- Labels -->
  <text x="170" y="140" font-size="13" fill="#da7101" font-weight="700">P</text>
  <text x="366" y="100" font-size="13" fill="#da7101" font-weight="700">Q</text>
  <!-- Delta x arrow -->
  <line x1="180" y1="300" x2="360" y2="300" stroke="#da7101" stroke-width="1.5" marker-end="url(#arr1)" marker-start="url(#arr1)"/>
  <defs><marker id="arr1" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#da7101" stroke-width="1.2"/></marker></defs>
  <text x="270" y="316" font-size="11" fill="#da7101" text-anchor="middle">Δx</text>
  <!-- Delta y -->
  <line x1="370" y1="148" x2="370" y2="108" stroke="#da7101" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="380" y="132" font-size="11" fill="#da7101">Δy</text>
  <!-- Vertical drop from P -->
  <line x1="180" y1="148" x2="180" y2="300" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="108" x2="360" y2="300" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Legend -->
  <rect x="310" y="230" width="190" height="70" rx="8" fill="#fff" stroke="#d4d1ca" stroke-width="1"/>
  <line x1="322" y1="249" x2="354" y2="249" stroke="#da7101" stroke-width="2.5"/>
  <text x="360" y="253" font-size="12" fill="#28251d">Secant — avg rate</text>
  <text x="360" y="268" font-size="11" fill="#7a7974">Δy/Δx between P &amp; Q</text>
  <line x1="322" y1="283" x2="354" y2="283" stroke="#006494" stroke-width="2.5"/>
  <text x="360" y="287" font-size="12" fill="#28251d">Tangent — instant rate</text>
  <!-- Title footer -->
  <text x="260" y="344" font-size="11" fill="#7a7974" text-anchor="middle">As Q → P, secant gradient → tangent gradient</text>
</svg>