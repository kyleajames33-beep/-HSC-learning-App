<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="340" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">SECANT vs TANGENT — L01</text>
  <!-- Axes -->
  <line x1="40" y1="270" x2="490" y2="270" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="60" y1="30" x2="60" y2="285" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="274" font-size="11" fill="#7a7974" font-style="italic">x</text>
  <text x="64" y="28" font-size="11" fill="#7a7974" font-style="italic">y</text>
  <!-- Curve: parabola y = 0.008(x-60)^2 + 40, mapped -->
  <path d="M 70,260 C 120,180 180,100 240,72 C 300,44 380,60 460,130" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Secant line through P(150,138) and Q(380,100) -->
  <line x1="80" y1="165" x2="460" y2="88" stroke="#da7101" stroke-width="2" stroke-linecap="round"/>
  <!-- Points P and Q -->
  <circle cx="170" cy="118" r="6" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="360" cy="94" r="6" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <text x="155" y="112" font-size="13" fill="#da7101" font-weight="700">P</text>
  <text x="366" y="88" font-size="13" fill="#da7101" font-weight="700">Q</text>
  <!-- Secant label -->
  <text x="82" y="152" font-size="12" fill="#da7101" font-weight="700">Secant</text>
  <text x="82" y="167" font-size="11" fill="#da7101">(cuts curve at 2 pts)</text>
  <!-- Tangent line at P(240,72) -->
  <line x1="130" y1="108" x2="360" y2="36" stroke="#a12c7b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="240" cy="72" r="6" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="246" y="68" font-size="13" fill="#a12c7b" font-weight="700">P</text>
  <!-- Tangent label -->
  <text x="340" y="32" font-size="12" fill="#a12c7b" font-weight="700">Tangent</text>
  <text x="340" y="47" font-size="11" fill="#a12c7b">(touches at 1 pt)</text>
  <!-- Gradient labels -->
  <rect x="30" y="290" width="220" height="36" rx="7" fill="#fff0dc" stroke="#da7101" stroke-width="1"/>
  <text x="140" y="308" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">Secant gradient = Δy / Δx</text>
  <text x="140" y="320" font-size="11" fill="#da7101" text-anchor="middle">average rate of change</text>
  <rect x="270" y="290" width="230" height="36" rx="7" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1"/>
  <text x="385" y="308" font-size="12" fill="#a12c7b" font-weight="700" text-anchor="middle">Tangent gradient = f′(x)</text>
  <text x="385" y="320" font-size="11" fill="#a12c7b" text-anchor="middle">instantaneous rate of change</text>
</svg>