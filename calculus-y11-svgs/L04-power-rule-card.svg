<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">POWER RULE CARD — L04</text>
  <!-- Main rule -->
  <rect x="80" y="38" width="360" height="52" rx="10" fill="#006494"/>
  <text x="260" y="62" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">d/dx [ xⁿ ] = n·xⁿ⁻¹</text>
  <text x="260" y="80" font-size="11" fill="#c8e4f5" text-anchor="middle">multiply by power, reduce power by 1</text>
  <!-- Examples table -->
  <!-- Headers -->
  <rect x="30" y="102" width="460" height="28" rx="6" fill="#dcd9d5"/>
  <text x="150" y="121" font-size="11" font-weight="700" fill="#28251d" text-anchor="middle">f(x)</text>
  <text x="260" y="121" font-size="11" font-weight="700" fill="#28251d" text-anchor="middle">apply rule</text>
  <text x="390" y="121" font-size="11" font-weight="700" fill="#28251d" text-anchor="middle">f′(x)</text>
  <!-- Row 1 -->
  <rect x="30" y="130" width="460" height="32" rx="0" fill="#fff"/>
  <text x="150" y="151" font-size="14" fill="#28251d" text-anchor="middle">x²</text>
  <text x="260" y="151" font-size="12" fill="#7a7974" text-anchor="middle">n=2 → 2·x²⁻¹</text>
  <text x="390" y="151" font-size="14" fill="#006494" font-weight="700" text-anchor="middle">2x</text>
  <!-- Row 2 -->
  <rect x="30" y="162" width="460" height="32" rx="0" fill="#f7f6f2"/>
  <text x="150" y="183" font-size="14" fill="#28251d" text-anchor="middle">x³</text>
  <text x="260" y="183" font-size="12" fill="#7a7974" text-anchor="middle">n=3 → 3·x³⁻¹</text>
  <text x="390" y="183" font-size="14" fill="#006494" font-weight="700" text-anchor="middle">3x²</text>
  <!-- Row 3 -->
  <rect x="30" y="194" width="460" height="32" rx="0" fill="#fff"/>
  <text x="150" y="215" font-size="14" fill="#28251d" text-anchor="middle">x⁻¹</text>
  <text x="260" y="215" font-size="12" fill="#7a7974" text-anchor="middle">n=−1 → −1·x⁻²</text>
  <text x="390" y="215" font-size="14" fill="#006494" font-weight="700" text-anchor="middle">−x⁻²</text>
  <!-- Row 4 -->
  <rect x="30" y="226" width="460" height="32" rx="0" fill="#f7f6f2"/>
  <text x="150" y="247" font-size="14" fill="#28251d" text-anchor="middle">√x = x^(1/2)</text>
  <text x="260" y="247" font-size="12" fill="#7a7974" text-anchor="middle">n=½ → ½·x⁻¹/²</text>
  <text x="390" y="247" font-size="14" fill="#006494" font-weight="700" text-anchor="middle">1/(2√x)</text>
  <!-- Row 5 -->
  <rect x="30" y="258" width="460" height="32" rx="0" fill="#fff"/>
  <text x="150" y="279" font-size="14" fill="#28251d" text-anchor="middle">c (constant)</text>
  <text x="260" y="279" font-size="12" fill="#7a7974" text-anchor="middle">n=0 → 0·x⁻¹</text>
  <text x="390" y="279" font-size="14" fill="#006494" font-weight="700" text-anchor="middle">0</text>
  <line x1="30" y1="130" x2="490" y2="130" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="30" y1="162" x2="490" y2="162" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="30" y1="194" x2="490" y2="194" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="30" y1="226" x2="490" y2="226" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="30" y1="258" x2="490" y2="258" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="30" y1="290" x2="490" y2="290" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="210" y1="102" x2="210" y2="290" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="320" y1="102" x2="320" y2="290" stroke="#dcd9d5" stroke-width="1"/>
  <!-- Reminder -->
  <rect x="30" y="296" width="460" height="18" rx="0" fill="none"/>
  <text x="260" y="310" font-size="11" fill="#7a7974" text-anchor="middle">Works for any real n — including fractions and negatives</text>
</svg>