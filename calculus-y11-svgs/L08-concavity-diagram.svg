<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="280" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">CONCAVITY — L08</text>
  <!-- Left panel: concave up -->
  <rect x="20" y="40" width="226" height="200" rx="10" fill="#fff" stroke="#437a22" stroke-width="2"/>
  <text x="133" y="62" font-size="13" font-weight="700" fill="#437a22" text-anchor="middle">Concave Up ☺</text>
  <text x="133" y="78" font-size="11" fill="#7a7974" text-anchor="middle">f″(x) &gt; 0</text>
  <!-- Cup shape -->
  <path d="M 40,190 C 80,140 120,120 133,118 C 146,120 186,140 226,190" fill="none" stroke="#437a22" stroke-width="3" stroke-linecap="round"/>
  <!-- Tangent lines getting steeper (showing gradient increasing) -->
  <line x1="50" y1="200" x2="82" y2="156" stroke="#437a22" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="107" y1="134" x2="133" y2="118" stroke="#437a22" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="160" y1="126" x2="200" y2="158" stroke="#437a22" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- Labels -->
  <text x="133" y="212" font-size="11" fill="#437a22" text-anchor="middle">curve bends upward</text>
  <text x="133" y="226" font-size="11" fill="#7a7974" text-anchor="middle">f’ is increasing</text>
  <!-- Right panel: concave down -->
  <rect x="274" y="40" width="226" height="200" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="387" y="62" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Concave Down ☹</text>
  <text x="387" y="78" font-size="11" fill="#7a7974" text-anchor="middle">f″(x) &lt; 0</text>
  <!-- Cap shape -->
  <path d="M 294,160 C 334,110 360,88 387,86 C 414,88 440,110 480,160" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <line x1="294" y1="150" x2="330" y2="110" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="360" y1="90" x2="387" y2="86" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="415" y1="92" x2="460" y2="144" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="387" y="182" font-size="11" fill="#c0392b" text-anchor="middle">curve bends downward</text>
  <text x="387" y="196" font-size="11" fill="#7a7974" text-anchor="middle">f’ is decreasing</text>
  <!-- Inflection note -->
  <rect x="140" y="252" width="240" height="22" rx="6" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="260" y="267" font-size="11" fill="#0c4e54" text-anchor="middle" font-weight="600">Point of inflection: f″(x) = 0 &amp; concavity changes</text>
</svg>