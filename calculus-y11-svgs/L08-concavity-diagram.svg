<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="280" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">CONCAVITY — L08</text>
  <!-- Left panel: concave up -->
  <rect x="20" y="40" width="225" height="190" rx="10" fill="#fff" stroke="#437a22" stroke-width="2"/>
  <text x="132" y="60" font-size="12" font-weight="700" fill="#437a22" text-anchor="middle">Concave UP</text>
  <!-- Axes -->
  <line x1="40" y1="185" x2="225" y2="185" stroke="#bab9b4" stroke-width="1"/>
  <line x1="60" y1="65" x2="60" y2="190" stroke="#bab9b4" stroke-width="1"/>
  <!-- Concave up parabola -->
  <path d="M 45,175 C 80,160 110,90 132,72 C 154,90 184,160 219,175" fill="none" stroke="#437a22" stroke-width="3" stroke-linecap="round"/>
  <!-- Tangent lines (rotating anticlockwise = slopes increasing) -->
  <line x1="50" y1="182" x2="100" y2="155" stroke="#da7101" stroke-width="1.5" opacity="0.5"/>
  <line x1="108" y1="110" x2="158" y2="110" stroke="#da7101" stroke-width="1.5" opacity="0.8"/>
  <line x1="164" y1="155" x2="214" y2="182" stroke="#da7101" stroke-width="1.5" opacity="0.5"/>
  <!-- f''label -->
  <rect x="50" y="196" width="165" height="26" rx="7" fill="#e8f5e9" stroke="#437a22" stroke-width="1"/>
  <text x="132" y="213" font-size="12" fill="#437a22" font-weight="700" text-anchor="middle">f″(x) &gt; 0 — “smiley” ☺</text>
  <!-- Right panel: concave down -->
  <rect x="275" y="40" width="225" height="190" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="387" y="60" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Concave DOWN</text>
  <!-- Axes -->
  <line x1="295" y1="145" x2="480" y2="145" stroke="#bab9b4" stroke-width="1"/>
  <line x1="315" y1="65" x2="315" y2="150" stroke="#bab9b4" stroke-width="1"/>
  <!-- Concave down arc -->
  <path d="M 300,135 C 335,130 355,80 387,68 C 419,80 439,130 474,135" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <!-- Tangent lines -->
  <line x1="305" y1="118" x2="355" y2="110" stroke="#da7101" stroke-width="1.5" opacity="0.5"/>
  <line x1="363" y1="68" x2="413" y2="68" stroke="#da7101" stroke-width="1.5" opacity="0.8"/>
  <line x1="419" y1="110" x2="469" y2="118" stroke="#da7101" stroke-width="1.5" opacity="0.5"/>
  <!-- f'' label -->
  <rect x="305" y="157" width="165" height="26" rx="7" fill="#fde8e8" stroke="#c0392b" stroke-width="1"/>
  <text x="387" y="174" font-size="12" fill="#c0392b" font-weight="700" text-anchor="middle">f″(x) &lt; 0 — “frowny” ☹</text>
  <!-- Inflection note -->
  <rect x="80" y="242" width="360" height="28" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="256" font-size="11" fill="#28251d" text-anchor="middle">Point of inflection: f″(x) = 0 <tspan font-weight="700">AND</tspan> concavity changes</text>
  <text x="260" y="268" font-size="10" fill="#7a7974" text-anchor="middle">(f″=0 alone is not sufficient)</text>
</svg>