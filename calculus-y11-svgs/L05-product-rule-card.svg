<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="310" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">PRODUCT &amp; QUOTIENT RULES — L05</text>
  <!-- Product rule -->
  <rect x="20" y="38" width="232" height="120" rx="10" fill="#fff" stroke="#da7101" stroke-width="2"/>
  <text x="136" y="58" font-size="12" font-weight="700" fill="#da7101" text-anchor="middle">Product Rule</text>
  <rect x="30" y="64" width="212" height="28" rx="6" fill="#fff0dc"/>
  <text x="136" y="82" font-size="14" fill="#28251d" text-anchor="middle" font-weight="700">(uv)’ = u’v + uv’</text>
  <text x="136" y="106" font-size="11" fill="#7a7974" text-anchor="middle">u = first factor</text>
  <text x="136" y="120" font-size="11" fill="#7a7974" text-anchor="middle">v = second factor</text>
  <text x="136" y="134" font-size="10" fill="#7a7974" text-anchor="middle">“d(first)·second + first·d(second)”</text>
  <!-- Product example -->
  <rect x="20" y="168" width="232" height="110" rx="10" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="136" y="186" font-size="11" fill="#7a7974" text-anchor="middle" font-weight="600">Example: y = x²·sin x</text>
  <text x="136" y="204" font-size="11" fill="#28251d" text-anchor="middle">u = x², u’ = 2x</text>
  <text x="136" y="220" font-size="11" fill="#28251d" text-anchor="middle">v = sin x, v’ = cos x</text>
  <text x="136" y="240" font-size="12" fill="#da7101" font-weight="700" text-anchor="middle">y’ = 2x·sin x + x²·cos x</text>
  <text x="136" y="270" font-size="10" fill="#7a7974" text-anchor="middle">(Year 12 example for preview)</text>
  <!-- Quotient rule -->
  <rect x="268" y="38" width="232" height="120" rx="10" fill="#fff" stroke="#006494" stroke-width="2"/>
  <text x="384" y="58" font-size="12" font-weight="700" fill="#006494" text-anchor="middle">Quotient Rule</text>
  <rect x="278" y="64" width="212" height="28" rx="6" fill="#dcedf7"/>
  <text x="384" y="82" font-size="14" fill="#28251d" text-anchor="middle" font-weight="700">(u/v)’ = (u’v − uv’) / v²</text>
  <text x="384" y="106" font-size="11" fill="#7a7974" text-anchor="middle">u = numerator</text>
  <text x="384" y="120" font-size="11" fill="#7a7974" text-anchor="middle">v = denominator</text>
  <text x="384" y="134" font-size="10" fill="#7a7974" text-anchor="middle">Note: minus sign — order matters!</text>
  <!-- Quotient example -->
  <rect x="268" y="168" width="232" height="110" rx="10" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="384" y="186" font-size="11" fill="#7a7974" text-anchor="middle" font-weight="600">Example: y = x² / (x+1)</text>
  <text x="384" y="204" font-size="11" fill="#28251d" text-anchor="middle">u = x², u’ = 2x</text>
  <text x="384" y="220" font-size="11" fill="#28251d" text-anchor="middle">v = x+1, v’ = 1</text>
  <text x="384" y="240" font-size="12" fill="#006494" font-weight="700" text-anchor="middle">y’ = (2x(x+1) − x²) / (x+1)²</text>
  <text x="384" y="256" font-size="12" fill="#006494" font-weight="700" text-anchor="middle">= (x²+2x) / (x+1)²</text>
</svg>