<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">PRODUCT &amp; QUOTIENT RULES — L05</text>
  <!-- Product rule -->
  <rect x="20" y="38" width="232" height="116" rx="10" fill="#fff" stroke="#437a22" stroke-width="2"/>
  <text x="136" y="56" font-size="11" font-weight="700" fill="#437a22" text-anchor="middle" letter-spacing="0.06em">PRODUCT RULE</text>
  <rect x="32" y="62" width="208" height="32" rx="7" fill="#437a22"/>
  <text x="136" y="83" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">(uv)′ = u′v + uv′</text>
  <text x="136" y="112" font-size="11" fill="#28251d" text-anchor="middle">u = first function</text>
  <text x="136" y="128" font-size="11" fill="#28251d" text-anchor="middle">v = second function</text>
  <text x="136" y="144" font-size="10" fill="#7a7974" text-anchor="middle">"first·d(second) + second·d(first)"</text>
  <!-- Quotient rule -->
  <rect x="268" y="38" width="232" height="116" rx="10" fill="#fff" stroke="#a12c7b" stroke-width="2"/>
  <text x="384" y="56" font-size="11" font-weight="700" fill="#a12c7b" text-anchor="middle" letter-spacing="0.06em">QUOTIENT RULE</text>
  <rect x="280" y="62" width="208" height="32" rx="7" fill="#a12c7b"/>
  <text x="384" y="83" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">(u/v)′ = (u′v − uv′) / v²</text>
  <text x="384" y="112" font-size="11" fill="#28251d" text-anchor="middle">u = numerator</text>
  <text x="384" y="128" font-size="11" fill="#28251d" text-anchor="middle">v = denominator</text>
  <text x="384" y="144" font-size="10" fill="#7a7974" text-anchor="middle">"lo·d(hi) − hi·d(lo) over lo²"</text>
  <!-- Example product -->
  <rect x="20" y="166" width="232" height="100" rx="9" fill="#e8f5e9" stroke="#437a22" stroke-width="1"/>
  <text x="136" y="182" font-size="11" font-weight="700" fill="#437a22" text-anchor="middle">Example</text>
  <text x="136" y="200" font-size="12" fill="#28251d" text-anchor="middle">y = x²·sin x</text>
  <text x="136" y="218" font-size="11" fill="#28251d" text-anchor="middle">u=x², u′=2x</text>
  <text x="136" y="234" font-size="11" fill="#28251d" text-anchor="middle">v=sin x, v′=cos x</text>
  <text x="136" y="254" font-size="12" fill="#437a22" font-weight="700" text-anchor="middle">y′ = 2x·sin x + x²·cos x</text>
  <!-- Example quotient -->
  <rect x="268" y="166" width="232" height="100" rx="9" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1"/>
  <text x="384" y="182" font-size="11" font-weight="700" fill="#a12c7b" text-anchor="middle">Example</text>
  <text x="384" y="200" font-size="12" fill="#28251d" text-anchor="middle">y = x² / (x+1)</text>
  <text x="384" y="218" font-size="11" fill="#28251d" text-anchor="middle">u=x², u′=2x</text>
  <text x="384" y="234" font-size="11" fill="#28251d" text-anchor="middle">v=x+1, v′=1</text>
  <text x="384" y="254" font-size="12" fill="#a12c7b" font-weight="700" text-anchor="middle">y′ = (2x(x+1)−x²)/(x+1)²</text>
</svg>