<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">FIRST PRINCIPLES FORMULA — L03</text>
  <!-- Main formula -->
  <rect x="40" y="40" width="440" height="64" rx="12" fill="#28251d"/>
  <text x="260" y="80" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">f’(x) = lim  [f(x+h) − f(x)] / h</text>
  <text x="310" y="94" font-size="11" fill="#bab9b4" text-anchor="middle">h → 0</text>
  <!-- Annotation: f'(x) -->
  <line x1="90" y1="104" x2="90" y2="130" stroke="#a12c7b" stroke-width="1.5" marker-end="url(#fa)"/>
  <defs><marker id="fa" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#a12c7b"/></marker></defs>
  <rect x="30" y="130" width="130" height="34" rx="7" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1.5"/>
  <text x="95" y="151" font-size="11" fill="#a12c7b" font-weight="700" text-anchor="middle">derivative of f</text>
  <!-- f(x+h) -->
  <line x1="280" y1="104" x2="248" y2="130" stroke="#da7101" stroke-width="1.5" marker-end="url(#fb)"/>
  <defs><marker id="fb" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#da7101"/></marker></defs>
  <rect x="155" y="130" width="140" height="34" rx="7" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <text x="225" y="151" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">f at x shifted by h</text>
  <!-- f(x) -->
  <line x1="350" y1="104" x2="350" y2="130" stroke="#01696f" stroke-width="1.5" marker-end="url(#fc)"/>
  <defs><marker id="fc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#01696f"/></marker></defs>
  <rect x="305" y="130" width="94" height="34" rx="7" fill="#e8f5ef" stroke="#01696f" stroke-width="1.5"/>
  <text x="352" y="151" font-size="11" fill="#01696f" font-weight="700" text-anchor="middle">f at x</text>
  <!-- h -->
  <line x1="430" y1="104" x2="430" y2="130" stroke="#006494" stroke-width="1.5" marker-end="url(#fd)"/>
  <defs><marker id="fd" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#006494"/></marker></defs>
  <rect x="385" y="130" width="100" height="34" rx="7" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="435" y="151" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">tiny step</text>
  <!-- Steps -->
  <rect x="40" y="184" width="440" height="90" rx="10" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="202" font-size="11" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.06em">HOW TO USE IT</text>
  <line x1="50" y1="208" x2="470" y2="208" stroke="#dcd9d5" stroke-width="1"/>
  <text x="55" y="224" font-size="12" fill="#28251d">1. Write out f(x+h) by substituting (x+h) for x</text>
  <text x="55" y="242" font-size="12" fill="#28251d">2. Subtract f(x), then divide everything by h</text>
  <text x="55" y="260" font-size="12" fill="#28251d">3. Simplify and cancel h, then let h → 0</text>
</svg>