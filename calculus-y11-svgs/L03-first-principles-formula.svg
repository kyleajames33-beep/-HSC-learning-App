<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">FIRST PRINCIPLES FORMULA — L03</text>
  <!-- Main formula box -->
  <rect x="30" y="40" width="460" height="60" rx="10" fill="#fff" stroke="#da7101" stroke-width="2"/>
  <text x="260" y="78" font-size="20" font-weight="700" fill="#28251d" text-anchor="middle">f′(x) = lim [f(x+h) − f(x)] / h</text>
  <text x="198" y="90" font-size="11" fill="#7a7974" text-anchor="middle">h→0</text>
  <!-- Annotation: f'(x) -->
  <line x1="75" y1="100" x2="75" y2="132" stroke="#a12c7b" stroke-width="1.5" marker-end="url(#fp)"/>
  <defs><marker id="fp" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#a12c7b"/></marker></defs>
  <rect x="20" y="132" width="116" height="32" rx="7" fill="#f9e8f4" stroke="#a12c7b" stroke-width="1"/>
  <text x="78" y="152" font-size="11" fill="#6b1040" font-weight="600" text-anchor="middle">the derivative</text>
  <!-- Annotation: f(x+h) -->
  <line x1="230" y1="100" x2="215" y2="132" stroke="#01696f" stroke-width="1.5" marker-end="url(#fp2)"/>
  <defs><marker id="fp2" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#01696f"/></marker></defs>
  <rect x="144" y="132" width="148" height="32" rx="7" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="218" y="152" font-size="11" fill="#0c4e54" font-weight="600" text-anchor="middle">f at x shifted by h</text>
  <!-- Annotation: f(x) -->
  <line x1="308" y1="100" x2="320" y2="132" stroke="#006494" stroke-width="1.5" marker-end="url(#fp3)"/>
  <defs><marker id="fp3" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#006494"/></marker></defs>
  <rect x="298" y="132" width="116" height="32" rx="7" fill="#dcedf7" stroke="#006494" stroke-width="1"/>
  <text x="356" y="152" font-size="11" fill="#003d5c" font-weight="600" text-anchor="middle">original function</text>
  <!-- Annotation: h -->
  <line x1="420" y1="100" x2="430" y2="132" stroke="#da7101" stroke-width="1.5" marker-end="url(#fp4)"/>
  <defs><marker id="fp4" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#da7101"/></marker></defs>
  <rect x="422" y="132" width="78" height="32" rx="7" fill="#fff0dc" stroke="#da7101" stroke-width="1"/>
  <text x="461" y="152" font-size="11" fill="#7a4400" font-weight="600" text-anchor="middle">step size</text>
  <!-- Step process -->
  <rect x="30" y="182" width="460" height="96" rx="10" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="200" font-size="11" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.06em">STEPS</text>
  <text x="46" y="218" font-size="12" fill="#28251d"><tspan fill="#da7101" font-weight="700">1.</tspan> Write f(x+h) by substituting (x+h) for x</text>
  <text x="46" y="236" font-size="12" fill="#28251d"><tspan fill="#da7101" font-weight="700">2.</tspan> Form f(x+h) − f(x) and expand</text>
  <text x="46" y="254" font-size="12" fill="#28251d"><tspan fill="#da7101" font-weight="700">3.</tspan> Divide by h and cancel</text>
  <text x="46" y="272" font-size="12" fill="#28251d"><tspan fill="#da7101" font-weight="700">4.</tspan> Let h → 0 to get f′(x)</text>
</svg>