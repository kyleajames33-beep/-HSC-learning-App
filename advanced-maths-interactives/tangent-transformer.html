<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tangent Transformer — L11</title>
<style>
  :root {
    --teal:#01696f;--orange:#da7101;--blue:#006494;
    --purple:#a12c7b;--green:#437a22;--bg:#f7f6f2;
    --card:#ffffff;--border:#dcd9d5;--text:#28251d;--muted:#7a7974;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;}
  h1{font-size:1.2rem;font-weight:700;color:var(--green);margin-bottom:4px;}
  .subtitle{font-size:0.85rem;color:var(--muted);margin-bottom:20px;}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:16px;max-width:960px;margin:0 auto;}
  @media(max-width:660px){.layout{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .card h2{font-size:0.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:14px;}
  canvas{display:block;width:100%;border-radius:8px;}
  .slider-wrap{margin:10px 0;}
  .slider-wrap label{display:flex;justify-content:space-between;font-size:0.82rem;font-weight:600;color:var(--text);margin-bottom:4px;}
  .slider-wrap label span{font-weight:700;color:var(--teal);}
  input[type=range]{width:100%;accent-color:var(--teal);}
  .info-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .info-box{background:var(--bg);border-radius:8px;padding:10px 12px;}
  .info-box .label{font-size:0.75rem;color:var(--muted);margin-bottom:2px;}
  .info-box .value{font-size:1rem;font-weight:700;}
  .rule-box{background:#e8f5e9;border-radius:8px;padding:12px;margin-top:14px;font-size:0.82rem;line-height:1.7;border-left:3px solid var(--green);}
  .rule-box strong{display:block;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--green);margin-bottom:4px;}
  .asymptote-list{margin-top:10px;font-size:0.82rem;color:var(--muted);line-height:1.8;}
  .asym-tag{display:inline-block;background:#fff0dc;color:var(--orange);border:1px solid var(--orange);border-radius:4px;padding:1px 6px;font-size:0.78rem;margin:1px;}
</style>
</head>
<body>
<div style="max-width:960px;margin:0 auto">
  <h1>Tangent Transformer</h1>
  <p class="subtitle">L11 — Explore y = a·tan(b(x − c)) + d and its asymptotes</p>
  <div class="layout">
    <div class="card">
      <h2>Graph</h2>
      <canvas id="graph" width="620" height="380"></canvas>
    </div>
    <div class="card">
      <h2>Parameters</h2>
      <div class="slider-wrap">
        <label>a (vertical stretch) <span id="aVal">1.0</span></label>
        <input type="range" id="a" min="-3" max="3" step="0.1" value="1">
      </div>
      <div class="slider-wrap">
        <label>b (period factor) <span id="bVal">1.0</span></label>
        <input type="range" id="b" min="0.2" max="4" step="0.1" value="1">
      </div>
      <div class="slider-wrap">
        <label>c (phase shift) <span id="cVal">0</span></label>
        <input type="range" id="c" min="-1.5" max="1.5" step="0.05" value="0">
      </div>
      <div class="slider-wrap">
        <label>d (vertical shift) <span id="dVal">0</span></label>
        <input type="range" id="d" min="-3" max="3" step="0.1" value="0">
      </div>
      <div class="info-row">
        <div class="info-box">
          <div class="label">Period</div>
          <div class="value" id="periodVal" style="color:var(--blue)">--</div>
        </div>
        <div class="info-box">
          <div class="label">Phase shift</div>
          <div class="value" id="phaseVal" style="color:var(--purple)">--</div>
        </div>
      </div>
      <div class="asymptote-list">
        <strong style="font-size:0.8rem;color:var(--orange)">Asymptotes (nearest):</strong><br>
        <span id="asymList"></span>
      </div>
      <div class="rule-box">
        <strong>Key Properties</strong>
        Period = π / b<br>
        Asymptotes where b(x−c) = π/2 + nπ<br>
        No amplitude — range is all reals<br>
        Phase shift = c/b when factored
      </div>
    </div>
  </div>
</div>
<script>
  const params = { a:1, b:1, c:0, d:0 };
  ['a','b','c','d'].forEach(p => {
    document.getElementById(p).addEventListener('input', e => {
      params[p] = +e.target.value;
      document.getElementById(p+'Val').textContent = params[p].toFixed(1);
      update();
    });
  });

  function update() {
    drawGraph();
    const period = Math.PI / params.b;
    document.getElementById('periodVal').textContent = (period/Math.PI).toFixed(2) + 'π';
    document.getElementById('phaseVal').textContent = (params.c).toFixed(2) + ' rad';
    // Asymptotes
    const asympList = [];
    for(let n=-2;n<=2;n++) {
      const xa = (Math.PI/2 + n*Math.PI)/params.b + params.c;
      asympList.push(xa);
    }
    document.getElementById('asymList').innerHTML = asympList.map(x =>
      `<span class="asym-tag">x≈${x.toFixed(2)}</span>`
    ).join(' ');
  }

  function drawGraph() {
    const cv = document.getElementById('graph');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#f7f6f2'; ctx.fillRect(0,0,W,H);

    const ox = W/2, oy = H/2;
    const scaleX = W/8, scaleY = H/8;
    const xMin = -W/(2*scaleX), xMax = W/(2*scaleX);

    // Grid lines
    ctx.strokeStyle='#ebe9e4'; ctx.lineWidth=1;
    for(let y=-4;y<=4;y++) {
      ctx.beginPath(); ctx.moveTo(0,oy+y*scaleY); ctx.lineTo(W,oy+y*scaleY); ctx.stroke();
    }
    for(let x=-4;x<=4;x++) {
      ctx.beginPath(); ctx.moveTo(ox+x*scaleX,0); ctx.lineTo(ox+x*scaleX,H); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle='#bab9b4'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(W,oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox,0); ctx.lineTo(ox,H); ctx.stroke();

    // Axis labels
    ctx.fillStyle='#7a7974'; ctx.font='11px Inter,sans-serif';
    ctx.fillText('0',ox+4,oy+14);
    for(let n=-2;n<=2;n++) {
      if(n===0) continue;
      ctx.fillText((n<0?'-':'')+(Math.abs(n)===1?'':''+Math.abs(n))+'π', ox+n*Math.PI*scaleX-8, oy+14);
    }

    // Asymptotes
    ctx.strokeStyle='#a12c7b'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
    const {a,b,c,d} = params;
    for(let n=-4;n<=4;n++) {
      const xa = (Math.PI/2 + n*Math.PI)/b + c;
      const px = ox + xa*scaleX;
      if(px>=0 && px<=W) {
        ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,H); ctx.stroke();
      }
    }
    ctx.setLineDash([]);

    // Tan curve, segment by segment
    ctx.strokeStyle='#437a22'; ctx.lineWidth=2.5;
    const step = 0.005;
    let drawing = false;
    ctx.beginPath();
    for(let xa=xMin;xa<=xMax;xa+=step) {
      const inner = b*(xa-c);
      // Check proximity to asymptote
      const nearAsym = Math.abs(Math.cos(inner)) < 0.05;
      const y = a*Math.tan(inner)+d;
      const px = ox+xa*scaleX, py = oy-y*scaleY;
      if(nearAsym || py<-20 || py>H+20) {
        drawing = false;
      } else {
        if(!drawing) { ctx.moveTo(px,py); drawing=true; }
        else ctx.lineTo(px,py);
      }
    }
    ctx.stroke();

    // Equation label
    ctx.fillStyle='#437a22'; ctx.font='bold 13px Inter,sans-serif';
    ctx.fillText(`y = ${a.toFixed(1)}·tan(${b.toFixed(1)}(x−${c.toFixed(2)})) + ${d.toFixed(1)}`, 10, 22);
  }

  update();
</script>
</body>
</html>
