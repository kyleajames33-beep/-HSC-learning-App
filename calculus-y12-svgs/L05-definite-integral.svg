<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">DEFINITE INTEGRAL &amp; AREA — L05</text>
  <!-- Axes -->
  <line x1="50" y1="220" x2="490" y2="220" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="80" y1="30" x2="80" y2="232" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="224" font-size="10" fill="#7a7974" font-style="italic">x</text>
  <text x="84" y="28" font-size="10" fill="#7a7974" font-style="italic">y</text>
  <!-- Shaded area -->
  <path d="M 160,220 C 185,200 210,160 240,125 C 265,97 290,82 320,80 C 340,79 360,88 380,104 L 380,220 Z" fill="#01696f" opacity="0.18"/>
  <!-- Curve -->
  <path d="M 80,218 C 110,210 140,195 160,180 C 185,160 210,130 240,102 C 265,78 290,62 320,58 C 345,55 370,66 395,90 C 420,114 445,145 470,170" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- a and b markers -->
  <line x1="160" y1="220" x2="160" y2="180" stroke="#da7101" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="380" y1="220" x2="380" y2="104" stroke="#da7101" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="160" y="234" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">a</text>
  <text x="380" y="234" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">b</text>
  <!-- Area label -->
  <text x="272" y="170" font-size="13" fill="#01696f" font-weight="700" text-anchor="middle">∫ᵃᵇ f(x) dx</text>
  <text x="272" y="186" font-size="10" fill="#01696f" text-anchor="middle">= shaded area</text>
  <!-- FTC box -->
  <rect x="14" y="248" width="492" height="42" rx="8" fill="#28251d"/>
  <text x="260" y="264" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">FUNDAMENTAL THEOREM OF CALCULUS</text>
  <text x="260" y="282" font-size="12" font-weight="700" fill="#da7101" text-anchor="middle">∫ᵃᵇ f(x) dx = F(b) − F(a)   where F′(x) = f(x)</text>
</svg>