<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">CHAIN RULE WITH TRIG &amp; EXP — L04</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a7974"/></marker></defs>
  <!-- Template -->
  <rect x="160" y="32" width="200" height="34" rx="17" fill="#28251d"/>
  <text x="260" y="54" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">d/dx[f(g(x))] = f′(g(x))·g′(x)</text>
  <!-- Example 1: sin(3x) -->
  <rect x="14" y="80" width="230" height="88" rx="8" fill="#fff" stroke="#01696f" stroke-width="1.5"/>
  <text x="129" y="98" font-size="11" font-weight="700" fill="#01696f" text-anchor="middle">y = sin(3x)</text>
  <text x="129" y="114" font-size="10" fill="#7a7974" text-anchor="middle">outer: sin → cos</text>
  <text x="129" y="128" font-size="10" fill="#7a7974" text-anchor="middle">inner: 3x → 3</text>
  <text x="129" y="146" font-size="12" font-weight="700" fill="#01696f" text-anchor="middle">y′ = 3cos(3x)</text>
  <!-- Example 2: e^(2x) -->
  <rect x="276" y="80" width="230" height="88" rx="8" fill="#fff" stroke="#da7101" stroke-width="1.5"/>
  <text x="391" y="98" font-size="11" font-weight="700" fill="#da7101" text-anchor="middle">y = e^(2x)</text>
  <text x="391" y="114" font-size="10" fill="#7a7974" text-anchor="middle">outer: e^u → e^u</text>
  <text x="391" y="128" font-size="10" fill="#7a7974" text-anchor="middle">inner: 2x → 2</text>
  <text x="391" y="146" font-size="12" font-weight="700" fill="#da7101" text-anchor="middle">y′ = 2e^(2x)</text>
  <!-- Example 3: ln(x²+1) -->
  <rect x="14" y="178" width="230" height="88" rx="8" fill="#fff" stroke="#006494" stroke-width="1.5"/>
  <text x="129" y="196" font-size="11" font-weight="700" fill="#006494" text-anchor="middle">y = ln(x² + 1)</text>
  <text x="129" y="212" font-size="10" fill="#7a7974" text-anchor="middle">outer: ln(u) → 1/u</text>
  <text x="129" y="226" font-size="10" fill="#7a7974" text-anchor="middle">inner: x²+1 → 2x</text>
  <text x="129" y="244" font-size="12" font-weight="700" fill="#006494" text-anchor="middle">y′ = 2x / (x²+1)</text>
  <!-- Example 4: cos²(x) -->
  <rect x="276" y="178" width="230" height="88" rx="8" fill="#fff" stroke="#a12c7b" stroke-width="1.5"/>
  <text x="391" y="196" font-size="11" font-weight="700" fill="#a12c7b" text-anchor="middle">y = cos²(x) = [cos x]²</text>
  <text x="391" y="212" font-size="10" fill="#7a7974" text-anchor="middle">outer: u² → 2u</text>
  <text x="391" y="226" font-size="10" fill="#7a7974" text-anchor="middle">inner: cos x → −sin x</text>
  <text x="391" y="244" font-size="12" font-weight="700" fill="#a12c7b" text-anchor="middle">y′ = −2cos x · sin x = −sin 2x</text>
  <!-- bottom bar -->
  <rect x="14" y="274" width="492" height="18" rx="8" fill="#437a22"/>
  <text x="260" y="287" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">Always identify OUTER and INNER functions before differentiating</text>
</svg>