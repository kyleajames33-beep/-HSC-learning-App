<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="280" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">GROWTH &amp; DECAY — WORKED STEPS — L09</text>
  <defs><marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a7974"/></marker></defs>
  <!-- Step 1 -->
  <rect x="14" y="34" width="492" height="38" rx="8" fill="#e8f5f5" stroke="#01696f" stroke-width="1.5"/>
  <text x="28" y="50" font-size="10" font-weight="700" fill="#01696f">STEP 1 — Write the model</text>
  <text x="28" y="64" font-size="11" fill="#28251d">N(t) = N₀ eᵏᵗ   •   identify N₀ (initial value) from the problem</text>
  <!-- Step 2 -->
  <rect x="14" y="80" width="492" height="38" rx="8" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <text x="28" y="96" font-size="10" font-weight="700" fill="#da7101">STEP 2 — Find k using a known data point</text>
  <text x="28" y="110" font-size="11" fill="#28251d">Substitute known (t, N) into model → solve for k using ln</text>
  <!-- Step 3 -->
  <rect x="14" y="126" width="492" height="38" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="28" y="142" font-size="10" font-weight="700" fill="#006494">STEP 3 — Answer the question</text>
  <text x="28" y="156" font-size="11" fill="#28251d">Sub t value in → find N;  OR set N value → solve for t using ln</text>
  <!-- Example -->
  <rect x="14" y="172" width="492" height="94" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="28" y="190" font-size="10" font-weight="700" fill="#7a7974">EXAMPLE — Bacteria doubles every 3 hours, starts at 500</text>
  <text x="28" y="208" font-size="10" fill="#28251d">① N(t) = 500 eᵏᵗ</text>
  <text x="28" y="224" font-size="10" fill="#28251d">② N(3) = 1000 → 1000 = 500 e³ᵏ → e³ᵏ = 2 → k = ln2/3 ≈ 0.231</text>
  <text x="28" y="240" font-size="10" fill="#28251d">③ N(t) = 500 e^(t·ln2/3)   →   after 9 h: N = 500 × 2³ = 4000</text>
  <text x="28" y="256" font-size="10" fill="#da7101" font-weight="700">When does N = 10000? → 10000 = 500 e^(t·ln2/3) → t = 3ln20/ln2 ≈ 12.9 h</text>
</svg>