<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">THE NATURAL BASE e — L02</text>
  <!-- Comparison of 2^x, e^x, 3^x -->
  <line x1="50" y1="220" x2="490" y2="220" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="180" y1="20" x2="180" y2="232" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="224" font-size="10" fill="#7a7974" font-style="italic">x</text>
  <!-- 2^x curve (gradient at x=0 < 1) -->
  <path d="M 70,218 C 100,214 130,205 160,190 C 170,184 176,178 180,173 C 196,152 210,128 230,106 C 250,84 270,66 300,50" fill="none" stroke="#bab9b4" stroke-width="2" stroke-linecap="round"/>
  <text x="304" y="48" font-size="10" fill="#bab9b4">2ˣ</text>
  <!-- eˣ curve (gradient at x=0 = 1) -->
  <path d="M 70,219 C 100,216 130,208 155,195 C 165,188 174,180 180,173 C 198,148 212,120 235,92 C 255,68 275,46 300,28" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <text x="304" y="26" font-size="11" fill="#01696f" font-weight="700">eˣ</text>
  <!-- 3^x curve -->
  <path d="M 70,219 C 100,217 130,212 155,200 C 166,193 175,184 180,173 C 200,138 218,100 240,68 C 258,42 276,28 296,16" fill="none" stroke="#006494" stroke-width="2" stroke-linecap="round"/>
  <text x="296" y="14" font-size="10" fill="#006494">3ˣ</text>
  <!-- Tangent at x=0 for eˣ (slope 1) -->
  <line x1="110" y1="233" x2="250" y2="103" stroke="#da7101" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="68" y="240" font-size="10" fill="#da7101">tangent slope = 1 at x=0 for eˣ</text>
  <!-- Point (0,1) -->
  <circle cx="180" cy="173" r="6" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="186" y="170" font-size="10" fill="#a12c7b" font-weight="700">(0,1)</text>
  <!-- e value box -->
  <rect x="30" y="248" width="460" height="40" rx="8" fill="#28251d"/>
  <text x="260" y="264" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">e = lim[n→∞] (1 + 1/n)ⁿ ≈ 2.71828…</text>
  <text x="260" y="280" font-size="10" fill="#bab9b4" text-anchor="middle">e is the unique base where the gradient of aˣ at x=0 equals exactly 1</text>
</svg>