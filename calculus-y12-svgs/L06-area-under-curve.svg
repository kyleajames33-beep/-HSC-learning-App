<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">AREA ABOVE &amp; BELOW x-AXIS — L06</text>
  <!-- Axes -->
  <line x1="40" y1="160" x2="490" y2="160" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="70" y1="20" x2="70" y2="270" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="164" font-size="10" fill="#7a7974" font-style="italic">x</text>
  <!-- Sine-like curve with above and below regions -->
  <!-- Above x-axis region (green) -->
  <path d="M 100,160 C 130,120 160,80 200,80 C 240,80 270,120 300,160 L 300,160 L 100,160 Z" fill="#437a22" opacity="0.2"/>
  <!-- Below x-axis region (red) -->
  <path d="M 300,160 C 330,200 360,240 400,240 C 440,240 470,200 490,160 L 490,160 L 300,160 Z" fill="#c0392b" opacity="0.2"/>
  <!-- Curve -->
  <path d="M 70,160 C 82,158 92,156 100,155 C 130,140 160,80 200,80 C 240,80 270,120 300,160 C 330,200 360,240 400,240 C 440,240 470,200 490,160" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Region labels -->
  <text x="200" y="128" font-size="11" fill="#437a22" font-weight="700" text-anchor="middle">A₁ (positive)</text>
  <text x="200" y="142" font-size="10" fill="#437a22" text-anchor="middle">∫ f(x)dx &gt; 0</text>
  <text x="395" y="196" font-size="11" fill="#c0392b" font-weight="700" text-anchor="middle">A₂ (negative)</text>
  <text x="395" y="210" font-size="10" fill="#c0392b" text-anchor="middle">∫ f(x)dx &lt; 0</text>
  <!-- a, b, c markers -->
  <text x="100" y="174" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">a</text>
  <text x="300" y="174" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">c</text>
  <text x="490" y="174" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">b</text>
  <line x1="100" y1="160" x2="100" y2="168" stroke="#da7101" stroke-width="1.5"/>
  <line x1="300" y1="160" x2="300" y2="168" stroke="#da7101" stroke-width="1.5"/>
  <!-- Warning box -->
  <rect x="14" y="252" width="492" height="36" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="260" y="268" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">⚠ Total area = |∫ᵃᶜ f dx| + |∫ᶜᵇ f dx|</text>
  <text x="260" y="282" font-size="10" fill="#7a7974" text-anchor="middle">Integrate separately and take absolute values when curve crosses x-axis</text>
</svg>