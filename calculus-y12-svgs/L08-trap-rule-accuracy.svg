<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="260" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">TRAPEZOIDAL RULE — ACCURACY &amp; ERROR — L08</text>
  <!-- Left: concave up = underestimate -->
  <rect x="14" y="34" width="236" height="140" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="132" y="52" font-size="10" font-weight="700" fill="#c0392b" text-anchor="middle">Concave up → UNDERESTIMATE</text>
  <line x1="28" y1="152" x2="236" y2="152" stroke="#bab9b4" stroke-width="1"/>
  <line x1="50" y1="68" x2="50" y2="156" stroke="#bab9b4" stroke-width="1"/>
  <!-- concave up curve -->
  <path d="M 50,152 C 80,148 115,138 155,118 C 185,102 210,82 228,62" fill="none" stroke="#01696f" stroke-width="2"/>
  <!-- trapezoid (chord is below curve) -->
  <polygon points="50,152 228,62 228,152" fill="#c0392b" opacity="0.15" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="50" y1="152" x2="228" y2="62" stroke="#c0392b" stroke-width="1.5"/>
  <text x="132" y="160" font-size="9" fill="#c0392b" text-anchor="middle">chord lies below curve</text>
  <!-- Right: concave down = overestimate -->
  <rect x="270" y="34" width="236" height="140" rx="8" fill="#fff" stroke="#437a22" stroke-width="1.5"/>
  <text x="388" y="52" font-size="10" font-weight="700" fill="#437a22" text-anchor="middle">Concave down → OVERESTIMATE</text>
  <line x1="284" y1="152" x2="492" y2="152" stroke="#bab9b4" stroke-width="1"/>
  <line x1="306" y1="68" x2="306" y2="156" stroke="#bab9b4" stroke-width="1"/>
  <!-- concave down curve -->
  <path d="M 306,152 C 336,100 365,72 400,62 C 430,54 458,56 484,68" fill="none" stroke="#01696f" stroke-width="2"/>
  <!-- trapezoid (chord is above curve) -->
  <polygon points="306,152 484,68 484,152" fill="#437a22" opacity="0.15" stroke="#437a22" stroke-width="1.5"/>
  <line x1="306" y1="152" x2="484" y2="68" stroke="#437a22" stroke-width="1.5"/>
  <text x="388" y="160" font-size="9" fill="#437a22" text-anchor="middle">chord lies above curve</text>
  <!-- Rules summary -->
  <rect x="14" y="184" width="492" height="62" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="202" font-size="11" font-weight="700" fill="#7a7974" text-anchor="middle">ACCURACY RULES</text>
  <text x="40" y="220" font-size="10" fill="#28251d">• More subintervals (larger n) → more accurate approximation</text>
  <text x="40" y="234" font-size="10" fill="#28251d">• Concave up (f″&gt;0) → trapezoid underestimates true area</text>
  <text x="40" y="248" font-size="10" fill="#28251d">• Concave down (f″&lt;0) → trapezoid overestimates true area</text>
</svg>