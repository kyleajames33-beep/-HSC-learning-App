<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">RIEMANN SUM → DEFINITE INTEGRAL — L06</text>
  <!-- Left panel: few wide rectangles -->
  <rect x="14" y="34" width="236" height="186" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="132" y="52" font-size="10" font-weight="700" fill="#7a7974" text-anchor="middle">n = 4 rectangles (coarse)</text>
  <!-- axes -->
  <line x1="28" y1="192" x2="238" y2="192" stroke="#bab9b4" stroke-width="1"/>
  <line x1="38" y1="58" x2="38" y2="196" stroke="#bab9b4" stroke-width="1"/>
  <!-- 4 rectangles approximating x² curve -->
  <rect x="38" y="170" width="45" height="22" fill="#01696f" opacity="0.3" stroke="#01696f" stroke-width="1"/>
  <rect x="83" y="148" width="45" height="44" fill="#01696f" opacity="0.3" stroke="#01696f" stroke-width="1"/>
  <rect x="128" y="112" width="45" height="80" fill="#01696f" opacity="0.3" stroke="#01696f" stroke-width="1"/>
  <rect x="173" y="62" width="45" height="130" fill="#01696f" opacity="0.3" stroke="#01696f" stroke-width="1"/>
  <!-- curve over rectangles -->
  <path d="M 38,192 C 60,188 90,174 120,150 C 145,130 165,108 185,80 C 200,60 215,50 235,42" fill="none" stroke="#01696f" stroke-width="2" stroke-linecap="round"/>
  <text x="132" y="210" font-size="9" fill="#c0392b" text-anchor="middle">over/under-estimate visible</text>
  <!-- Right panel: many thin rectangles -->
  <rect x="270" y="34" width="236" height="186" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="388" y="52" font-size="10" font-weight="700" fill="#7a7974" text-anchor="middle">n → ∞ (exact area)</text>
  <!-- axes -->
  <line x1="284" y1="192" x2="494" y2="192" stroke="#bab9b4" stroke-width="1"/>
  <line x1="294" y1="58" x2="294" y2="196" stroke="#bab9b4" stroke-width="1"/>
  <!-- many thin rectangles (simulated with shading) -->
  <path d="M 294,192 C 316,188 346,174 376,150 C 401,130 421,108 441,80 C 456,60 471,50 491,42 L 491,192 Z" fill="#01696f" opacity="0.25"/>
  <!-- curve -->
  <path d="M 294,192 C 316,188 346,174 376,150 C 401,130 421,108 441,80 C 456,60 471,50 491,42" fill="none" stroke="#01696f" stroke-width="2" stroke-linecap="round"/>
  <text x="388" y="210" font-size="9" fill="#437a22" text-anchor="middle">exact shaded area = ∫ f(x) dx</text>
  <!-- bottom formula -->
  <rect x="14" y="232" width="492" height="54" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="250" font-size="11" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.04em">RIEMANN SUM DEFINITION</text>
  <text x="260" y="268" font-size="12" font-weight="700" fill="#28251d" text-anchor="middle">∫ᵃᵇ f(x)dx = lim[n→∞] Σ f(xᵢ)·Δx</text>
  <text x="260" y="282" font-size="10" fill="#7a7974" text-anchor="middle">As rectangles become infinitely thin, sum becomes exact</text>
</svg>