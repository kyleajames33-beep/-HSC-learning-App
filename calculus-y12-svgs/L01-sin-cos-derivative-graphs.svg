<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">SIN, COS AND THEIR DERIVATIVES — L01</text>
  <!-- Panel 1: sin x and its derivative cos x -->
  <rect x="14" y="32" width="492" height="118" rx="8" fill="#fff" stroke="#01696f" stroke-width="1.5"/>
  <text x="28" y="50" font-size="11" font-weight="700" fill="#01696f">f(x) = sin x</text>
  <text x="28" y="64" font-size="10" fill="#da7101">f′(x) = cos x</text>
  <!-- Axes panel 1 -->
  <line x1="60" y1="90" x2="490" y2="90" stroke="#ebe9e4" stroke-width="1"/>
  <line x1="60" y1="40" x2="60" y2="142" stroke="#ebe9e4" stroke-width="1"/>
  <!-- sin x curve -->
  <path d="M 60,90 C 90,55 120,55 150,90 C 180,125 210,125 240,90 C 270,55 300,55 330,90 C 360,125 390,125 420,90 C 440,70 460,62 490,58" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- cos x curve (derivative) -->
  <path d="M 60,55 C 90,55 110,70 150,90 C 190,110 210,125 240,90 C 270,55 290,40 330,90 C 370,140 390,125 420,90 C 440,70 465,58 490,90" fill="none" stroke="#da7101" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4"/>
  <!-- Labels -->
  <text x="165" y="52" font-size="10" fill="#01696f" font-weight="700">sin x</text>
  <text x="200" y="46" font-size="10" fill="#da7101">cos x = (sin x)′</text>
  <!-- x-axis labels -->
  <text x="150" y="102" font-size="9" fill="#7a7974" text-anchor="middle">π/2</text>
  <text x="240" y="102" font-size="9" fill="#7a7974" text-anchor="middle">π</text>
  <text x="330" y="102" font-size="9" fill="#7a7974" text-anchor="middle">3π/2</text>
  <text x="420" y="102" font-size="9" fill="#7a7974" text-anchor="middle">2π</text>
  <!-- Panel 2: cos x and its derivative -sin x -->
  <rect x="14" y="162" width="492" height="118" rx="8" fill="#fff" stroke="#006494" stroke-width="1.5"/>
  <text x="28" y="180" font-size="11" font-weight="700" fill="#006494">f(x) = cos x</text>
  <text x="28" y="194" font-size="10" fill="#a12c7b">f′(x) = −sin x</text>
  <line x1="60" y1="220" x2="490" y2="220" stroke="#ebe9e4" stroke-width="1"/>
  <line x1="60" y1="170" x2="60" y2="272" stroke="#ebe9e4" stroke-width="1"/>
  <!-- cos x -->
  <path d="M 60,185 C 90,185 110,200 150,220 C 190,240 210,255 240,220 C 270,185 290,170 330,220 C 370,270 390,255 420,220 C 440,200 465,188 490,220" fill="none" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <!-- -sin x -->
  <path d="M 60,220 C 90,255 120,255 150,220 C 180,185 210,185 240,220 C 270,255 300,255 330,220 C 360,185 390,185 420,220 C 440,235 465,242 490,252" fill="none" stroke="#a12c7b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4"/>
  <text x="165" y="182" font-size="10" fill="#006494" font-weight="700">cos x</text>
  <text x="200" y="266" font-size="10" fill="#a12c7b">−sin x = (cos x)′</text>
  <text x="150" y="232" font-size="9" fill="#7a7974" text-anchor="middle">π/2</text>
  <text x="240" y="232" font-size="9" fill="#7a7974" text-anchor="middle">π</text>
  <text x="330" y="232" font-size="9" fill="#7a7974" text-anchor="middle">3π/2</text>
  <text x="420" y="232" font-size="9" fill="#7a7974" text-anchor="middle">2π</text>
  <!-- Rule box -->
  <rect x="14" y="286" width="492" height="26" rx="8" fill="#28251d"/>
  <text x="260" y="303" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">d/dx[sin x] = cos x     d/dx[cos x] = −sin x     d/dx[tan x] = sec²x</text>
</svg>