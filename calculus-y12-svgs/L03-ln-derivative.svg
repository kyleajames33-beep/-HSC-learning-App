<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">DERIVATIVE OF ln x — L03</text>
  <!-- Axes -->
  <line x1="40" y1="180" x2="490" y2="180" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="90" y1="20" x2="90" y2="270" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="184" font-size="10" fill="#7a7974" font-style="italic">x</text>
  <text x="94" y="18" font-size="10" fill="#7a7974" font-style="italic">y</text>
  <!-- ln x curve (only x>0) -->
  <path d="M 100,268 C 105,250 115,220 130,195 C 145,170 160,155 180,143 C 205,128 230,118 260,110 C 295,101 330,95 375,88 C 410,83 450,79 490,76" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- gradient 1/x curve -->
  <path d="M 100,40 C 108,55 118,80 135,110 C 148,132 162,148 180,158 C 205,170 235,175 270,178 C 305,181 345,181 390,181 C 425,181 455,181 490,181" fill="none" stroke="#da7101" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4"/>
  <!-- Tangent at x=1 (slope=1) -->
  <circle cx="170" cy="180" r="6" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="176" y="177" font-size="10" fill="#a12c7b" font-weight="700">(1, 0)</text>
  <line x1="100" y1="250" x2="250" y2="100" stroke="#a12c7b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="60" y="254" font-size="9" fill="#a12c7b">slope=1</text>
  <!-- Labels -->
  <text x="440" y="70" font-size="11" fill="#01696f" font-weight="700">ln x</text>
  <text x="420" y="176" font-size="11" fill="#da7101" font-weight="700">1/x = (ln x)′</text>
  <!-- x=1 vertical -->
  <line x1="170" y1="100" x2="170" y2="270" stroke="#a12c7b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="172" y="268" font-size="9" fill="#a12c7b">x=1</text>
  <!-- Rule box -->
  <rect x="30" y="244" width="460" height="44" rx="8" fill="#28251d"/>
  <text x="260" y="260" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">d/dx [ln x] = 1/x    (x &gt; 0)</text>
  <text x="260" y="278" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle">Chain rule: d/dx [ln(f(x))] = f′(x) / f(x)</text>
</svg>