<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">INTEGRATION AS REVERSE DIFFERENTIATION — L05</text>
  <!-- Forward arrow: differentiate -->
  <rect x="60" y="50" width="160" height="44" rx="10" fill="#006494"/>
  <text x="140" y="68" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">F(x) = x³/3</text>
  <text x="140" y="84" font-size="10" fill="#c8e4f5" text-anchor="middle">(antiderivative)</text>
  <rect x="300" y="50" width="160" height="44" rx="10" fill="#01696f"/>
  <text x="380" y="68" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">f(x) = x²</text>
  <text x="380" y="84" font-size="10" fill="#c8e8e6" text-anchor="middle">(derivative)</text>
  <!-- forward arrow -->
  <line x1="224" y1="72" x2="296" y2="72" stroke="#01696f" stroke-width="2" marker-end="url(#ar2)"/>
  <defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#01696f"/></marker>
  <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#da7101"/></marker></defs>
  <text x="260" y="66" font-size="10" fill="#01696f" font-weight="700" text-anchor="middle">differentiate</text>
  <text x="260" y="78" font-size="9" fill="#7a7974" text-anchor="middle">d/dx</text>
  <!-- backward arrow -->
  <line x1="296" y1="86" x2="224" y2="86" stroke="#da7101" stroke-width="2" marker-end="url(#ar3)"/>
  <text x="260" y="100" font-size="10" fill="#da7101" font-weight="700" text-anchor="middle">integrate</text>
  <text x="260" y="112" font-size="9" fill="#7a7974" text-anchor="middle">∫ dx</text>
  <!-- +C section -->
  <rect x="14" y="126" width="492" height="60" rx="8" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="260" y="144" font-size="12" font-weight="700" fill="#da7101" text-anchor="middle">The +C (constant of integration)</text>
  <text x="260" y="162" font-size="11" fill="#28251d" text-anchor="middle">d/dx[x³/3] = x²   d/dx[x³/3 + 5] = x²   d/dx[x³/3 − 7] = x²</text>
  <text x="260" y="178" font-size="10" fill="#7a7974" text-anchor="middle">Infinitely many antiderivatives → must write + C unless given initial condition</text>
  <!-- Family of curves -->
  <rect x="14" y="194" width="240" height="90" rx="8" fill="#fff" stroke="#006494" stroke-width="1.5"/>
  <text x="134" y="212" font-size="10" font-weight="700" fill="#006494" text-anchor="middle">Family of curves F(x) = x³/3 + C</text>
  <!-- mini axes -->
  <line x1="30" y1="250" x2="240" y2="250" stroke="#ebe9e4" stroke-width="1"/>
  <line x1="134" y1="220" x2="134" y2="278" stroke="#ebe9e4" stroke-width="1"/>
  <!-- 3 curves with different C -->
  <path d="M 60,278 C 80,268 105,250 120,238 C 128,232 131,228 134,225" fill="none" stroke="#006494" stroke-width="1.5" opacity="0.4"/>
  <path d="M 55,278 C 75,260 100,242 115,230 C 123,224 129,222 134,220" fill="none" stroke="#006494" stroke-width="2"/>
  <path d="M 50,278 C 70,252 96,234 112,223 C 120,218 127,216 134,215" fill="none" stroke="#006494" stroke-width="1.5" opacity="0.4"/>
  <text x="152" y="225" font-size="9" fill="#006494">C=2</text>
  <text x="152" y="233" font-size="9" fill="#006494">C=0</text>
  <text x="152" y="242" font-size="9" fill="#006494">C=−2</text>
  <!-- Power rule for integration -->
  <rect x="266" y="194" width="240" height="90" rx="8" fill="#28251d"/>
  <text x="386" y="214" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">POWER RULE (INTEGRATION)</text>
  <text x="386" y="234" font-size="13" font-weight="700" fill="#da7101" text-anchor="middle">∫ xⁿ dx = x^(n+1)/(n+1) + C</text>
  <text x="386" y="252" font-size="10" fill="#bab9b4" text-anchor="middle">n ≠ −1</text>
  <text x="386" y="268" font-size="10" fill="#437a22" text-anchor="middle">Also: ∫ eˣ dx = eˣ + C</text>
  <text x="386" y="280" font-size="10" fill="#437a22" text-anchor="middle">∫ 1/x dx = ln|x| + C</text>
</svg>