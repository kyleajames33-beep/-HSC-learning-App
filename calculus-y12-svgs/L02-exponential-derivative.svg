<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">DERIVATIVE OF eˣ — L02</text>
  <!-- Axes -->
  <line x1="40" y1="220" x2="490" y2="220" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="120" y1="20" x2="120" y2="232" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="224" font-size="10" fill="#7a7974" font-style="italic">x</text>
  <text x="124" y="18" font-size="10" fill="#7a7974" font-style="italic">y</text>
  <!-- eˣ curve -->
  <path d="M 50,218 C 70,216 90,210 110,198 C 120,192 130,183 140,170 C 155,150 165,130 180,108 C 195,86 210,65 230,48 C 250,32 270,24 290,20" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Tangent at x=0 (slope=1) -->
  <line x1="70" y1="268" x2="200" y2="138" stroke="#da7101" stroke-width="2" stroke-dasharray="none"/>
  <!-- Point at (0,1) -->
  <circle cx="120" cy="203" r="6" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="126" y="200" font-size="11" fill="#a12c7b" font-weight="700">(0, 1)</text>
  <text x="64" y="272" font-size="10" fill="#da7101">gradient = 1 at x=0</text>
  <!-- tangent at x=1 -->
  <line x1="120" y1="138" x2="260" y2="60" stroke="#006494" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="190" cy="99" r="5" fill="#006494" stroke="#f7f6f2" stroke-width="2"/>
  <text x="196" y="96" font-size="10" fill="#006494" font-weight="700">(1, e)</text>
  <text x="196" y="108" font-size="9" fill="#006494">slope = e</text>
  <!-- Key property box -->
  <rect x="300" y="36" width="205" height="140" rx="10" fill="#fff" stroke="#dcd9d5" stroke-width="1.5"/>
  <text x="402" y="56" font-size="11" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.05em">KEY PROPERTY</text>
  <rect x="314" y="64" width="177" height="36" rx="7" fill="#28251d"/>
  <text x="402" y="87" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">d/dx [eˣ] = eˣ</text>
  <text x="402" y="116" font-size="10" fill="#7a7974" text-anchor="middle">eˣ is the ONLY function</text>
  <text x="402" y="130" font-size="10" fill="#7a7974" text-anchor="middle">that equals its own derivative</text>
  <text x="402" y="148" font-size="10" fill="#7a7974" text-anchor="middle">gradient = y-value at every point</text>
  <text x="402" y="162" font-size="10" fill="#da7101" font-weight="700" text-anchor="middle">d/dx [e^(f(x))] = e^(f(x)) · f′(x)</text>
  <!-- y-axis ticks -->
  <text x="112" y="224" font-size="9" fill="#7a7974" text-anchor="end">0</text>
  <text x="112" y="204" font-size="9" fill="#7a7974" text-anchor="end">1</text>
  <!-- footer -->
  <text x="260" y="272" font-size="10" fill="#7a7974" text-anchor="middle">Slope of tangent = value of function — this defines e ≈ 2.718</text>
  <!-- x-axis labels -->
  <text x="120" y="232" font-size="9" fill="#7a7974" text-anchor="middle">0</text>
  <text x="210" y="232" font-size="9" fill="#7a7974" text-anchor="middle">1</text>
  <text x="300" y="232" font-size="9" fill="#7a7974" text-anchor="middle">2</text>
</svg>