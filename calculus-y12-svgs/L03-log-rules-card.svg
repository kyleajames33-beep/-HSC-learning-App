<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="260" fill="#f7f6f2" rx="12"/>
  <text x="260" y="24" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">LOG &amp; EXP DERIVATIVE RULES CARD — L03</text>
  <!-- Row 1 -->
  <rect x="14" y="34" width="244" height="46" rx="8" fill="#e8f5f5" stroke="#01696f" stroke-width="1.5"/>
  <text x="136" y="52" font-size="12" font-weight="700" fill="#01696f" text-anchor="middle">d/dx [ln x] = 1/x</text>
  <text x="136" y="70" font-size="10" fill="#7a7974" text-anchor="middle">domain: x &gt; 0</text>
  <rect x="266" y="34" width="244" height="46" rx="8" fill="#e8f5f5" stroke="#01696f" stroke-width="1.5"/>
  <text x="388" y="52" font-size="12" font-weight="700" fill="#01696f" text-anchor="middle">d/dx [ln(f(x))] = f′(x)/f(x)</text>
  <text x="388" y="70" font-size="10" fill="#7a7974" text-anchor="middle">chain rule applied</text>
  <!-- Row 2 -->
  <rect x="14" y="88" width="244" height="46" rx="8" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <text x="136" y="106" font-size="12" font-weight="700" fill="#da7101" text-anchor="middle">d/dx [eˣ] = eˣ</text>
  <text x="136" y="124" font-size="10" fill="#7a7974" text-anchor="middle">unique self-derivative</text>
  <rect x="266" y="88" width="244" height="46" rx="8" fill="#fff0dc" stroke="#da7101" stroke-width="1.5"/>
  <text x="388" y="106" font-size="12" font-weight="700" fill="#da7101" text-anchor="middle">d/dx [e^(f(x))] = e^(f(x))·f′(x)</text>
  <text x="388" y="124" font-size="10" fill="#7a7974" text-anchor="middle">chain rule applied</text>
  <!-- Row 3 -->
  <rect x="14" y="142" width="244" height="46" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="136" y="160" font-size="12" font-weight="700" fill="#006494" text-anchor="middle">d/dx [aˣ] = aˣ · ln a</text>
  <text x="136" y="178" font-size="10" fill="#7a7974" text-anchor="middle">general exponential base a</text>
  <rect x="266" y="142" width="244" height="46" rx="8" fill="#dcedf7" stroke="#006494" stroke-width="1.5"/>
  <text x="388" y="160" font-size="12" font-weight="700" fill="#006494" text-anchor="middle">d/dx [log_a x] = 1/(x ln a)</text>
  <text x="388" y="178" font-size="10" fill="#7a7974" text-anchor="middle">change of base: ln a needed</text>
  <!-- Row 4 memory -->
  <rect x="14" y="196" width="492" height="50" rx="8" fill="#28251d"/>
  <text x="260" y="214" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">MEMORY AID — "log differentiates to a fraction, exp differentiates to itself"</text>
  <text x="260" y="232" font-size="10" fill="#bab9b4" text-anchor="middle">d/dx[ln x] = 1/x    d/dx[eˣ] = eˣ    these are inverse operations</text>
  <text x="260" y="244" font-size="10" fill="#da7101" font-weight="700" text-anchor="middle">∫(1/x)dx = ln|x| + C    ∫eˣ dx = eˣ + C</text>
</svg>