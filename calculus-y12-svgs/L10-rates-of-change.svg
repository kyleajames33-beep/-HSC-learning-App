<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">RATES OF CHANGE — L10</text>
  <!-- Axes -->
  <line x1="50" y1="200" x2="490" y2="200" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="80" y1="30" x2="80" y2="212" stroke="#bab9b4" stroke-width="1.5"/>
  <text x="492" y="204" font-size="10" fill="#7a7974" font-style="italic">t</text>
  <text x="84" y="28" font-size="10" fill="#7a7974" font-style="italic">V</text>
  <!-- Volume curve -->
  <path d="M 80,190 C 120,182 160,165 200,140 C 235,118 265,95 300,75 C 330,58 360,46 400,38 C 430,32 460,30 490,30" fill="none" stroke="#006494" stroke-width="3" stroke-linecap="round"/>
  <!-- Tangent at t=200 -->
  <circle cx="240" cy="130" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <line x1="160" y1="170" x2="320" y2="90" stroke="#da7101" stroke-width="2"/>
  <text x="326" y="88" font-size="10" fill="#da7101" font-weight="700">dV/dt</text>
  <text x="326" y="100" font-size="9" fill="#da7101">(instantaneous rate)</text>
  <!-- Secant line -->
  <line x1="120" y1="175" x2="380" y2="42" stroke="#a12c7b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="385" y="40" font-size="10" fill="#a12c7b" font-weight="700">ΔV/Δt</text>
  <text x="385" y="52" font-size="9" fill="#a12c7b">(average rate)</text>
  <!-- Cards row -->
  <rect x="14" y="220" width="154" height="66" rx="8" fill="#fff" stroke="#006494" stroke-width="1.5"/>
  <text x="91" y="238" font-size="10" font-weight="700" fill="#006494" text-anchor="middle">Instantaneous rate</text>
  <text x="91" y="254" font-size="12" font-weight="700" fill="#006494" text-anchor="middle">dy/dx = f′(x)</text>
  <text x="91" y="270" font-size="9" fill="#7a7974" text-anchor="middle">slope of tangent</text>
  <rect x="183" y="220" width="154" height="66" rx="8" fill="#fff" stroke="#a12c7b" stroke-width="1.5"/>
  <text x="260" y="238" font-size="10" font-weight="700" fill="#a12c7b" text-anchor="middle">Average rate</text>
  <text x="260" y="254" font-size="12" font-weight="700" fill="#a12c7b" text-anchor="middle">Δy/Δx</text>
  <text x="260" y="270" font-size="9" fill="#7a7974" text-anchor="middle">slope of secant</text>
  <rect x="352" y="220" width="154" height="66" rx="8" fill="#fff" stroke="#437a22" stroke-width="1.5"/>
  <text x="429" y="238" font-size="10" font-weight="700" fill="#437a22" text-anchor="middle">Related rates</text>
  <text x="429" y="254" font-size="12" font-weight="700" fill="#437a22" text-anchor="middle">chain rule</text>
  <text x="429" y="270" font-size="9" fill="#7a7974" text-anchor="middle">dV/dt = dV/dr · dr/dt</text>
</svg>