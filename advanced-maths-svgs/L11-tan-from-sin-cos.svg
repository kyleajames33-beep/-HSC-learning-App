<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="340" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">TAN AS RATIO OF SIN AND COS — L11</text>
  <!-- Unit circle -->
  <circle cx="150" cy="175" r="100" fill="none" stroke="#dcd9d5" stroke-width="1.5"/>
  <!-- Axes -->
  <line x1="40" y1="175" x2="265" y2="175" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="150" y1="60" x2="150" y2="290" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- Point P on circle at ~40deg -->
  <!-- cos40=0.766, sin40=0.643, scaled by 100 -->
  <!-- P = (150+76.6, 175-64.3) = (226.6, 110.7) -->
  <line x1="150" y1="175" x2="227" y2="111" stroke="#da7101" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="227" y1="175" x2="227" y2="111" stroke="#01696f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="none"/>
  <line x1="150" y1="175" x2="227" y2="175" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right angle -->
  <rect x="216" y="164" width="11" height="11" fill="none" stroke="#7a7974" stroke-width="1.2"/>
  <!-- Point -->
  <circle cx="227" cy="111" r="5" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <text x="233" y="107" font-size="12" fill="#a12c7b" font-weight="700">P(θ)</text>
  <!-- Labels -->
  <text x="181" y="130" font-size="12" fill="#da7101" font-weight="700">1</text>
  <text x="232" y="148" font-size="12" fill="#01696f" font-weight="700">sinθ</text>
  <text x="183" y="192" font-size="12" fill="#006494" font-weight="700">cosθ</text>
  <!-- Angle arc -->
  <path d="M 178 175 A 28 28 0 0 1 171 150" fill="none" stroke="#a12c7b" stroke-width="1.8"/>
  <text x="183" y="171" font-size="12" fill="#a12c7b" font-weight="700">θ</text>
  <!-- Tangent line on circle extending to x=1 -->
  <!-- Tangent at x=1 (x=250 on diagram), vertical line, tan point at (250, 175-tan40*100) = (250, 175-83.9)=(250,91) -->
  <line x1="250" y1="60" x2="250" y2="290" stroke="#7a7974" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="252" y="58" font-size="10" fill="#7a7974">x=1</text>
  <line x1="150" y1="175" x2="250" y2="91" stroke="#a12c7b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="250" cy="91" r="5" fill="#437a22" stroke="#f7f6f2" stroke-width="2"/>
  <line x1="250" y1="91" x2="250" y2="175" stroke="#437a22" stroke-width="2.5" stroke-linecap="round"/>
  <text x="258" y="138" font-size="12" fill="#437a22" font-weight="700">tanθ</text>
  <!-- Formula derivation box -->
  <rect x="290" y="54" width="210" height="176" rx="10" fill="#fff" stroke="#d4d1ca" stroke-width="1.5"/>
  <text x="395" y="74" font-size="12" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.06em">DERIVATION</text>
  <line x1="300" y1="80" x2="490" y2="80" stroke="#dcd9d5" stroke-width="1"/>
  <text x="300" y="100" font-size="12" fill="#28251d">P = (cosθ, sinθ)</text>
  <text x="300" y="120" font-size="12" fill="#28251d">Triangle similar to</text>
  <text x="300" y="136" font-size="12" fill="#28251d">the one at x=1</text>
  <text x="300" y="158" font-size="12" fill="#28251d">tanθ / 1 = sinθ / cosθ</text>
  <rect x="300" y="168" width="190" height="36" rx="7" fill="#437a22"/>
  <text x="395" y="181" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">tanθ = sinθ / cosθ</text>
  <text x="395" y="196" font-size="10" fill="#d4f0c4" text-anchor="middle">undefined where cosθ = 0</text>
  <!-- Corollary -->
  <rect x="290" y="248" width="210" height="52" rx="8" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="395" y="266" font-size="11" fill="#0c4e54" font-weight="700" text-anchor="middle">Also:</text>
  <text x="395" y="282" font-size="12" fill="#0c4e54" text-anchor="middle">cotθ = cosθ / sinθ</text>
  <text x="395" y="295" font-size="10" fill="#0c4e54" text-anchor="middle">(undefined where sinθ = 0)</text>
  <!-- Title footer -->
  <text x="150" y="318" font-size="11" fill="#7a7974" text-anchor="middle">Unit circle approach</text>
</svg>