<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">SOLVING sin x = k GRAPHICALLY — L13</text>
  <!-- Axes -->
  <line x1="40" y1="155" x2="500" y2="155" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="60" y1="30" x2="60" y2="270" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- x ticks -->
  <line x1="60" y1="151" x2="60" y2="159" stroke="#7a7974" stroke-width="1"/><text x="60" y="170" font-size="10" fill="#7a7974" text-anchor="middle">0</text>
  <line x1="170" y1="151" x2="170" y2="159" stroke="#7a7974" stroke-width="1"/><text x="170" y="170" font-size="10" fill="#7a7974" text-anchor="middle">π/2</text>
  <line x1="280" y1="151" x2="280" y2="159" stroke="#7a7974" stroke-width="1"/><text x="280" y="170" font-size="10" fill="#7a7974" text-anchor="middle">π</text>
  <line x1="390" y1="151" x2="390" y2="159" stroke="#7a7974" stroke-width="1"/><text x="390" y="170" font-size="10" fill="#7a7974" text-anchor="middle">3π/2</text>
  <line x1="500" y1="151" x2="500" y2="159" stroke="#7a7974" stroke-width="1"/><text x="500" y="170" font-size="10" fill="#7a7974" text-anchor="middle">2π</text>
  <!-- y ticks -->
  <line x1="56" y1="65" x2="64" y2="65" stroke="#7a7974" stroke-width="1"/><text x="50" y="69" font-size="10" fill="#7a7974" text-anchor="end">1</text>
  <line x1="56" y1="245" x2="64" y2="245" stroke="#7a7974" stroke-width="1"/><text x="50" y="249" font-size="10" fill="#7a7974" text-anchor="end">−1</text>
  <!-- Sine wave -->
  <path d="M 60,155 C 87,65 143,65 170,155 C 197,245 253,245 280,155 C 307,65 363,65 390,155 C 417,245 473,245 500,155" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- y = 0.5 horizontal line: y = 155 - 0.5*90 = 110 -->
  <line x1="40" y1="110" x2="500" y2="110" stroke="#da7101" stroke-width="2" stroke-dasharray="none"/>
  <text x="44" y="106" font-size="11" fill="#da7101" font-weight="700">y = 0.5</text>
  <!-- Intersection points -->
  <!-- sin x = 0.5 at x = pi/6 (~x=118) and x = 5pi/6 (~x=232) -->
  <circle cx="118" cy="110" r="6" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="242" cy="110" r="6" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <!-- Drop lines -->
  <line x1="118" y1="110" x2="118" y2="159" stroke="#a12c7b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="242" y1="110" x2="242" y2="159" stroke="#a12c7b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="118" y="174" font-size="10" fill="#a12c7b" text-anchor="middle">π/6</text>
  <text x="242" y="174" font-size="10" fill="#a12c7b" text-anchor="middle">5π/6</text>
  <!-- Solution labels -->
  <text x="118" y="98" font-size="10" fill="#a12c7b" text-anchor="middle">x₁</text>
  <text x="242" y="98" font-size="10" fill="#a12c7b" text-anchor="middle">x₂</text>
  <!-- Callout box -->
  <rect x="310" y="186" width="180" height="64" rx="8" fill="#fff" stroke="#a12c7b" stroke-width="1.5"/>
  <text x="400" y="204" font-size="11" fill="#a12c7b" font-weight="700" text-anchor="middle">Domain [0, 2π]</text>
  <text x="400" y="220" font-size="11" fill="#28251d" text-anchor="middle">2 solutions:</text>
  <text x="400" y="238" font-size="11" fill="#a12c7b" text-anchor="middle">x = π/6 and x = 5π/6</text>
  <!-- Axis labels -->
  <text x="498" y="151" font-size="11" fill="#7a7974" font-style="italic">x</text>
  <text x="64" y="28" font-size="11" fill="#7a7974" font-style="italic">y</text>
</svg>