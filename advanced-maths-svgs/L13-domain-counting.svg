<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">DOMAIN AFFECTS NUMBER OF SOLUTIONS — L13</text>
  <!-- TOP: domain [0,2pi] -->
  <text x="260" y="46" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">Domain [0, 2π] → 2 solutions</text>
  <!-- Axes top -->
  <line x1="40" y1="100" x2="290" y2="100" stroke="#bab9b4" stroke-width="1"/>
  <line x1="50" y1="55" x2="50" y2="130" stroke="#bab9b4" stroke-width="1"/>
  <text x="50" y="144" font-size="9" fill="#7a7974" text-anchor="middle">0</text>
  <text x="170" y="144" font-size="9" fill="#7a7974" text-anchor="middle">π</text>
  <text x="290" y="144" font-size="9" fill="#7a7974" text-anchor="middle">2π</text>
  <!-- Sine top -->
  <path d="M 50,100 C 67,55 103,55 120,100 C 137,145 173,145 190,100 C 207,55 243,55 260,100 C 277,145 283,145 290,128" fill="none" stroke="#01696f" stroke-width="2" stroke-linecap="round"/>
  <!-- y=0.5 line top: 100 - 0.5*45 = 77.5 -->
  <line x1="40" y1="78" x2="290" y2="78" stroke="#da7101" stroke-width="1.5"/>
  <text x="42" y="74" font-size="9" fill="#da7101">k</text>
  <!-- intersections top ~x=95 and x=175 -->
  <circle cx="95" cy="78" r="5" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="175" cy="78" r="5" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="185" y="68" font-size="10" fill="#a12c7b" font-weight="700">2 intersections</text>
  <!-- BOTTOM: domain [0,4pi] -->
  <text x="260" y="168" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">Domain [0, 4π] → 4 solutions</text>
  <!-- Axes bottom -->
  <line x1="40" y1="222" x2="490" y2="222" stroke="#bab9b4" stroke-width="1"/>
  <line x1="50" y1="177" x2="50" y2="252" stroke="#bab9b4" stroke-width="1"/>
  <text x="50" y="264" font-size="9" fill="#7a7974" text-anchor="middle">0</text>
  <text x="170" y="264" font-size="9" fill="#7a7974" text-anchor="middle">π</text>
  <text x="290" y="264" font-size="9" fill="#7a7974" text-anchor="middle">2π</text>
  <text x="410" y="264" font-size="9" fill="#7a7974" text-anchor="middle">3π</text>
  <text x="490" y="264" font-size="9" fill="#7a7974" text-anchor="middle">4π</text>
  <!-- Sine bottom -->
  <path d="M 50,222 C 67,177 103,177 120,222 C 137,267 173,267 190,222 C 207,177 243,177 260,222 C 277,267 313,267 330,222 C 347,177 383,177 400,222 C 417,267 453,267 470,222 C 477,210 488,200 490,196" fill="none" stroke="#01696f" stroke-width="2" stroke-linecap="round"/>
  <!-- y=k line bottom -->
  <line x1="40" y1="200" x2="490" y2="200" stroke="#da7101" stroke-width="1.5"/>
  <text x="42" y="196" font-size="9" fill="#da7101">k</text>
  <!-- 4 intersections -->
  <circle cx="95" cy="200" r="5" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="175" cy="200" r="5" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="335" cy="200" r="5" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="415" cy="200" r="5" fill="#a12c7b" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="400" y="190" font-size="10" fill="#a12c7b" font-weight="700">4 intersections</text>
  <!-- Rule box -->
  <rect x="290" y="56" width="210" height="36" rx="7" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="395" y="71" font-size="11" fill="#0c4e54" font-weight="700" text-anchor="middle">Rule: each extra period</text>
  <text x="395" y="85" font-size="11" fill="#0c4e54" text-anchor="middle">adds 2 more solutions</text>
</svg>