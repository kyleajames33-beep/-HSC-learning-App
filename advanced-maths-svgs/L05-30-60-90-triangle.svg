<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="420" height="340" fill="#f7f6f2" rx="12"/>
  <text x="210" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#28251d" letter-spacing="0.04em">30°– 60°– 90° TRIANGLE</text>

  <!-- triangle: A(50,280) B(370,280) C(50,60) -->
  <polygon points="50,280 370,280 50,60" fill="#e8f5f3" stroke="#01696f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- right angle at A -->
  <rect x="50" y="262" width="18" height="18" fill="none" stroke="#7a7974" stroke-width="1.5"/>

  <!-- sides -->
  <!-- AB base = √3 -->
  <text x="210" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#da7101">√3</text>
  <!-- AC height = 1 -->
  <text x="30" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#da7101">1</text>
  <!-- BC hyp = 2 -->
  <text x="228" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#006494">2</text>

  <!-- angle at B = 30° -->
  <path d="M 350,280 A 22,22 0 0,1 335,265" fill="none" stroke="#a12c7b" stroke-width="1.8"/>
  <text x="318" y="268" font-size="14" font-weight="600" fill="#a12c7b">30°</text>

  <!-- angle at C = 60° -->
  <path d="M 50,80 A 22,22 0 0,0 70,74" fill="none" stroke="#a12c7b" stroke-width="1.8"/>
  <text x="68" y="82" font-size="14" font-weight="600" fill="#a12c7b">60°</text>

  <!-- trig table: two columns for 30 and 60 -->
  <rect x="170" y="44" width="240" height="148" rx="8" fill="#f3f0ec" stroke="#d4d1ca" stroke-width="1"/>
  <text x="290" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#7a7974" letter-spacing="0.05em">EXACT VALUES</text>
  <line x1="180" y1="68" x2="400" y2="68" stroke="#d4d1ca" stroke-width="1"/>
  <!-- header -->
  <text x="230" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#a12c7b">30°</text>
  <text x="340" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#a12c7b">60°</text>
  <line x1="180" y1="88" x2="400" y2="88" stroke="#d4d1ca" stroke-width="0.5"/>
  <!-- sin -->
  <text x="185" y="106" font-size="12" fill="#28251d">sin</text>
  <text x="230" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1/2</text>
  <text x="340" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">√3/2</text>
  <!-- cos -->
  <text x="185" y="128" font-size="12" fill="#28251d">cos</text>
  <text x="230" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">√3/2</text>
  <text x="340" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1/2</text>
  <!-- tan -->
  <text x="185" y="150" font-size="12" fill="#28251d">tan</text>
  <text x="230" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1/√3</text>
  <text x="340" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">√3</text>
  <text x="185" y="178" font-size="10" fill="#bab9b4">half equilateral triangle</text>
</svg>