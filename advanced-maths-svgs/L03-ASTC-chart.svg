<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="400" height="420" fill="#f7f6f2" rx="12"/>
  <text x="200" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#28251d" letter-spacing="0.04em">ASTC — SIGN OF TRIG RATIOS</text>

  <!-- Q2 -->
  <rect x="20" y="50" width="170" height="160" rx="8" fill="#fef3e8" stroke="#da7101" stroke-width="1.5"/>
  <text x="105" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#7a7974">Quadrant 2</text>
  <text x="105" y="102" text-anchor="middle" font-size="12" fill="#7a7974">90° – 180°</text>
  <text x="105" y="130" text-anchor="middle" font-size="22" font-weight="800" fill="#da7101">S</text>
  <text x="105" y="152" text-anchor="middle" font-size="12" fill="#28251d">sin +</text>
  <text x="105" y="168" text-anchor="middle" font-size="12" fill="#7a7974">cos −, tan −</text>
  <text x="105" y="196" text-anchor="middle" font-size="11" fill="#bab9b4">Sine positive</text>

  <!-- Q1 -->
  <rect x="210" y="50" width="170" height="160" rx="8" fill="#e8f5f3" stroke="#01696f" stroke-width="1.5"/>
  <text x="295" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#7a7974">Quadrant 1</text>
  <text x="295" y="102" text-anchor="middle" font-size="12" fill="#7a7974">0° – 90°</text>
  <text x="295" y="130" text-anchor="middle" font-size="22" font-weight="800" fill="#01696f">A</text>
  <text x="295" y="152" text-anchor="middle" font-size="12" fill="#28251d">All +</text>
  <text x="295" y="168" text-anchor="middle" font-size="12" fill="#7a7974">sin +, cos +, tan +</text>
  <text x="295" y="196" text-anchor="middle" font-size="11" fill="#bab9b4">All positive</text>

  <!-- Q3 -->
  <rect x="20" y="230" width="170" height="160" rx="8" fill="#f3eef8" stroke="#a12c7b" stroke-width="1.5"/>
  <text x="105" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#7a7974">Quadrant 3</text>
  <text x="105" y="282" text-anchor="middle" font-size="12" fill="#7a7974">180° – 270°</text>
  <text x="105" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#a12c7b">T</text>
  <text x="105" y="332" text-anchor="middle" font-size="12" fill="#28251d">tan +</text>
  <text x="105" y="348" text-anchor="middle" font-size="12" fill="#7a7974">sin −, cos −</text>
  <text x="105" y="376" text-anchor="middle" font-size="11" fill="#bab9b4">Tangent positive</text>

  <!-- Q4 -->
  <rect x="210" y="230" width="170" height="160" rx="8" fill="#e8f0f8" stroke="#006494" stroke-width="1.5"/>
  <text x="295" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#7a7974">Quadrant 4</text>
  <text x="295" y="282" text-anchor="middle" font-size="12" fill="#7a7974">270° – 360°</text>
  <text x="295" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#006494">C</text>
  <text x="295" y="332" text-anchor="middle" font-size="12" fill="#28251d">cos +</text>
  <text x="295" y="348" text-anchor="middle" font-size="12" fill="#7a7974">sin −, tan −</text>
  <text x="295" y="376" text-anchor="middle" font-size="11" fill="#bab9b4">Cosine positive</text>

  <!-- axes -->
  <line x1="200" y1="40" x2="200" y2="400" stroke="#7a7974" stroke-width="2"/>
  <line x1="10" y1="220" x2="390" y2="220" stroke="#7a7974" stroke-width="2"/>

  <!-- mnemonic -->
  <text x="200" y="412" text-anchor="middle" font-size="11" fill="#bab9b4">Mnemonic: All Stations To Central</text>
</svg>