<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="340" fill="#f7f6f2" rx="12"/>
  <text x="260" y="26" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">COMPLEMENTARY ANGLES — L08</text>
  <!-- Left triangle: angle theta -->
  <g transform="translate(30,50)">
    <polygon points="20,230 20,50 180,230" fill="#cedcd8"/>
    <line x1="20" y1="230" x2="20" y2="50" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="180" y2="230" stroke="#da7101" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="230" x2="180" y2="230" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="20" y="210" width="20" height="20" fill="none" stroke="#7a7974" stroke-width="1.5"/>
    <path d="M 60 230 A 40 40 0 0 1 20 192" fill="none" stroke="#a12c7b" stroke-width="2"/>
    <text x="68" y="223" font-size="15" fill="#a12c7b" font-weight="700">θ</text>
    <text x="2" y="148" font-size="13" fill="#01696f" font-weight="700" text-anchor="middle">opp</text>
    <text x="100" y="258" font-size="13" fill="#006494" font-weight="700" text-anchor="middle">adj</text>
    <text x="125" y="125" font-size="13" fill="#da7101" font-weight="700" transform="rotate(-48,125,125)">hyp</text>
    <text x="100" y="280" font-size="12" fill="#28251d" text-anchor="middle" font-weight="600">sin θ = opp/hyp</text>
    <text x="100" y="296" font-size="12" fill="#28251d" text-anchor="middle">cos θ = adj/hyp</text>
  </g>
  <!-- Arrow -->
  <text x="260" y="185" font-size="28" fill="#a12c7b" text-anchor="middle">⇄</text>
  <text x="260" y="210" font-size="11" fill="#7a7974" text-anchor="middle">swap θ → (90°−θ)</text>
  <!-- Right triangle: angle 90-theta (opp/adj swapped) -->
  <g transform="translate(280,50)">
    <polygon points="20,230 20,50 180,230" fill="#fff0dc"/>
    <line x1="20" y1="230" x2="20" y2="50" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="180" y2="230" stroke="#da7101" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="230" x2="180" y2="230" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="20" y="210" width="20" height="20" fill="none" stroke="#7a7974" stroke-width="1.5"/>
    <path d="M 60 230 A 40 40 0 0 1 20 192" fill="none" stroke="#a12c7b" stroke-width="2"/>
    <text x="64" y="221" font-size="13" fill="#a12c7b" font-weight="700">90°−θ</text>
    <text x="2" y="148" font-size="13" fill="#006494" font-weight="700" text-anchor="middle">adj</text>
    <text x="100" y="258" font-size="13" fill="#01696f" font-weight="700" text-anchor="middle">opp</text>
    <text x="125" y="125" font-size="13" fill="#da7101" font-weight="700" transform="rotate(-48,125,125)">hyp</text>
    <text x="100" y="280" font-size="12" fill="#28251d" text-anchor="middle" font-weight="600">sin(90°−θ) = adj/hyp</text>
    <text x="100" y="296" font-size="12" fill="#28251d" text-anchor="middle">= cos θ ✓</text>
  </g>
  <!-- Identity banner -->
  <rect x="100" y="304" width="320" height="28" rx="7" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="260" y="322" font-size="12" fill="#0c4e54" text-anchor="middle" font-weight="600">sin(90°−θ) = cos θ · cos(90°−θ) = sin θ · tan(90°−θ) = cot θ</text>
</svg>