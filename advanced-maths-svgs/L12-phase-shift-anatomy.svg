<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="24" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">PARAMETER ANATOMY: y = a·sin(b(x − c)) + d — L12</text>
  <!-- Axes -->
  <line x1="40" y1="155" x2="490" y2="155" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="60" y1="40" x2="60" y2="270" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- Midline (d) -->
  <line x1="60" y1="120" x2="490" y2="120" stroke="#437a22" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="494" y="124" font-size="11" fill="#437a22" font-weight="700">d</text>
  <!-- Sine wave shifted: a=1.2, b=1, c=40px right shift, d=midline at y=120 -->
  <!-- Wave: starts at c (x=100), amplitude a maps to 60px -->
  <path d="M 100,120 C 127,40 183,40 210,120 C 237,200 293,200 320,120 C 347,40 403,40 430,120 C 457,200 480,200 490,178" fill="none" stroke="#01696f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Reference sine (unshifted, grey) -->
  <path d="M 60,155 C 87,75 143,75 170,155 C 197,235 253,235 280,155 C 307,75 363,75 390,155 C 417,235 460,235 490,210" fill="none" stroke="#bab9b4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="170" y="72" font-size="10" fill="#bab9b4">y = sin x</text>
  <!-- Phase shift arrow -->
  <line x1="60" y1="270" x2="100" y2="270" stroke="#a12c7b" stroke-width="2" marker-end="url(#pha)"/>
  <defs><marker id="pha" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#a12c7b"/></marker></defs>
  <text x="80" y="285" font-size="11" fill="#a12c7b" font-weight="700" text-anchor="middle">c (phase shift)</text>
  <!-- Amplitude arrow -->
  <line x1="32" y1="120" x2="32" y2="42" stroke="#da7101" stroke-width="1.5" marker-start="url(#ampa)" marker-end="url(#ampa)"/>
  <defs><marker id="ampa" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#da7101"/></marker></defs>
  <text x="22" y="84" font-size="11" fill="#da7101" font-weight="700" text-anchor="middle" transform="rotate(-90,22,84)">a (amp)</text>
  <!-- Period bracket -->
  <line x1="100" y1="302" x2="320" y2="302" stroke="#006494" stroke-width="1.5"/>
  <line x1="100" y1="296" x2="100" y2="308" stroke="#006494" stroke-width="1.5"/>
  <line x1="320" y1="296" x2="320" y2="308" stroke="#006494" stroke-width="1.5"/>
  <text x="210" y="316" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">T = 2π/b (period)</text>
  <!-- Vertical shift label -->
  <line x1="490" y1="120" x2="490" y2="155" stroke="#437a22" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="490" y="142" font-size="10" fill="#437a22" text-anchor="end">d = vertical shift</text>
  <!-- Legend -->
  <rect x="340" y="38" width="160" height="72" rx="7" fill="#fff" stroke="#d4d1ca" stroke-width="1"/>
  <text x="420" y="54" font-size="11" fill="#7a7974" font-weight="700" text-anchor="middle">Parameters</text>
  <text x="350" y="70" font-size="10" fill="#da7101">● a</text><text x="364" y="70" font-size="10" fill="#28251d"> = amplitude</text>
  <text x="350" y="84" font-size="10" fill="#006494">● b</text><text x="364" y="84" font-size="10" fill="#28251d"> = freq (T=2π/b)</text>
  <text x="350" y="98" font-size="10" fill="#a12c7b">● c</text><text x="364" y="98" font-size="10" fill="#28251d"> = phase shift</text>
  <text x="350" y="112" font-size="10" fill="#437a22">● d</text><text x="364" y="112" font-size="10" fill="#28251d"> = vertical shift</text>
</svg>