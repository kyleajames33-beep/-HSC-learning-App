<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="24" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">GRAPH OF y = sin x — L10</text>
  <!-- axes -->
  <line x1="40" y1="150" x2="500" y2="150" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="60" y1="30" x2="60" y2="270" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- x-axis ticks and labels -->
  <!-- 0 --><line x1="60" y1="146" x2="60" y2="154" stroke="#7a7974" stroke-width="1"/><text x="60" y="168" font-size="11" fill="#7a7974" text-anchor="middle">0</text>
  <!-- pi/2 --><line x1="170" y1="146" x2="170" y2="154" stroke="#7a7974" stroke-width="1"/><text x="170" y="168" font-size="11" fill="#7a7974" text-anchor="middle">π/2</text>
  <!-- pi --><line x1="280" y1="146" x2="280" y2="154" stroke="#7a7974" stroke-width="1"/><text x="280" y="168" font-size="11" fill="#7a7974" text-anchor="middle">π</text>
  <!-- 3pi/2 --><line x1="390" y1="146" x2="390" y2="154" stroke="#7a7974" stroke-width="1"/><text x="390" y="168" font-size="11" fill="#7a7974" text-anchor="middle">3π/2</text>
  <!-- 2pi --><line x1="500" y1="146" x2="500" y2="154" stroke="#7a7974" stroke-width="1"/><text x="500" y="168" font-size="11" fill="#7a7974" text-anchor="middle">2π</text>
  <!-- y-axis ticks -->
  <line x1="56" y1="60" x2="64" y2="60" stroke="#7a7974" stroke-width="1"/><text x="50" y="64" font-size="11" fill="#7a7974" text-anchor="end">1</text>
  <line x1="56" y1="240" x2="64" y2="240" stroke="#7a7974" stroke-width="1"/><text x="50" y="244" font-size="11" fill="#7a7974" text-anchor="end">−1</text>
  <!-- Amplitude dashed lines -->
  <line x1="60" y1="60" x2="500" y2="60" stroke="#da7101" stroke-width="1" stroke-dasharray="5,4" opacity="0.7"/>
  <line x1="60" y1="240" x2="500" y2="240" stroke="#da7101" stroke-width="1" stroke-dasharray="5,4" opacity="0.7"/>
  <!-- Sine wave path (one full period 0 to 2pi, mapped to x 60..500, y 150 amplitude 90) -->
  <path d="M 60,150 C 87,60 143,60 170,150 C 197,240 253,240 280,150 C 307,60 363,60 390,150 C 417,240 473,240 500,150" fill="none" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <!-- Key points -->
  <circle cx="60" cy="150" r="5" fill="#01696f" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="170" cy="60" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="280" cy="150" r="5" fill="#01696f" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="390" cy="240" r="5" fill="#da7101" stroke="#f7f6f2" stroke-width="2"/>
  <circle cx="500" cy="150" r="5" fill="#01696f" stroke="#f7f6f2" stroke-width="2"/>
  <!-- Key point labels -->
  <text x="60" y="142" font-size="10" fill="#01696f" text-anchor="middle">(0, 0)</text>
  <text x="170" y="50" font-size="10" fill="#da7101" text-anchor="middle">(π/2, 1)</text>
  <text x="280" y="142" font-size="10" fill="#01696f" text-anchor="middle">(π, 0)</text>
  <text x="390" y="260" font-size="10" fill="#da7101" text-anchor="middle">(3π/2, −1)</text>
  <text x="500" y="142" font-size="10" fill="#01696f" text-anchor="middle">(2π, 0)</text>
  <!-- Amplitude annotation -->
  <line x1="508" y1="60" x2="508" y2="150" stroke="#da7101" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <defs><marker id="ab" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#da7101" stroke-width="1"/></marker></defs>
  <text x="516" y="110" font-size="11" fill="#da7101" font-weight="700">A=1</text>
  <!-- Period annotation -->
  <line x1="60" y1="278" x2="500" y2="278" stroke="#006494" stroke-width="1.5"/>
  <line x1="60" y1="272" x2="60" y2="284" stroke="#006494" stroke-width="1.5"/>
  <line x1="500" y1="272" x2="500" y2="284" stroke="#006494" stroke-width="1.5"/>
  <text x="280" y="294" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">Period T = 2π</text>
  <!-- axis labels -->
  <text x="502" y="146" font-size="12" fill="#7a7974" font-style="italic">x</text>
  <text x="64" y="34" font-size="12" fill="#7a7974" font-style="italic">y</text>
</svg>