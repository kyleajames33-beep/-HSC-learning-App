<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="380" fill="#f7f6f2" rx="12"/>
  <text x="260" y="28" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">PYTHAGOREAN IDENTITIES — L07</text>
  <!-- Unit circle triangle -->
  <circle cx="130" cy="180" r="90" fill="none" stroke="#dcd9d5" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Triangle inside circle -->
  <line x1="130" y1="180" x2="207" y2="180" stroke="#006494" stroke-width="3" stroke-linecap="round"/>
  <line x1="207" y1="180" x2="207" y2="114" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="180" x2="207" y2="114" stroke="#da7101" stroke-width="3" stroke-linecap="round"/>
  <!-- right angle -->
  <rect x="196" y="169" width="11" height="11" fill="none" stroke="#7a7974" stroke-width="1.2"/>
  <!-- angle arc -->
  <path d="M 168 180 A 38 38 0 0 1 152 152" fill="none" stroke="#a12c7b" stroke-width="1.8"/>
  <!-- Labels -->
  <text x="167" y="198" font-size="14" fill="#a12c7b" font-weight="700">θ</text>
  <text x="215" y="155" font-size="13" fill="#01696f" font-weight="700">sin θ</text>
  <text x="162" y="172" font-size="13" fill="#006494" font-weight="700">cos θ</text>
  <text x="155" y="128" font-size="13" fill="#da7101" font-weight="700">1</text>
  <text x="130" y="290" font-size="12" fill="#7a7974" text-anchor="middle">P(cos θ, sin θ) on unit circle</text>
  <!-- Derivation steps -->
  <!-- Box 1 -->
  <rect x="270" y="44" width="230" height="54" rx="8" fill="#fff" stroke="#da7101" stroke-width="2"/>
  <text x="385" y="67" font-size="14" fill="#28251d" text-anchor="middle">By Pythagoras:</text>
  <text x="385" y="87" font-size="15" font-weight="700" fill="#da7101" text-anchor="middle">cos²θ + sin²θ = 1</text>
  <!-- Arrow -->
  <line x1="385" y1="98" x2="385" y2="118" stroke="#7a7974" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a7974"/></marker></defs>
  <!-- Box 2 -->
  <rect x="270" y="118" width="230" height="68" rx="8" fill="#fff" stroke="#006494" stroke-width="2"/>
  <text x="385" y="138" font-size="12" fill="#7a7974" text-anchor="middle">÷ cos²θ both sides:</text>
  <text x="385" y="158" font-size="14" font-weight="700" fill="#006494" text-anchor="middle">tan²θ + 1 = sec²θ</text>
  <text x="385" y="178" font-size="11" fill="#7a7974" text-anchor="middle">(undefined where cos θ = 0)</text>
  <!-- Arrow -->
  <line x1="385" y1="186" x2="385" y2="206" stroke="#7a7974" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Box 3 -->
  <rect x="270" y="206" width="230" height="68" rx="8" fill="#fff" stroke="#01696f" stroke-width="2"/>
  <text x="385" y="226" font-size="12" fill="#7a7974" text-anchor="middle">÷ sin²θ both sides:</text>
  <text x="385" y="246" font-size="14" font-weight="700" fill="#01696f" text-anchor="middle">1 + cot²θ = csc²θ</text>
  <text x="385" y="266" font-size="11" fill="#7a7974" text-anchor="middle">(undefined where sin θ = 0)</text>
  <!-- Summary box -->
  <rect x="270" y="292" width="230" height="64" rx="8" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="385" y="312" font-size="12" font-weight="700" fill="#0c4e54" text-anchor="middle">3 Pythagorean Identities</text>
  <text x="385" y="330" font-size="11" fill="#0c4e54" text-anchor="middle">sin²θ + cos²θ = 1</text>
  <text x="385" y="348" font-size="11" fill="#0c4e54" text-anchor="middle">tan²θ + 1 = sec²θ · 1 + cot²θ = csc²θ</text>
  <!-- Title footer -->
  <text x="130" y="358" font-size="11" fill="#7a7974" text-anchor="middle">From unit circle</text>
</svg>