<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="360" fill="#f7f6f2" rx="12"/>
  <!-- Triangle -->
  <polygon points="100,280 100,80 340,280" fill="#cedcd8" stroke="none"/>
  <line x1="100" y1="280" x2="100" y2="80" stroke="#01696f" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="80" x2="340" y2="280" stroke="#da7101" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="280" x2="340" y2="280" stroke="#006494" stroke-width="3" stroke-linecap="round"/>
  <!-- Right angle box -->
  <rect x="100" y="260" width="20" height="20" fill="none" stroke="#7a7974" stroke-width="1.5"/>
  <!-- Angle arc at bottom-left -->
  <path d="M 140 280 A 40 40 0 0 1 100 240" fill="none" stroke="#a12c7b" stroke-width="2"/>
  <text x="148" y="272" font-size="16" fill="#a12c7b" font-weight="700">θ</text>
  <!-- Side labels -->
  <!-- Opposite (left vertical) -->
  <text x="58" y="192" font-size="15" fill="#01696f" font-weight="700" text-anchor="middle">opp</text>
  <!-- Hypotenuse (diagonal) -->
  <text x="242" y="162" font-size="15" fill="#da7101" font-weight="700" text-anchor="middle" transform="rotate(-42,242,162)">hyp</text>
  <!-- Adjacent (bottom) -->
  <text x="220" y="308" font-size="15" fill="#006494" font-weight="700" text-anchor="middle">adj</text>
  <!-- Formula box -->
  <rect x="360" y="60" width="140" height="200" rx="10" fill="#fff" stroke="#d4d1ca" stroke-width="1.5"/>
  <text x="430" y="84" font-size="12" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.08em">RATIOS</text>
  <line x1="370" y1="90" x2="490" y2="90" stroke="#dcd9d5" stroke-width="1"/>
  <text x="374" y="116" font-size="14" fill="#01696f" font-weight="700">sin θ</text>
  <text x="374" y="133" font-size="13" fill="#28251d">= opp / hyp</text>
  <text x="374" y="158" font-size="14" fill="#006494" font-weight="700">cos θ</text>
  <text x="374" y="175" font-size="13" fill="#28251d">= adj / hyp</text>
  <text x="374" y="200" font-size="14" fill="#a12c7b" font-weight="700">tan θ</text>
  <text x="374" y="217" font-size="13" fill="#28251d">= opp / adj</text>
  <!-- SOH CAH TOA banner -->
  <rect x="360" y="276" width="140" height="36" rx="8" fill="#a12c7b"/>
  <text x="430" y="299" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="0.05em">SOH CAH TOA</text>
  <!-- Title -->
  <text x="260" y="340" font-size="13" fill="#7a7974" text-anchor="middle" font-weight="600" letter-spacing="0.06em">TRIG RATIOS (SOHCAHTOA) — L04</text>
</svg>