<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="360" fill="#f7f6f2" rx="12"/>
  <text x="260" y="28" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">PYTHAGOREAN IDENTITY FAMILY TREE — L07</text>
  <!-- Root box -->
  <rect x="155" y="44" width="210" height="48" rx="9" fill="#da7101" stroke="none"/>
  <text x="260" y="64" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">sin²θ + cos²θ = 1</text>
  <text x="260" y="82" font-size="11" fill="#fff" text-anchor="middle">Pythagoras on unit circle</text>
  <!-- Branch lines -->
  <line x1="200" y1="92" x2="130" y2="148" stroke="#006494" stroke-width="2"/>
  <line x1="320" y1="92" x2="390" y2="148" stroke="#01696f" stroke-width="2"/>
  <!-- Branch labels -->
  <text x="142" y="130" font-size="10" fill="#006494" font-weight="600" transform="rotate(-34,142,130)">÷ cos²θ</text>
  <text x="354" y="118" font-size="10" fill="#01696f" font-weight="600" transform="rotate(34,354,118)">÷ sin²θ</text>
  <!-- Left box -->
  <rect x="30" y="148" width="200" height="64" rx="9" fill="#006494"/>
  <text x="130" y="170" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">tan²θ + 1 = sec²θ</text>
  <text x="130" y="188" font-size="11" fill="#dcedf7" text-anchor="middle">divide by cos²θ</text>
  <text x="130" y="203" font-size="10" fill="#dcedf7" text-anchor="middle">undef. where cosθ = 0</text>
  <!-- Right box -->
  <rect x="290" y="148" width="200" height="64" rx="9" fill="#01696f"/>
  <text x="390" y="170" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1 + cot²θ = csc²θ</text>
  <text x="390" y="188" font-size="11" fill="#cedcd8" text-anchor="middle">divide by sin²θ</text>
  <text x="390" y="203" font-size="10" fill="#cedcd8" text-anchor="middle">undef. where sinθ = 0</text>
  <!-- Rearrangements left -->
  <line x1="90" y1="212" x2="70" y2="248" stroke="#7a7974" stroke-width="1.5"/>
  <line x1="170" y1="212" x2="190" y2="248" stroke="#7a7974" stroke-width="1.5"/>
  <rect x="20" y="248" width="140" height="36" rx="7" fill="#fff" stroke="#006494" stroke-width="1.5"/>
  <text x="90" y="263" font-size="12" fill="#006494" text-anchor="middle" font-weight="600">sec²θ − tan²θ = 1</text>
  <text x="90" y="277" font-size="10" fill="#7a7974" text-anchor="middle">rearranged form</text>
  <rect x="170" y="248" width="140" height="36" rx="7" fill="#fff" stroke="#006494" stroke-width="1.5"/>
  <text x="240" y="263" font-size="12" fill="#006494" text-anchor="middle" font-weight="600">sec²θ − 1 = tan²θ</text>
  <text x="240" y="277" font-size="10" fill="#7a7974" text-anchor="middle">rearranged form</text>
  <!-- Rearrangements right -->
  <line x1="350" y1="212" x2="330" y2="248" stroke="#7a7974" stroke-width="1.5"/>
  <line x1="430" y1="212" x2="450" y2="248" stroke="#7a7974" stroke-width="1.5"/>
  <rect x="280" y="248" width="140" height="36" rx="7" fill="#fff" stroke="#01696f" stroke-width="1.5"/>
  <text x="350" y="263" font-size="12" fill="#01696f" text-anchor="middle" font-weight="600">csc²θ − cot²θ = 1</text>
  <text x="350" y="277" font-size="10" fill="#7a7974" text-anchor="middle">rearranged form</text>
  <rect x="360" y="248" width="140" height="36" rx="7" fill="#fff" stroke="#01696f" stroke-width="1.5"/>
  <text x="430" y="263" font-size="12" fill="#01696f" text-anchor="middle" font-weight="600">csc²θ − 1 = cot²θ</text>
  <text x="430" y="277" font-size="10" fill="#7a7974" text-anchor="middle">rearranged form</text>
  <!-- Tip -->
  <rect x="100" y="304" width="320" height="34" rx="7" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="260" y="325" font-size="12" fill="#0c4e54" text-anchor="middle" font-weight="500">All 3 identities hold for every value of θ in their domain</text>
</svg>