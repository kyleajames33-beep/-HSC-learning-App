<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="360" fill="#f7f6f2" rx="12"/>
  <text x="260" y="28" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">DOMAINS &amp; RANGES OF TRIG FUNCTIONS — L09</text>
  <!-- Table header -->
  <rect x="20" y="40" width="90" height="32" rx="0" fill="#01696f"/>
  <rect x="110" y="40" width="160" height="32" rx="0" fill="#006494"/>
  <rect x="270" y="40" width="110" height="32" rx="0" fill="#a12c7b"/>
  <rect x="380" y="40" width="120" height="32" rx="0" fill="#437a22"/>
  <text x="65" y="61" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Function</text>
  <text x="190" y="61" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Domain</text>
  <text x="325" y="61" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Range</text>
  <text x="440" y="61" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Period</text>
  <!-- Rows -->
  <!-- sin -->
  <rect x="20" y="72" width="480" height="40" rx="0" fill="#fff" stroke="#dcd9d5" stroke-width="1"/>
  <text x="65" y="97" font-size="14" fill="#01696f" font-weight="700" text-anchor="middle">sin x</text>
  <text x="190" y="97" font-size="12" fill="#28251d" text-anchor="middle">ℝ (all reals)</text>
  <text x="325" y="97" font-size="12" fill="#28251d" text-anchor="middle">[−1, 1]</text>
  <text x="440" y="97" font-size="12" fill="#28251d" text-anchor="middle">2π</text>
  <!-- cos -->
  <rect x="20" y="112" width="480" height="40" rx="0" fill="#f7f6f2" stroke="#dcd9d5" stroke-width="1"/>
  <text x="65" y="137" font-size="14" fill="#006494" font-weight="700" text-anchor="middle">cos x</text>
  <text x="190" y="137" font-size="12" fill="#28251d" text-anchor="middle">ℝ (all reals)</text>
  <text x="325" y="137" font-size="12" fill="#28251d" text-anchor="middle">[−1, 1]</text>
  <text x="440" y="137" font-size="12" fill="#28251d" text-anchor="middle">2π</text>
  <!-- tan -->
  <rect x="20" y="152" width="480" height="40" rx="0" fill="#fff" stroke="#dcd9d5" stroke-width="1"/>
  <text x="65" y="177" font-size="14" fill="#437a22" font-weight="700" text-anchor="middle">tan x</text>
  <text x="190" y="172" font-size="11" fill="#28251d" text-anchor="middle">ℝ \ {π/2 + nπ, n ∈ ℤ}</text>
  <text x="190" y="186" font-size="10" fill="#7a7974" text-anchor="middle">(excl. odd multiples of π/2)</text>
  <text x="325" y="177" font-size="12" fill="#28251d" text-anchor="middle">ℝ (all reals)</text>
  <text x="440" y="177" font-size="12" fill="#28251d" text-anchor="middle">π</text>
  <!-- csc -->
  <rect x="20" y="192" width="480" height="40" rx="0" fill="#f7f6f2" stroke="#dcd9d5" stroke-width="1"/>
  <text x="65" y="217" font-size="14" fill="#a12c7b" font-weight="700" text-anchor="middle">csc x</text>
  <text x="190" y="212" font-size="11" fill="#28251d" text-anchor="middle">ℝ \ {nπ, n ∈ ℤ}</text>
  <text x="190" y="226" font-size="10" fill="#7a7974" text-anchor="middle">(excl. multiples of π)</text>
  <text x="325" y="217" font-size="12" fill="#28251d" text-anchor="middle">(−∞,−1] ∪ [1,∞)</text>
  <text x="440" y="217" font-size="12" fill="#28251d" text-anchor="middle">2π</text>
  <!-- sec -->
  <rect x="20" y="232" width="480" height="40" rx="0" fill="#fff" stroke="#dcd9d5" stroke-width="1"/>
  <text x="65" y="257" font-size="14" fill="#a12c7b" font-weight="700" text-anchor="middle">sec x</text>
  <text x="190" y="252" font-size="11" fill="#28251d" text-anchor="middle">ℝ \ {π/2 + nπ, n ∈ ℤ}</text>
  <text x="190" y="266" font-size="10" fill="#7a7974" text-anchor="middle">(excl. odd multiples of π/2)</text>
  <text x="325" y="257" font-size="12" fill="#28251d" text-anchor="middle">(−∞,−1] ∪ [1,∞)</text>
  <text x="440" y="257" font-size="12" fill="#28251d" text-anchor="middle">2π</text>
  <!-- cot -->
  <rect x="20" y="272" width="480" height="40" rx="0" fill="#f7f6f2" stroke="#dcd9d5" stroke-width="1"/>
  <text x="65" y="297" font-size="14" fill="#a12c7b" font-weight="700" text-anchor="middle">cot x</text>
  <text x="190" y="292" font-size="11" fill="#28251d" text-anchor="middle">ℝ \ {nπ, n ∈ ℤ}</text>
  <text x="190" y="306" font-size="10" fill="#7a7974" text-anchor="middle">(excl. multiples of π)</text>
  <text x="325" y="297" font-size="12" fill="#28251d" text-anchor="middle">ℝ (all reals)</text>
  <text x="440" y="297" font-size="12" fill="#28251d" text-anchor="middle">π</text>
  <!-- footer note -->
  <text x="260" y="334" font-size="11" fill="#7a7974" text-anchor="middle">θ in radians · n ∈ ℤ denotes any integer</text>
</svg>