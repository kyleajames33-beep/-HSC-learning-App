<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="680" height="300" fill="#f7f6f2" rx="12"/>
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#28251d" letter-spacing="0.04em">EXACT VALUES REFERENCE TABLE</text>

  <!-- table -->
  <rect x="20" y="44" width="640" height="240" rx="8" fill="#fff" stroke="#d4d1ca" stroke-width="1"/>

  <!-- header row -->
  <rect x="20" y="44" width="640" height="36" rx="8" fill="#cedcd8"/>
  <rect x="20" y="62" width="640" height="18" fill="#cedcd8"/>

  <!-- column headers -->
  <text x="90" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4e54">θ (deg)</text>
  <text x="180" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4e54">θ (rad)</text>
  <text x="310" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4e54">sin θ</text>
  <text x="450" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4e54">cos θ</text>
  <text x="590" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4e54">tan θ</text>

  <!-- dividers -->
  <line x1="140" y1="44" x2="140" y2="284" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="230" y1="44" x2="230" y2="284" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="390" y1="44" x2="390" y2="284" stroke="#dcd9d5" stroke-width="1"/>
  <line x1="520" y1="44" x2="520" y2="284" stroke="#dcd9d5" stroke-width="1"/>

  <!-- rows -->
  <!-- 0° -->
  <line x1="20" y1="100" x2="660" y2="100" stroke="#f3f0ec" stroke-width="1"/>
  <text x="90" y="95" text-anchor="middle" font-size="13" fill="#28251d">0°</text>
  <text x="180" y="95" text-anchor="middle" font-size="13" fill="#7a7974">0</text>
  <text x="310" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">0</text>
  <text x="450" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1</text>
  <text x="590" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">0</text>

  <!-- 30° -->
  <rect x="21" y="101" width="638" height="26" fill="#f9f8f5"/>
  <line x1="20" y1="127" x2="660" y2="127" stroke="#f3f0ec" stroke-width="1"/>
  <text x="90" y="119" text-anchor="middle" font-size="13" fill="#28251d">30°</text>
  <text x="180" y="119" text-anchor="middle" font-size="13" fill="#7a7974">π/6</text>
  <text x="310" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1/2</text>
  <text x="450" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">√3/2</text>
  <text x="590" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1/√3</text>

  <!-- 45° -->
  <line x1="20" y1="153" x2="660" y2="153" stroke="#f3f0ec" stroke-width="1"/>
  <text x="90" y="145" text-anchor="middle" font-size="13" fill="#28251d">45°</text>
  <text x="180" y="145" text-anchor="middle" font-size="13" fill="#7a7974">π/4</text>
  <text x="310" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">√2/2</text>
  <text x="450" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">√2/2</text>
  <text x="590" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1</text>

  <!-- 60° -->
  <rect x="21" y="154" width="638" height="26" fill="#f9f8f5"/>
  <line x1="20" y1="180" x2="660" y2="180" stroke="#f3f0ec" stroke-width="1"/>
  <text x="90" y="172" text-anchor="middle" font-size="13" fill="#28251d">60°</text>
  <text x="180" y="172" text-anchor="middle" font-size="13" fill="#7a7974">π/3</text>
  <text x="310" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">√3/2</text>
  <text x="450" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1/2</text>
  <text x="590" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">√3</text>

  <!-- 90° -->
  <line x1="20" y1="206" x2="660" y2="206" stroke="#f3f0ec" stroke-width="1"/>
  <text x="90" y="198" text-anchor="middle" font-size="13" fill="#28251d">90°</text>
  <text x="180" y="198" text-anchor="middle" font-size="13" fill="#7a7974">π/2</text>
  <text x="310" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1</text>
  <text x="450" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">0</text>
  <text x="590" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#a12c7b" font-family="JetBrains Mono,monospace">undef</text>

  <!-- 180° -->
  <rect x="21" y="207" width="638" height="26" fill="#f9f8f5"/>
  <line x1="20" y1="233" x2="660" y2="233" stroke="#f3f0ec" stroke-width="1"/>
  <text x="90" y="225" text-anchor="middle" font-size="13" fill="#28251d">180°</text>
  <text x="180" y="225" text-anchor="middle" font-size="13" fill="#7a7974">π</text>
  <text x="310" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">0</text>
  <text x="450" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">−1</text>
  <text x="590" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">0</text>

  <!-- 270° -->
  <line x1="20" y1="259" x2="660" y2="259" stroke="#f3f0ec" stroke-width="1"/>
  <text x="90" y="251" text-anchor="middle" font-size="13" fill="#28251d">270°</text>
  <text x="180" y="251" text-anchor="middle" font-size="13" fill="#7a7974">3π/2</text>
  <text x="310" y="251" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">−1</text>
  <text x="450" y="251" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">0</text>
  <text x="590" y="251" text-anchor="middle" font-size="13" font-weight="600" fill="#a12c7b" font-family="JetBrains Mono,monospace">undef</text>

  <!-- 360° -->
  <rect x="21" y="260" width="638" height="24" fill="#f9f8f5" rx="0"/>
  <text x="90" y="277" text-anchor="middle" font-size="13" fill="#28251d">360°</text>
  <text x="180" y="277" text-anchor="middle" font-size="13" fill="#7a7974">2π</text>
  <text x="310" y="277" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">0</text>
  <text x="450" y="277" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">1</text>
  <text x="590" y="277" text-anchor="middle" font-size="13" font-weight="600" fill="#01696f" font-family="JetBrains Mono,monospace">0</text>
</svg>