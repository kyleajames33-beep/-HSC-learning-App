<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="24" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">COMMON PHASE SHIFT ERROR — L12</text>
  <!-- Wrong box -->
  <rect x="20" y="38" width="225" height="100" rx="9" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="132" y="58" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">❌ WRONG</text>
  <text x="132" y="80" font-size="14" fill="#28251d" text-anchor="middle">y = sin(2x − π)</text>
  <text x="132" y="100" font-size="12" fill="#7a7974" text-anchor="middle">“phase shift = π”</text>
  <text x="132" y="118" font-size="11" fill="#c0392b" text-anchor="middle">(ignoring the b factor)</text>
  <text x="132" y="133" font-size="11" fill="#c0392b" text-anchor="middle">shift ≠ c when b ≠ 1</text>
  <!-- Arrow -->
  <line x1="245" y1="88" x2="275" y2="88" stroke="#7a7974" stroke-width="2" marker-end="url(#ph2)"/>
  <defs><marker id="ph2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#7a7974"/></marker></defs>
  <!-- Right box -->
  <rect x="275" y="38" width="225" height="100" rx="9" fill="#e8f5e9" stroke="#01696f" stroke-width="2"/>
  <text x="387" y="58" font-size="12" font-weight="700" fill="#01696f" text-anchor="middle">✅ CORRECT</text>
  <text x="387" y="80" font-size="14" fill="#28251d" text-anchor="middle">y = sin 2(x − π/2)</text>
  <text x="387" y="100" font-size="12" fill="#7a7974" text-anchor="middle">Factor out b first</text>
  <text x="387" y="118" font-size="12" fill="#01696f" font-weight="700" text-anchor="middle">phase shift = π/2</text>
  <text x="387" y="133" font-size="11" fill="#01696f" text-anchor="middle">shift = c/b = π/2</text>
  <!-- Rule box -->
  <rect x="20" y="154" width="480" height="48" rx="8" fill="#fff" stroke="#006494" stroke-width="2"/>
  <text x="260" y="174" font-size="13" fill="#006494" font-weight="700" text-anchor="middle">Rule: always factorise first</text>
  <text x="260" y="192" font-size="12" fill="#28251d" text-anchor="middle">y = a·sin(bx − c) → rewrite as y = a·sin b(x − c/b) → shift = c/b</text>
  <!-- Step-by-step -->
  <rect x="20" y="216" width="480" height="84" rx="8" fill="#fff" stroke="#d4d1ca" stroke-width="1.5"/>
  <text x="30" y="234" font-size="11" font-weight="700" fill="#7a7974">Example: y = sin(3x − π)</text>
  <text x="30" y="252" font-size="12" fill="#28251d">Step 1: factor → y = sin 3(x − π/3)</text>
  <text x="30" y="268" font-size="12" fill="#28251d">Step 2: b = 3, c/b = π/3</text>
  <text x="30" y="284" font-size="12" fill="#01696f" font-weight="700">Step 3: phase shift = π/3 (not π)</text>
</svg>