<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="320" fill="#f7f6f2" rx="12"/>
  <text x="260" y="24" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">UNIT CIRCLE → RANGE OF TRIG FUNCTIONS — L09</text>
  <!-- Unit circle -->
  <circle cx="155" cy="160" r="100" fill="#cedcd8" fill-opacity="0.3" stroke="#dcd9d5" stroke-width="1.5"/>
  <!-- Axes -->
  <line x1="45" y1="160" x2="270" y2="160" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="155" y1="50" x2="155" y2="270" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- x=1 and x=-1 ticks -->
  <line x1="255" y1="156" x2="255" y2="164" stroke="#7a7974" stroke-width="1"/><text x="255" y="176" font-size="10" fill="#7a7974" text-anchor="middle">1</text>
  <line x1="55" y1="156" x2="55" y2="164" stroke="#7a7974" stroke-width="1"/><text x="55" y="176" font-size="10" fill="#7a7974" text-anchor="middle">−1</text>
  <line x1="151" y1="60" x2="159" y2="60" stroke="#7a7974" stroke-width="1"/><text x="142" y="64" font-size="10" fill="#7a7974" text-anchor="end">1</text>
  <line x1="151" y1="260" x2="159" y2="260" stroke="#7a7974" stroke-width="1"/><text x="142" y="264" font-size="10" fill="#7a7974" text-anchor="end">−1</text>
  <!-- Point on circle -->
  <!-- angle ~50deg: cos=0.643, sin=0.766 -> (155+64.3, 160-76.6)=(219,83) -->
  <line x1="155" y1="160" x2="219" y2="83" stroke="#da7101" stroke-width="2" stroke-linecap="round"/>
  <circle cx="219" cy="83" r="5" fill="#a12c7b" stroke="#f7f6f2" stroke-width="2"/>
  <!-- cos projection (horizontal) -->
  <line x1="155" y1="160" x2="219" y2="160" stroke="#006494" stroke-width="2.5" stroke-linecap="round"/>
  <!-- sin projection (vertical) -->
  <line x1="219" y1="83" x2="219" y2="160" stroke="#01696f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="none"/>
  <!-- cos label -->
  <text x="187" y="174" font-size="11" fill="#006494" font-weight="700" text-anchor="middle">cosθ</text>
  <!-- sin label -->
  <text x="230" y="126" font-size="11" fill="#01696f" font-weight="700">sinθ</text>
  <!-- Range summary boxes -->
  <rect x="290" y="44" width="210" height="52" rx="8" fill="#fff" stroke="#006494" stroke-width="2"/>
  <text x="395" y="64" font-size="12" fill="#006494" font-weight="700" text-anchor="middle">cos θ range</text>
  <text x="395" y="84" font-size="13" fill="#28251d" text-anchor="middle">[−1, 1]</text>
  <text x="395" y="97" font-size="10" fill="#7a7974" text-anchor="middle">(x-coord on unit circle)</text>
  <rect x="290" y="112" width="210" height="52" rx="8" fill="#fff" stroke="#01696f" stroke-width="2"/>
  <text x="395" y="132" font-size="12" fill="#01696f" font-weight="700" text-anchor="middle">sin θ range</text>
  <text x="395" y="152" font-size="13" fill="#28251d" text-anchor="middle">[−1, 1]</text>
  <text x="395" y="165" font-size="10" fill="#7a7974" text-anchor="middle">(y-coord on unit circle)</text>
  <rect x="290" y="180" width="210" height="52" rx="8" fill="#fff" stroke="#437a22" stroke-width="2"/>
  <text x="395" y="200" font-size="12" fill="#437a22" font-weight="700" text-anchor="middle">tan θ range</text>
  <text x="395" y="220" font-size="13" fill="#28251d" text-anchor="middle">(−∞, ∞) = all reals</text>
  <text x="395" y="233" font-size="10" fill="#7a7974" text-anchor="middle">(sin/cos, no bound)</text>
  <!-- Note box -->
  <rect x="290" y="248" width="210" height="44" rx="8" fill="#cedcd8" stroke="#01696f" stroke-width="1"/>
  <text x="395" y="266" font-size="11" fill="#0c4e54" text-anchor="middle" font-weight="600">Amplitude transformations</text>
  <text x="395" y="282" font-size="11" fill="#0c4e54" text-anchor="middle">y = a·sinθ → range [−|a|, |a|]</text>
  <!-- footer -->
  <text x="155" y="294" font-size="11" fill="#7a7974" text-anchor="middle">Projections onto axes give the ranges</text>
</svg>