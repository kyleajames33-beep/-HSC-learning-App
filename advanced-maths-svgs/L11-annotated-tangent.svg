<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter,Helvetica Neue,sans-serif">
  <rect width="520" height="300" fill="#f7f6f2" rx="12"/>
  <text x="260" y="22" font-size="13" font-weight="700" fill="#7a7974" text-anchor="middle" letter-spacing="0.07em">GRAPH OF y = tan x — L11</text>
  <!-- axes -->
  <line x1="30" y1="150" x2="500" y2="150" stroke="#bab9b4" stroke-width="1.5"/>
  <line x1="260" y1="20" x2="260" y2="280" stroke="#bab9b4" stroke-width="1.5"/>
  <!-- x labels -->
  <text x="60" y="165" font-size="10" fill="#7a7974" text-anchor="middle">−π</text>
  <text x="150" y="165" font-size="10" fill="#7a7974" text-anchor="middle">−π/2</text>
  <text x="260" y="165" font-size="10" fill="#7a7974" text-anchor="middle">0</text>
  <text x="370" y="165" font-size="10" fill="#7a7974" text-anchor="middle">π/2</text>
  <text x="460" y="165" font-size="10" fill="#7a7974" text-anchor="middle">π</text>
  <!-- y labels -->
  <text x="250" y="104" font-size="10" fill="#7a7974" text-anchor="end">1</text>
  <text x="250" y="204" font-size="10" fill="#7a7974" text-anchor="end">−1</text>
  <line x1="258" y1="100" x2="262" y2="100" stroke="#7a7974" stroke-width="1"/>
  <line x1="258" y1="200" x2="262" y2="200" stroke="#7a7974" stroke-width="1"/>
  <!-- Asymptotes -->
  <line x1="150" y1="24" x2="150" y2="276" stroke="#a12c7b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="370" y1="24" x2="370" y2="276" stroke="#a12c7b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Asymptote labels -->
  <text x="150" y="18" font-size="10" fill="#a12c7b" text-anchor="middle">x = −π/2</text>
  <text x="370" y="18" font-size="10" fill="#a12c7b" text-anchor="middle">x = π/2</text>
  <!-- Tan curve segment 1: from -pi to -pi/2 (x: 60 to 150) -->
  <path d="M 65,272 C 90,240 120,200 150,150 C 155,144 148,110 146,30" fill="none" stroke="#437a22" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tan curve segment 2: from -pi/2 to pi/2 (x: 150 to 370) -->
  <path d="M 154,270 C 170,230 210,175 260,150 C 310,125 350,80 366,30" fill="none" stroke="#437a22" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tan curve segment 3: from pi/2 to pi (x: 370 to 460) -->
  <path d="M 374,270 C 390,240 420,200 460,150 C 465,144 458,110 456,30" fill="none" stroke="#437a22" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Key points -->
  <circle cx="260" cy="150" r="4" fill="#437a22" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="315" cy="100" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <circle cx="205" cy="200" r="4" fill="#da7101" stroke="#f7f6f2" stroke-width="1.5"/>
  <text x="320" y="94" font-size="9" fill="#da7101">(π/4, 1)</text>
  <text x="160" y="210" font-size="9" fill="#da7101">(−π/4, −1)</text>
  <!-- Period annotation -->
  <line x1="60" y1="285" x2="460" y2="285" stroke="#006494" stroke-width="1.5"/>
  <line x1="60" y1="280" x2="60" y2="290" stroke="#006494" stroke-width="1.5"/>
  <line x1="460" y1="280" x2="460" y2="290" stroke="#006494" stroke-width="1.5"/>
  <text x="260" y="298" font-size="10" fill="#006494" font-weight="700" text-anchor="middle">Period T = π</text>
  <!-- axis labels -->
  <text x="498" y="146" font-size="11" fill="#7a7974" font-style="italic">x</text>
  <text x="264" y="18" font-size="11" fill="#7a7974" font-style="italic">y</text>
</svg>